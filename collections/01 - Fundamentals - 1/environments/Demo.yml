name: Demo
variables:
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
  - name: breweryUrl
    value: https://api.openbrewerydb.org/v1
  - name: dummyUrl
    value: https://dummyjson.com
  - name: weatherUrl
    value: https://api.open-meteo.com/v1
  - name: newsUrl
    value: https://newsapi.org/v2
  - name: postId
    value: "1"
  - name: userId
    value: "1"
  - name: releaseStage
    value: demo
  - name: retryLimit
    value:
      type: number
      data: "2"
  - name: verboseLogging
    value:
      type: boolean
      data: "true"
  - name: featureFlags
    value:
      type: object
      data: |-
        {
          "betaSearch": true,
          "newAuthFlow": false,
          "maxBatchSize": 25
        }
  - name: tokenVar
    value: environmentToken
  - secret: true
    name: password
    description: ""
  - secret: true
    name: username
    description: ""
