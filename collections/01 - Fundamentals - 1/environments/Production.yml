name: Production
color: "#CE4F3B"
variables:
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
  - name: breweryUrl
    value: https://api.openbrewerydb.org/v1
  - name: dummyUrl
    value: https://dummyjson.com
  - name: weatherUrl
    value: https://api.open-meteo.com/v1
  - name: newsUrl
    value: https://newsapi.org/v2
  - name: postId
    value: "1"
  - name: userId
    value: "1"
  - name: releaseStage
    value: production
  - name: retryLimit
    value:
      type: number
      data: "3"
  - name: verboseLogging
    value:
      type: boolean
      data: "false"
  - name: featureFlags
    value:
      type: object
      data: |-
        {
          "betaSearch": false,
          "newAuthFlow": false,
          "maxBatchSize": 100
        }
