info:
  name: Get Post
  type: http
  seq: 1
  tags:
    - smoke
    - regression

http:
  method: GET
  url: "{{baseUrl}}/posts/{{postId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // after-response runs once the reply is back. Global env vars are
        // workspace-wide (loaded with --global-env) and sit at the bottom of
        // the precedence order - see "Variable Inspector" in the next folder.
        const globalVar = bru.getGlobalEnvVar('apiVersion');
        console.log('apiV: ' + globalVar);
    - type: tests
      code: |-
        // Each test() is one named row in the app's Tests tab and one case in
        // the CLI / JUnit report. expect() is Chai - no imports needed.
        test("status code is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("content-type is JSON", function() {
          expect(res.getHeader('content-type')).to.include('application/json');
        });

        test("response time is below 2000ms", function() {
          expect(res.getResponseTime()).to.be.below(2000);
        });

        test("response has userId as number", function() {
          expect(res.getBody()).to.have.property('userId');
          expect(res.getBody().userId).to.be.a('number');
        });

        test("response has id as number", function() {
          expect(res.getBody()).to.have.property('id');
          expect(res.getBody().id).to.be.a('number');
        });

        test("response has title as string", function() {
          expect(res.getBody()).to.have.property('title');
          expect(res.getBody().title).to.be.a('string');
        });

        test("response has body as string", function() {
          expect(res.getBody()).to.have.property('body');
          expect(res.getBody().body).to.be.a('string');
        });

        test("post id matches requested postId", function() {
          // Env vars come back as strings, so cast before comparing to a number
          expect(res.getBody().id).to.equal(Number(bru.getEnvVar('postId')));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      disabled: true
    - expression: res.body
      operator: isJson
      disabled: true
    - expression: res.body.id
      operator: isNumber
      disabled: true

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## GET /posts/:id

  Fetches a single blog post from JSONPlaceholder.

  **CLI tip:** Run with `--env-var postId=5` to fetch a different post:
  ```bash
  bru run "01-Basic-Requests/01-Get Post.yml" --env Production --env-var postId=5
  ```
