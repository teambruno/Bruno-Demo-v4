info:
  name: Bruno Variable Precedence
  type: http
  seq: 1

http:
  method: GET
  url: https://www.httpfaker.com?token={{tokenVar}}
  headers:
    - name: ""
      value: ""
  params:
    - name: token
      value: "{{tokenVar}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: tokenVar
      value: tokenRequest
      description: Request-scoped var - beats the environment, loses to setVar. Enable it to watch it take over.
      disabled: true
  scripts:
    - type: before-request
      code: |-
        // Three scopes all define tokenVar. Highest wins:
        //   1. runtime  bru.setVar() below      -> tokenRuntime   <- wins
        //   2. request  the var above           -> tokenRequest   (disabled)
        //   3. environment  Demo.yml            -> environmentToken
        //
        // Send it and read the resolved ?token= on the request URL. Then
        // comment out this line, or enable/disable the request var, and send
        // again - the value walks down the list.
        const tokenValue = 'tokenRuntime';
        bru.setVar('tokenVar',tokenValue);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
