opencollection: 1.0.0

info:
  name: 01 - Fundamentals
  version: v1.0.0
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |-
    # 🎓 01 - Fundamentals

    > **Start here.** Basic CRUD requests, variable precedence, and chained requests — all against free public test APIs (JSONPlaceholder, DummyJSON, NewsAPI, Bruno's echo service). Data-driven runs moved to `02 - Auth and Scripting/05-Data-Driven`.

    ---

    ## 📚 What's Inside

    | # | Folder | Requests | Focus |
    |---|--------|:--------:|-------|
    | 01 | 🌐 **Basic-Requests** | 8 | Core CRUD operations & HTTP verbs |
    | 02 | 🔧 **Variables-and-Environments** | 2 | Variable precedence & scoping |
    | 03 | 🔗 **Chained-Requests** | 2 | Passing data between requests |
    | 05 | 🧩 **Shared-Scripts** | 1 | Reusable workspace scripts |

    ---

    ## 🚀 Quick Start

    ### ▶️ Run the entire collection
    ```bash
    bru run --env Production
    ```

    ### 📁 Run a specific folder
    ```bash
    bru run "01-Basic-Requests" --env Production
    ```

    ### 📈 Generate reports (JSON + HTML + JUnit)
    ```bash
    bru run --env Production \
      --reporter-json reports/results.json \
      --reporter-html reports/results.html \
      --reporter-junit reports/results.xml
    ```

    ### 🛠️ Shared scripts (requires developer sandbox)
    ```bash
    # Folders that require() workspace shared scripts need the developer sandbox
    bru run "05-Shared-Scripts" --env Production --sandbox=developer
    ```

    ---

    ## 💡 Tips

    - 🧪 Use `--env Production` to load the correct `baseUrl` and other environment variables.
    - 🔐 Secrets like `password` and `globalApiKey` are stored as secret variables — never hard-code them.
    - 📝 Add `--verbose` for detailed logs while debugging.

    Happy testing! 🎉
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
