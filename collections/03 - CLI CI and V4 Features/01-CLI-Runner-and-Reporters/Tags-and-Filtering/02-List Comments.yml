info:
  name: List Comments
  type: http
  seq: 2
  tags:
    - smoke
    - regression

http:
  method: GET
  url: "{{baseUrl}}/comments"
  params:
    - name: postId
      value: "1"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        const comments = res.getBody();

        test("status is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("returns an array of comments", () => {
          expect(comments).to.be.an("array").with.length.greaterThan(0);
        });

        test("each comment has name, email, body", () => {
          comments.forEach((c, i) => {
            expect(c, `comment[${i}]`).to.have.property("name").that.is.a("string");
            expect(c, `comment[${i}]`).to.have.property("email").that.matches(/@/);
            expect(c, `comment[${i}]`).to.have.property("body").that.is.a("string");
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
