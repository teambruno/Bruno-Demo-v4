info:
  name: 02-Bruno Secret Variable
  type: http
  seq: 2
  tags:
    - local-secrets

http:
  method: POST
  url: "{{echoUrl}}"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "source": "{{providerLabel}}",
        "appOnlySecret": "{{appOnlySecret}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        const value = body.appOnlySecret;

        // Passes in both the app and the CLI on purpose - the two behave
        // differently here and that difference IS the lesson.
        test("reference resolved (not left as a raw template)", () => {
          expect(res.getStatus()).to.equal(200);
          expect(value, "appOnlySecret").to.be.a("string").and.not.include("{{");
        });

        if (value === "") {
          console.log(
            "appOnlySecret is empty -> running under the CLI. Bruno secret " +
            "variables live in the OS keychain and deliberately do not travel " +
            "to CI. Use .env or a secret manager for pipelines."
          );
        } else {
          console.log(
            "appOnlySecret resolved from the OS keychain -> running in the app."
          );
        }

docs: |-
  ## Bruno's own secret variables

  Open **Demo-Local** in the Environment settings. `appOnlySecret` is marked
  secret, so Bruno stores its value in the OS keychain and writes nothing to
  `Demo-Local.yml`.

  The demo move: set a value in the app, run this request, watch it come
  back. Then open `environments/Demo-Local.yml` and show `git status` is
  clean. The secret was used but never written to disk, so there is nothing
  to leak in a commit.

  ### The honest caveat, which is worth volunteering

  Run the same request through the CLI and `appOnlySecret` comes back empty.
  Keychain-backed values are local to the machine and the app; they do not
  travel to CI. Verified: a `secret: true` variable resolves to `""` under
  the CLI, and it stays `""` even if someone hand-writes a `value:` into the
  file.

  So the three sources have a clear division of labour, which is really what
  this collection is for:

  | Source | Good for | Works in CI |
  |--------|----------|-------------|
  | Bruno secret var | a value on your own machine, kept out of git | no |
  | `.env` | local runs and CI, via a masked variable | yes |
  | Secret manager | shared, rotated, audited credentials | yes |

  Saying "this one does not work in CI" before they find it themselves tends
  to buy more credibility than it costs.
