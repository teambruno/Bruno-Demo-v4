info:
  name: 01-Secret from dotenv
  type: http
  seq: 1
  tags:
    - local-secrets

http:
  method: POST
  url: "{{echoUrl}}"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "source": "{{providerLabel}}",
        "signingSecret": "{{dotenvWebhookSecret}}",
        "stripeKey": "{{dotenvStripeKey}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("values came out of the .env file", () => {
          expect(res.getStatus()).to.equal(200);
          expect(body.signingSecret, "signingSecret")
            .to.be.a("string").and.not.include("{{");
          expect(body.stripeKey, "stripeKey")
            .to.be.a("string").and.not.include("{{");
        });

        // Prefix checks, not full-value checks - enough to prove the real
        // .env entry resolved without pinning the secret into a committed file.
        test("shapes match the .env entries", () => {
          expect(body.signingSecret).to.match(/^whsec_/);
          expect(body.stripeKey).to.match(/^sk_test_/);
        });

        console.log(`source: ${body.source}`);

docs: |-
  ## Secrets from a `.env` file

  The lowest-friction option, and where most teams actually are. `.env` sits
  at the workspace root, is gitignored, and every key in it is available as
  `{{process.env.NAME}}`. Only `.env.example` is committed, with fake values,
  so a new joiner knows what to fill in.

  This request reads two of them via the `dotenvWebhookSecret` and
  `dotenvStripeKey` indirections in **Demo-Local**.

  ### The bit worth showing

  Run it with a reporter and open the report:

  ```bash
  bru run "02-Local-Secrets" --env Demo-Local \
    --reporter-json /tmp/dotenv-demo.json
  ```

  The request succeeds - the real secret went on the wire, which is why the
  `whsec_` and `sk_test_` prefix assertions pass. But in the report those
  values are written as `********`. Bruno masks `process.env` values in
  reporter output automatically, so a CI artifact published from a pipeline
  does not leak them.

  That is the answer to "what stops our secrets ending up in the build logs",
  and it needs no configuration.
