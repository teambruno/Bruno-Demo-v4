docs:
  content: |-
    # Requests backed by an external secret manager

    Run these top to bottom on `Demo-Azure`, then switch the environment
    dropdown to `Demo-AWS` or `Demo-HashiCorp` and run them again. Nothing
    in these five files changes between providers.

    1. **Resolve Secret Value** - proves the binding works and shows the
       resolved value echoed back. Start here; if this 200s, the store
       connection and the read permission are both good. The only request
       that echoes a secret in the clear, and it deliberately uses the one
       whose value (`passwd`) is already public in request 3's own URL.
    2. **OAuth2 Client Secret** - the one that lands. A real
       client-credentials exchange whose `clientSecret` comes from the
       store instead of sitting in committed YAML.
    3. **Digest Auth Password** - 200 with the stored value, 401 without.
       Proof the secret is actually gating something.
    4. **Login Password** - real login returning a real JWT.
    5. **Sign Webhook Payload - HMAC** - the secret never leaves a script;
       only the derived signature goes on the wire.

    Everything here runs against `httpfaker.org`, which Bruno owns, so a
    third-party outage cannot take the demo down.

    ## If request 1 fails

    - **403 / Forbidden** - creating the vault does not grant read access.
      On Azure you need the **Key Vault Secrets User** role on your own
      identity; the equivalent on AWS is `secretsmanager:GetSecretValue`.
    - **Unresolved `{{secretStore.…}}`** - the environment has no
      `externalSecrets` block, or you are on an environment from a
      different collection.
  type: text/markdown
