info:
  name: 02-OAuth2 Client Secret
  type: http
  seq: 2
  tags:
    - secret-store

http:
  method: GET
  url: "{{oauthUrl}}/resource?access_token"
  params:
    - name: access_token
      value: ""
      type: query
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{oauthUrl}}/token"
    credentials:
      clientId: demo-client-id
      clientSecret: "{{secretStore.oauth-client-secret}}"
      placement: body
    scope: user:read
    tokenConfig:
      id: credentials
      placement:
        query: access_token
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false

runtime:
  scripts:
    - type: before-request
      code: |-
        // ---------------------------------------------------------------------------
        // Example: fetch a secret from an external vault before the request fires.
        //
        // Bruno ships with first-class support for a handful of secret stores, but
        // you can integrate with *any* vault (HashiCorp Vault, AWS Secrets Manager,
        // GCP Secret Manager, 1Password Connect, Doppler, Infisical, CyberArk, etc.)
        // from a pre-request script using `bru.sendRequest`.
        //
        // The pattern is always the same:
        //   1. Authenticate to the vault (token from env / process env — never inline).
        //   2. Fetch the secret value.
        //   3. Stash it in a runtime variable so the request (and later scripts) can
        //      reference it via {{...}} without it ever being written to disk.
        //
        // Runtime vars (`bru.setVar`) are in-memory only — they disappear when the
        // collection run ends, which is exactly what you want for a secret.
        // ---------------------------------------------------------------------------

        // --- 1. Vault connection details ------------------------------------------
        // Non-secret config (URL, secret path) lives in an environment variable.
        // The vault access token itself comes from the OS environment via
        // `bru.getProcessEnv` so it is never committed to the collection.
        const vaultUrl   = bru.getEnvVar('vaultUrl');           // e.g. https://vault.example.com
        const vaultPath  = bru.getEnvVar('vaultSecretPath');    // e.g. /v1/secret/data/oauth/client
        const vaultToken = bru.getProcessEnv('VAULT_TOKEN');    // exported in your shell / CI

        if (!vaultUrl || !vaultToken) {
          throw new Error('Vault not configured: set vaultUrl (env) and VAULT_TOKEN (process env).');
        }

        // --- 2. Fetch the secret ---------------------------------------------------
        // `bru.sendRequest` performs a real HTTP call from inside the script.
        // Wrap it in a small helper so the await/callback shape is easy to read.
        const fetchSecret = () => new Promise((resolve, reject) => {
          bru.sendRequest(
            {
              method: 'GET',
              url: `${vaultUrl}${vaultPath}`,
              headers: {
                // HashiCorp Vault style — swap for `Authorization: Bearer ...`,
                // `X-Vault-Token`, AWS SigV4, etc. depending on your provider.
                'X-Vault-Token': vaultToken,
                'Accept': 'application/json',
              },
            },
            (err, res) => (err ? reject(err) : resolve(res)),
          );
        });

        const vaultRes = await fetchSecret();

        // Defensive: bail loudly if the vault call failed, otherwise the outgoing
        // request would silently go out with an empty token.
        if (!vaultRes || vaultRes.status !== 200) {
          throw new Error(`Vault fetch failed: HTTP ${vaultRes && vaultRes.status}`);
        }

        // --- 3. Extract and expose the secret --------------------------------------
        // Response shape shown here matches HashiCorp Vault KV v2 (`data.data.<key>`).
        // Adjust the path for your provider (e.g. AWS returns `SecretString`).
        const body        = vaultRes.body || {};
        const clientSecret = body.data && body.data.data && body.data.data['client_secret'];

        if (!clientSecret) {
          throw new Error('client_secret not found in vault response.');
        }

        // Runtime var — referenced from the request as {{oauthClientSecret}}.
        // Not persisted, not written to any .bru file.
        bru.setVar('oauthClientSecret', clientSecret);

        // Optional: also patch a header directly if the request needs it now.
        // req.setHeader('Authorization', `Bearer ${clientSecret}`);
    - type: tests
      code: |-
        test("token exchange succeeded with the vault secret", () => {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ### The one to lead with

  Compare this against
  `02 - Auth and Scripting/01-Authentication/Client-Credentials/Get Token - OAuth2.yml`
  before it was migrated - it carried the credential inline:

  ```yml
  credentials:
    clientId: demo-client-id
    clientSecret: demo-client-secret   # committed to git
  ```

  Here the same field reads `{{secretStore.oauth-client-secret}}`. Put the two
  files side by side on screen; that is the whole before/after in one
  frame.

  This is a genuine client-credentials exchange against httpfaker, not an
  echo endpoint - a wrong secret returns 401, so the 200 is real evidence
  the vault value was correct.

  `scope=user:read` is required by this token endpoint; dropping it 401s
  even when the secret is right.
