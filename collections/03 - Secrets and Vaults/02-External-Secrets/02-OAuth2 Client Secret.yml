info:
  name: 02-OAuth2 Client Secret
  type: http
  seq: 2
  tags:
    - secret-store

http:
  method: GET
  url: "{{oauthUrl}}/resource?access_token"
  params:
    - name: access_token
      value: ""
      type: query
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{oauthUrl}}/token"
    credentials:
      clientId: demo-client-id
      clientSecret: "{{secretStore.oauth-client-secret}}"
      placement: body
    scope: user:read
    tokenConfig:
      id: credentials
      placement:
        query: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false

runtime:
  scripts:
    - type: tests
      code: |-
        test("token exchange succeeded with the vault secret", () => {
          expect(res.getStatus()).to.equal(200);
        });

docs: |-
  ### The one to lead with

  Compare this against
  `02 - Auth and Scripting/01-Authentication/Client-Credentials/Get Token - OAuth2.yml`
  before it was migrated - it carried the credential inline:

  ```yml
  credentials:
    clientId: demo-client-id
    clientSecret: demo-client-secret   # committed to git
  ```

  Here the same field reads `{{secretStore.oauth-client-secret}}`. Put the two
  files side by side on screen; that is the whole before/after in one
  frame.

  This is a genuine client-credentials exchange against httpfaker, not an
  echo endpoint - a wrong secret returns 401, so the 200 is real evidence
  the vault value was correct.

  `scope=user:read` is required by this token endpoint; dropping it 401s
  even when the secret is right.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
