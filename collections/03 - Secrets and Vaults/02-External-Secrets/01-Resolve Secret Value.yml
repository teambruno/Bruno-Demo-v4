info:
  name: 01-Resolve Secret Value
  type: http
  seq: 1
  tags:
    - secret-store

http:
  method: POST
  url: "{{httpfakerUrl}}/api/echo"
  headers:
    - name: content-type
      value: application/json
    - name: x-secret-probe
      value: "{{secretStore.basic-auth-password}}"
      description: connectivity check only - see docs for why this value is safe to echo
  body:
    type: json
    data: |-
      {
        "provider": "{{providerLabel}}"
      }
  auth: inherit

runtime:
  variables:
    - name: secretStore.basic-auth-password
      value: editattempt
  scripts:
    - type: tests
      code: |-
        const echo = res.getBody();

        // httpfaker's /api/echo returns { url, method, headers, body }.
        // Header keys come back lowercased and `body` is the raw request body
        // as a string - both differ from what httpbin used to return.
        const sent = echo.headers["x-secret-probe"];
        const payload = JSON.parse(echo.body);

        test("secret store binding resolved", () => {
          expect(res.getStatus()).to.equal(200);
          expect(sent, "header reached the wire").to.be.a("string");
          expect(sent, "still an unresolved template").to.not.include("{{");
          expect(sent, "empty - key missing from the store").to.not.equal("");
        });

        test("provider is the one selected in the dropdown", () => {
          expect(payload.provider).to.equal(bru.getEnvVar("providerLabel"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Does the binding work at all?

  Run this first. `httpfaker.org/api/echo` hands the request back to you, so
  you can see the value that actually came out of the store. If this 200s, the
  connection and the read permission are both good and the rest of the folder
  will work.

  **Why echoing this particular secret is fine.** This is the only request in
  the folder that puts a stored value on the wire in the clear. It uses
  `basic-auth-password`, whose value is `passwd` - the same string that sits
  in request 03's own URL. It is public by construction, so there is nothing
  to leak. Every other request here either sends its secret inside an auth
  exchange or, in the case of 05, never sends it at all.

  The assertion to point at is `to.not.include("{{")`. An unresolved Bruno
  template is sent literally rather than erroring, so a request can look like
  it succeeded while shipping the string `{{secretStore.basic-auth-password}}`
  as a credential. That silent-pass is the failure mode worth showing.

  ### Note on the echo shape

  `/api/echo` is POST-only and returns `{ url, method, headers, body }` with
  **lowercased** header keys and `body` as a raw string. That is why the test
  reads `headers["x-secret-probe"]` and `JSON.parse(echo.body)` rather than
  httpbin's old `headers["X-..."]` / `args` shape.
