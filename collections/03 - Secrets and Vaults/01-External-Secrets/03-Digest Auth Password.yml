info:
  name: 03-Digest Auth Password
  type: http
  seq: 3
  tags:
    - secret-store

http:
  method: GET
  url: "{{httpfakerUrl}}/api/auth/digest/auth/user/passwd"
  auth:
    type: digest
    username: user
    password: "{{secretStore.basic-auth-password}}"

runtime:
  variables:
    - name: secretStore.basic-auth-password
      value: modified
  scripts:
    - type: tests
      code: |-
        test("authenticated with the stored password", () => {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Proof the secret gates something

  `httpfaker.org/api/auth/digest/{qop}/{user}/{passwd}` returns **200** only
  when the credentials match the pair in the path, and **401** for anything
  else. The password comes from `{{secretStore.basic-auth-password}}`.

  The demo move: change the secret's value in the provider console, re-run
  without touching Bruno, watch it 401. Then change it back. That is the
  answer to "so the store is really the source of truth?" - and it is worth
  more than any number of green checkmarks.

  ### Why digest rather than basic

  This used to hit `httpbin.org/basic-auth/user/passwd`. httpbin is
  Postman-owned, so when it goes down our demos go with it. httpfaker is ours
  - but it has no basic-auth endpoint, only digest. The swap keeps what
  actually matters here (a real credential check that 200s or 401s, driven by
  a value from the secret store) and costs nothing, since the point of this
  request was never the auth scheme.

  Verified: correct password 200, wrong password 401.
