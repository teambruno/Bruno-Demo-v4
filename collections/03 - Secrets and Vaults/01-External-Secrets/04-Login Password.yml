info:
  name: 04-Login Password
  type: http
  seq: 4
  tags:
    - secret-store

http:
  method: POST
  url: "{{dummyUrl}}/auth/login"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "jamesd",
        "password": "{{secretStore.dummyjson-password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.accessToken) {
          // setVar, not setEnvVar - a vault-derived token should stay in
          // memory for the run and never be written back to disk.
          bru.setVar("vaultLoginToken", body.accessToken);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("real login with the vault password", () => {
          expect(res.getStatus()).to.equal(200);
          expect(body).to.have.property("accessToken");
          expect(body.username).to.equal("jamesd");
        });

docs: |-
  ### A real credential, a real JWT

  `dummyjson.com/auth/login` returns a signed JWT for a real user record
  (James Davis, id 4). The password is pulled from the vault, so the
  session token is genuinely derived from a secret you never committed.

  Worth calling out the `bru.setVar()` in the post-response script. V4
  made `bru.setEnvVar()` write to disk immediately - so a vault-sourced
  token stored with `setEnvVar` would land in the environment file and
  undo the entire point of the vault. `setVar` keeps it run-scoped and in
  memory. See
  `04 - CLI CI and V4 Features/03-v4 Updates/02-setVar vs setEnvVar Persistence.yml`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
