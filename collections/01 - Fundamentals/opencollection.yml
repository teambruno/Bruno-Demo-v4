opencollection: 1.0.0

info:
  name: 01 - Fundamentals
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |-
    # 01 - Fundamentals

    Start here. Basic CRUD requests, variable precedence, chained requests,
    and a data-driven run - all against free public test APIs
    (JSONPlaceholder, DummyJSON, NewsAPI, Bruno's echo service).

    ```bash
    bru run --env Production
    bru run "01-Basic-Requests" --env Production
    bru run --env Production --reporter-json reports/results.json --reporter-html reports/results.html --reporter-junit reports/results.xml
    bru run "04-Data-Driven" --env Production --csv-file-path "04-Data-Driven/users.csv"

    # Folders that require() workspace shared scripts need the developer sandbox
    bru run "05-Shared-Scripts" --env Production --sandbox=developer
    ```
  type: text/markdown
bundled: false
extensions:
  bruno:
    scripts:
      # Workspace-level shared JS modules, relative to this collection root.
      # See /shared-scripts/README.md
      additionalContextRoots:
        - "../../shared-scripts"
