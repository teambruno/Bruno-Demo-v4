docs:
  content: |-
    ## 05 – Data-Driven Testing

    Bruno CLI can iterate a request over every row in a CSV file using `--csv-file-path`.
    Each row injects its columns as Bruno variables for that iteration.

    ### CSV file: `users.csv`
    | userId | expectedName         | expectedEmail              |
    |--------|----------------------|----------------------------|
    | 1      | Leanne Graham        | Sincere@april.biz          |
    | 2      | Ervin Howell         | Shanna@melissa.tv          |
    | 3      | Clementine Bauch     | Nathan@yesenia.net         |
    | 4      | Patricia Lebsack     | Julianne.OConner@kory.org  |
    | 5      | Chelsey Dietrich     | Lucio_Hettinger@annie.ca   |

    ```bash
    # Run the data-driven folder — iterates once per CSV row
    bru run "05-Data-Driven" --env Production \
      --csv-file-path "05-Data-Driven/users.csv"

    # Combine with reporters
    bru run "05-Data-Driven" --env Production \
      --csv-file-path "05-Data-Driven/users.csv" \
      --reporter-html reports/data-driven.html
    ```
  type: text/markdown
