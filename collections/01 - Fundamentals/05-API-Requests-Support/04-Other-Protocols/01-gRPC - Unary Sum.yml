grpc:
  url: https://grpcb.in/
  method: /addsvc.Add/Sum
  methodType: unary
  message: |-
    {
      "a": 988,
      "b": 67
    }
  auth: inherit

docs:
  content: |-
    ## gRPC - unary call

    Native gRPC request type: point at the server, Bruno pulls the service
    list via reflection (or a `.proto` you import), pick the method, send a
    JSON message. `grpcb.in` is a public echo/test server - `Sum` returns
    `{ "v": 1055 }`.

    Streaming methods (server, client, bidi) are demoed in
    `04 - CLI CI and V4 Features / 02-Additional-Request-Types / gRPC-Scripting`.
  type: text/markdown
