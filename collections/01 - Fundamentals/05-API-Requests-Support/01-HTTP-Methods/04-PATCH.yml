info:
  name: PATCH
  type: http
  seq: 4
  tags:
    - api-parity
    - http-methods

http:
  method: PATCH
  url: "{{baseUrl}}/posts/{{postId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {"title": "Bruno demo (patched)"}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("only the title changed, other fields kept", () => {
          expect(res.getBody().title).to.equal("Bruno demo (patched)");
          expect(res.getBody().userId).to.equal(1);
          expect(res.getBody().body).to.be.a("string").and.not.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## PATCH /posts/{{postId}}

  PATCH: partial update - send one field, the rest is preserved.

  Same request shape as the old tool - method dropdown, URL, Params / Body /
  Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is
  a free fake REST API that answers every verb with a realistic response.
