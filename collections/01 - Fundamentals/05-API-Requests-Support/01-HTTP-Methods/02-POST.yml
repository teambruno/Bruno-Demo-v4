info:
  name: POST
  type: http
  seq: 2
  tags:
    - api-parity
    - http-methods

http:
  method: POST
  url: "{{baseUrl}}/posts"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {"title": "Bruno demo", "body": "created from the API Parity folder", "userId": 1}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201 Created", () => {
          expect(res.status).to.equal(201);
        });

        test("server assigned an id and echoed the body", () => {
          expect(res.getBody().id).to.be.a("number");
          expect(res.getBody().title).to.equal("Bruno demo");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## POST /posts

  POST: create. JSON body in, `201 Created` and a new `id` back.

  Same request shape as the old tool - method dropdown, URL, Params / Body /
  Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is
  a free fake REST API that answers every verb with a realistic response.
