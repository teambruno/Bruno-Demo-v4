name: Demo
extends: Base
color: "#2E8A54"
variables:
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
    description: ""
  - name: breweryUrl
    value: https://api.openbrewerydb.org/v1
    description: ""
  - name: dummyUrl
    value: https://dummyjson.com
    description: ""
  - name: weatherUrl
    value: https://api.open-meteo.com/v1
    description: ""
  - name: newsUrl
    value: https://newsapi.org/v2
    description: ""
  - name: echoUrl
    value: https://www.httpfaker.org
    description: Bruno-owned echo service (github.com/usebruno/httpfaker) - POST /api/echo returns url, method, headers and raw body as JSON
  - name: soapUrl
    value: https://www.dataaccess.com/webservicesserver
    description: public SOAP 1.1 / 1.2 service (NumberConversion.wso)
  - name: graphqlUrl
    value: https://countries.trevorblades.com/graphql
    description: public GraphQL endpoint, no auth
  - name: postId
    value: "1"
    description: ""
  - name: userId
    value: "1"
    description: ""
  - name: releaseStage
    value: demo
    description: ""
  - name: retryLimit
    value:
      type: number
      data: "2"
    description: number - arrives in scripts as 2, not "2", so arithmetic just works
  - name: verboseLogging
    value:
      type: boolean
      data: "true"
    description: boolean - use it directly in an if(), no string comparison needed
  - name: featureFlags
    value:
      type: object
      data: |-
        {
          "betaSearch": true,
          "newAuthFlow": false,
          "maxBatchSize": 25
        }
    description: object - read nested keys, e.g. bru.getEnvVar("featureFlags").betaSearch
  - name: tokenVar
    value: demoToken
    description: ""
  - name: header-content-language
    value: demo-en
    description: ""
  - secret: true
    name: password
  - secret: true
    name: username
externalSecrets:
  type: azure-key-vault
  variables:
    - name: secretStore
      vaultName: bruno-demo-kv
