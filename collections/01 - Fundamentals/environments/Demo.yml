name: Demo
color: "#2196F3"
variables:
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
    description: ""
  - name: breweryUrl
    value: https://api.openbrewerydb.org/v1
    description: ""
  - name: dummyUrl
    value: https://dummyjson.com
    description: ""
  - name: weatherUrl
    value: https://api.open-meteo.com/v1
    description: ""
  - name: postId
    value: "1"
    description: ""
  - name: userId
    value: "1"
    description: ""
  - name: releaseStage
    value: demo
    description: ""
  - name: retryLimit
    value:
      type: number
      data: "2"
    description: number - arrives in scripts as 2, not "2", so arithmetic just works
  - name: verboseLogging
    value:
      type: boolean
      data: "true"
    description: boolean - use it directly in an if(), no string comparison needed
  - name: featureFlags
    value:
      type: object
      data: |-
        {
          "betaSearch": true,
          "newAuthFlow": false,
          "maxBatchSize": 25
        }
    description: object - read nested keys, e.g. bru.getEnvVar("featureFlags").betaSearch
  - secret: true
    name: password
    description: ""
externalSecrets:
  type: azure-key-vault
  variables:
    - name: azure-secrets
      vaultName: Demo-James
