name: Production
color: "#CE4F3B"
variables:
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
    description: ""
  - name: breweryUrl
    value: https://api.openbrewerydb.org/v1
    description: ""
  - name: dummyUrl
    value: https://dummyjson.com
    description: ""
  - name: weatherUrl
    value: https://api.open-meteo.com/v1
    description: ""
  - name: newsUrl
    value: https://newsapi.org/v2
    description: ""
  - name: echoUrl
    value: https://www.httpfaker.org
    description: Bruno-owned echo service (github.com/usebruno/httpfaker) - POST /api/echo returns url, method, headers and raw body as JSON
  - name: soapUrl
    value: https://www.dataaccess.com/webservicesserver
    description: public SOAP 1.1 / 1.2 service (NumberConversion.wso)
  - name: graphqlUrl
    value: https://countries.trevorblades.com/graphql
    description: public GraphQL endpoint, no auth
  - name: postId
    value: "1"
    description: ""
  - name: userId
    value: "1"
    description: ""
  - name: releaseStage
    value: production
    description: ""
  - name: retryLimit
    value:
      type: number
      data: "3"
    description: number - arrives in scripts as 3, not "3", so arithmetic just works
  - name: verboseLogging
    value:
      type: boolean
      data: "false"
    description: boolean - use it directly in an if(), no string comparison needed
  - name: featureFlags
    value:
      type: object
      data: |-
        {
          "betaSearch": false,
          "newAuthFlow": false,
          "maxBatchSize": 100
        }
    description: object - read nested keys, e.g. bru.getEnvVar("featureFlags").betaSearch
  - name: tokenVar
    value: productionToken
    description: ""
  - name: header-content-language
    value: prod-en
    description: ""
