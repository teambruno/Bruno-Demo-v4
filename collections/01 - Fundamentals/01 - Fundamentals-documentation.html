        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: 01 - Fundamentals\n  version: v1.0.0\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\nitems:\n  - info:\n      name: 01-Basic-Requests\n      type: folder\n      seq: 1\n    docs:\n      content: |-\n        ## 01 \u2013 Basic Requests\n\n        Demonstrates a simple CRUD flow against [JSONPlaceholder](https://jsonplaceholder.typicode.com),\n        the free fake REST API. No auth required.\n\n        ```bash\n        # Run just this folder with an environment\n        bru run \"01-Basic-Requests\" --env Production\n\n        # Override a single env variable (e.g. fetch post #42 instead of the default)\n        bru run \"01-Basic-Requests\" --env Production --env-var postId=42\n\n        # Override multiple env variables in one command (stack --env-var for each)\n        bru run \"01-Basic-Requests\" --env Production --env-var postId=42 --env-var userId=7\n\n        # Override a collection-level environment variable\n        bru run \"01-Basic-Requests\" --env Production --env-var baseUrl=https://staging.example.com\n\n        # Load the default workspace global env (releaseStage=production, apiVersion=v1)\n        bru run \"01-Basic-Requests\" --env Production --global-env Globals\n\n        # Override global env vars by pointing --global-env at a different global env file\n        # (releaseStage=staging, apiVersion=v2, debugMode=true)\n        bru run \"01-Basic-Requests\" --env Production --global-env Globals-Staging\n\n        # Other workspace global envs: Globals-Local, Globals-CI\n        bru run \"01-Basic-Requests\" --env Production --global-env Globals-CI\n        ```\n      type: text/markdown\n    items:\n      - info:\n          name: Get News Articles\n          type: http\n          seq: 2\n          tags:\n            - demo\n        http:\n          method: GET\n          url: '{{newsUrl}}/everything?q=tesla&sortBy=publishedAt&from={{validDate}}'\n          params:\n            - name: q\n              value: tesla\n              type: query\n            - name: sortBy\n              value: publishedAt\n              type: query\n            - name: from\n              value: '{{validDate}}'\n              type: query\n            - name: from\n              value: '2025-10-01'\n              type: query\n              disabled: true\n          auth:\n            type: apikey\n            key: apiKey\n            value: '{{secretStore.news-api-key}}'\n            placement: query\n        runtime:\n          scripts:\n            - type: before-request\n              code: |-\n                // Get today's date\n                const today = new Date();\n\n                // Subtract 28 days\n                const pastDate = new Date(today);\n                pastDate.setDate(today.getDate() - 28);\n\n                // Format as YYYY-MM-DD\n                const formatted = pastDate.toISOString().split('T')[0];\n\n                // Save as a Bruno variable\n                bru.setVar('validDate', formatted);\n\n                // Optional: log to console\n                console.log('Date 28 days ago:', formatted);\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n            - expression: res.body\n              operator: isJson\n              value: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Get Random Dog Fact\n          type: http\n          seq: 2\n          tags:\n            - demo\n        http:\n          method: GET\n          url: https://dogapi.dog/api/v2/facts\n          headers:\n            - name: Content-Type\n              value: application/json\n              disabled: true\n          params:\n            - name: max_length\n              value: ''\n              type: query\n              disabled: true\n          auth: inherit\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                const responseUrl = res.getUrl();\n                console.log(\"Response URL:\", responseUrl);\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n              disabled: true\n            - expression: res.body\n              operator: isJson\n              value: ''\n              disabled: true\n            - expression: res.body.data\n              operator: isArray\n              value: ''\n              disabled: true\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Get Post\n          type: http\n          seq: 3\n          tags:\n            - smoke\n            - regression\n        http:\n          method: GET\n          url: '{{baseUrl}}/posts/{{postId}}'\n          auth: inherit\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                // after-response runs once the reply is back. Global env vars are\n                // workspace-wide (loaded with --global-env) and sit at the bottom of\n                // the precedence order - see \"Variable Inspector\" in the next folder.\n                const globalVar = bru.getGlobalEnvVar('apiVersion');\n                console.log('apiV: ' + globalVar);\n            - type: tests\n              code: |-\n                // Each test() is one named row in the app's Tests tab and one case in\n                // the CLI / JUnit report. expect() is Chai - no imports needed.\n                test(\"status code is 200\", function() {\n                  expect(res.getStatus()).to.equal(200);\n                });\n\n                test(\"content-type is JSON\", function() {\n                  expect(res.getHeader('content-type')).to.include('application/json');\n                });\n\n                test(\"response time is below 2000ms\", function() {\n                  expect(res.getResponseTime()).to.be.below(2000);\n                });\n\n                test(\"response has userId as number\", function() {\n                  expect(res.getBody()).to.have.property('userId');\n                  expect(res.getBody().userId).to.be.a('number');\n                });\n\n                test(\"response has id as number\", function() {\n                  expect(res.getBody()).to.have.property('id');\n                  expect(res.getBody().id).to.be.a('number');\n                });\n\n                test(\"response has title as string\", function() {\n                  expect(res.getBody()).to.have.property('title');\n                  expect(res.getBody().title).to.be.a('string');\n                });\n\n                test(\"response has body as string\", function() {\n                  expect(res.getBody()).to.have.property('body');\n                  expect(res.getBody().body).to.be.a('string');\n                });\n\n                test(\"post id matches requested postId\", function() {\n                  // Env vars come back as strings, so cast before comparing to a number\n                  expect(res.getBody().id).to.equal(Number(bru.getEnvVar('postId')));\n                });\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n              disabled: true\n            - expression: res.body\n              operator: isJson\n              value: ''\n              disabled: true\n            - expression: res.body.id\n              operator: isNumber\n              value: ''\n              disabled: true\n        settings:\n          encodeUrl: t method: GET\n            response:\n              status: 200\n              statusText: OK\n              headers:\n                - name: date\n                  value: Tue, 25 Aug 2026 16:40:10 GMT\n                - name: content-type\n                  value: application/json\n                - name: content-length\n                  value: '394'\n                - name: connection\n                  value: keep-alive\n                - name: server\n                  value: gunicorn/19.9.0\n                - name: access-control-allow-origin\n                  value: '*'\n                - name: access-control-allow-credentials\n                  value: 'true'\n              body:\n                type: json\n                data: |-\n                  {\n                    \"args\": {},\n                    \"headers\": {\n                      \"Accept\": \"application/json, text/plain, */*\",\n                      \"Accept-Encoding\": \"gzip, compress, deflate, br\",\n                      \"Host\": \"httpbin.org\",\n                      \"Request-Start-Time\": \"1787676009948\",\n                      \"User-Agent\": \"bruno-runtime/4.1.0\",\n                      \"X-Amzn-Trace-Id\": \"Root=1-6a8dc56a-19299d0329a67b965224d1ff\"\n                    },\n                    \"origin\": \"104.178.200.102\",\n                    \"url\": \"https://httpbin.org/get\"\n                  }\n      - info:\n          name: Get Issue Comments (Paths)\n          type: http\n          seq: 8\n          tags:\n            - smoke\n        http:\n          method: GET\n          url: https://api.github.com/repos/:owner/:repo/issues/:issueNumber/comments\n          params:\n            - name: owner\n              value: usebruno\n              type: path\n            - name: repo\n              value: bruno\n              type: path\n            - name: issueNumber\n              value: '100'\n              type: path\n          auth: inherit\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                // Each :name segment in the URL is a path param - Bruno swaps in the\n                // values from the Params tab before sending, so the wire URL is\n                // /repos/usebruno/bruno/issues/100/comments.\n                test(\"status code is 200\", function() {\n                  expect(res.getStatus()).to.equal(200);\n                });\n\n                test(\"all path params resolved in the URL\", function() {\n                  expect(req.getUrl()).to.not.match(/\\/:\\w+/);\n                });\n\n                test(\"every comment belongs to the requested issue\", function() {\n                  expect(res.getBody()).to.be.an('array').that.is.not.empty;\n                  res.getBody().forEach(c => expect(c.issue_url).to.match(/\\/repos\\/usebruno\\/bruno\\/issues\\/100$/));\n                });\n        settings:\n          encodeUrl: true\n          timeout: 10000\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ## GET /repos/:owner/:repo/issues/:issueNumber/comments\n\n          Shows **path parameters**. Every `:name` segment in the URL becomes a row in\n          the Params tab under *Path*. Change `issueNumber` (or point `owner`/`repo` at\n          another public repo) and the URL updates without editing it by hand.\n\n          Uses the public GitHub REST API with no auth, which allows 60 requests per\n          hour per IP.\n  - info:\n      name: 02-Variables-and-Environments\n      type: folder\n      seq: 2\n    docs:\n      content: |-\n        ## 02 - Variables and Environments\n\n        Variable precedence (runtime > folder > environment > collection > global)\n        and prompt-for-input variables. Points at Bruno's own echo.usebruno.com\n        test endpoint.\n      type: text/markdown\n    items:\n      - info:\n          name: Bruno Variable Precedence\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: https://www.httpfaker.com?token={{tokenVar}}\n          headers:\n            - name: Content-Language\n              value: '{{header-content-language}}'\n          params:\n            - name: token\n              value: '{{tokenVar}}'\n              type: query\n          auth: inherit\n        runtime:\n          variables:\n            - name: tokenVar\n              value: tokenRequest\n              description: Request-scoped var - beats the environment, loses to setVar. Enable it to watch it take over.\n              disabled: true\n          scripts:\n            - type: before-request\n              code: |-\n                // Three scopes all define tokenVar. Highest wins:\n                //   1. runtime  bru.setVar() below      -> tokenRuntime   <- wins\n                //   2. request  the var above           -> tokenRequest   (disabled)\n                //   3. environment  Demo.yml            -> environmentToken\n                //\n                // Send it and read the resolved ?token= on the request URL. Then\n                // comment out this line, or enable/disable the request var, and send\n                // again - the value walks down the list.\n                const tokenValue = 'tokenRuntime';\n                bru.setVar('tokenVar',tokenValue);\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Prompt Input Vars\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: https://echo.usebruno.com\n          body:\n            type: json\n            data: |-\n              {\n                \"fName\":\"{{?Enter first name}}\",\n                \"lName\": \"{{?Enter last name}}\"\n              }\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Variable Inspector\n          type: http\n          seq: 3\n          tags:\n            - smoke\n            - regression\n        http:\n          method: GET\n          url: '{{baseUrl}}/posts/{{postId}}'\n          auth: inherit\n        runtime:\n          scripts:\n            - type: before-request\n              code: |-\n                // \u2500\u2500 Variable Inspector \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n                // Bruno resolves variables in this priority order (highest wins):\n                //   3. --env-var       \u2192 overrides collection env vars at runtime\n                //   2. Collection env  \u2192 --env file (e.g. Production.yml)\n                //   1. Global env      \u2192 --global-env file (e.g. Globals.yml)  \u2190 lowest priority\n                //\n                // To override a global env var from the CLI:\n                //   --env-var <key>=<value>  sets the value in the COLLECTION scope,\n                //   which has higher priority and shadows the global value.\n\n                const notSet   = \"(not set)\";\n                const noGlobal = \"(no --global-env loaded)\";\n\n                // releaseStage \u2014 exists in BOTH global env and collection env, so it\n                // demonstrates the full override chain clearly\n                const globalRelease = bru.getGlobalEnvVar(\"releaseStage\") ?? noGlobal;\n                const colRelease    = bru.getEnvVar(\"releaseStage\")        ?? notSet;\n\n                // Other collection env vars\n                const colBaseUrl = bru.getEnvVar(\"baseUrl\") ?? notSet;\n                const colPostId  = bru.getEnvVar(\"postId\")  ?? notSet;\n\n                // Other global env vars\n                const globalApiVer = bru.getGlobalEnvVar(\"apiVersion\") ?? noGlobal;\n                const globalDebug  = bru.getGlobalEnvVar(\"debugMode\")  ?? noGlobal;\n\n                const shadowed = globalRelease !== noGlobal && colRelease !== globalRelease;\n\n                console.log(\"\u2500\u2500 Variable Inspector \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\");\n                console.log(\"\");\n                console.log(\"  releaseStage\");\n                console.log(`    Global env (--global-env)     \u2192 ${globalRelease}`);\n                console.log(`    Collection env (--env-var)    \u2192 ${colRelease}`);\n                console.log(`    \u2726 Used in requests {{...}}    \u2192 ${colRelease}  \u2190 collection wins`);\n                if (shadowed) {\n                  console.log(`    \u26A0 Global value unchanged \u2014 shadowed, NOT overridden`);\n                  console.log(`      bru.getGlobalEnvVar(\"releaseStage\") still returns \"${globalRelease}\"`);\n                  console.log(`      To truly change the global, use --global-env Globals-Staging`);\n                }\n                console.log(\"\");\n                console.log(\"  Other collection env vars\");\n                console.log(`    baseUrl \u2192 ${colBaseUrl}`);\n                console.log(`    postId  \u2192 ${colPostId}`);\n                console.log(\"\");\n                console.log(\"  Other global env vars (read-only from CLI via --env-var)\");\n                console.log(`    apiVersion \u2192 ${globalApiVer}`);\n                console.log(`    debugMode  \u2192 ${globalDebug}`);\n                console.log(\"\");\n                console.log(\"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\");\n            - type: tests\n              code: |-\n                test(\"status is 200\", () => {\n                  expect(res.status).to.equal(200);\n                });\n\n                test(\"baseUrl env var is set\", () => {\n                  expect(bru.getEnvVar(\"baseUrl\")).to.be.a(\"string\").and.not.be.empty;\n                });\n\n                test(\"postId env var is set\", () => {\n                  expect(bru.getEnvVar(\"postId\")).to.be.a(\"string\").and.not.be.empty;\n                });\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n        settings:\n          encodeUrl: true\n          timeout: 10000\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ## Variable Inspector\n\n          A diagnostic request that runs **before** the rest of the folder and prints\n          every key variable \u2014 its source and resolved value \u2014 to the console.\n\n          Variable resolution order \u2014 **highest priority wins**:\n          1. `--env-var`      overrides the collection env scope at runtime\n          2. Collection env   the `--env` file (e.g. `Production.yml`)\n          3. Global env       the `--global-env` file (e.g. `Globals.yml`) \u2014 lowest priority\n\n          `releaseStage` is defined in **both** the global env and the collection env,\n          making it the perfect variable to demonstrate the full override chain.\n\n          ```bash\n          # Baseline \u2014 releaseStage from collection env (Production.yml)\n          bru run \"01-Basic-Requests\" --env Production\n          # releaseStage = production  |  global = (not loaded)\n\n          # Load global env \u2014 collection env still wins for same-named vars\n          bru run \"01-Basic-Requests\" --env Production --global-env Globals\n          # releaseStage = production  |  global = production  (same; collection wins)\n\n          # Shadow the global at runtime \u2014 --env-var changes the COLLECTION scope only.\n          # The global env value is unchanged; {{releaseStage}} in requests uses \"staging\".\n          bru run \"01-Basic-Requests\" --env Production --global-env Globals --env-var releaseStage=staging\n          # releaseStage = staging (collection/runtime)  |  global still = production\n\n          # To truly change a global env variable, swap the --global-env file:\n          bru run \"01-Basic-Requests\" --env Production --global-env Globals-Staging\n          # releaseStage = staging  |  apiVersion = v2  |  debugMode = true\n          ```\n      - info:\n          name: Override Vars\n          type: http\n          seq: 4\n        http:\n          method: GET\n          url: https://www.httpfaker.com?token={{tokenVar}}\n          headers:\n            - name: Content-Language\n              value: '{{header-content-language}}'\n          params:\n            - name: token\n              value: '{{tokenVar}}'\n              type: query\n          auth: inherit\n        runtime:\n          variables:\n            - name: tokenVar\n              value: tokenRequest\n              description: Request-scoped var - beats the environment, loses to setVar. Enable it to watch it take over.\n              disabled: true\n          scripts:\n            - type: before-request\n              code: |-\n                // Three scopes all define tokenVar. Highest wins:\n                //   1. runtime  bru.setVar() below      -> tokenRuntime   <- wins\n                //   2. request  the var above           -> tokenRequest   (disabled)\n                //   3. environment  Demo.yml            -> environmentToken\n                //\n                // Send it and read the resolved ?token= on the request URL. Then\n                // comment out this line, or enable/disable the request var, and send\n                // again - the value walks down the list.\n            - type: after-response\n              code: |-\n                let globalValue = bru.getGlobalEnvVar('releaseStage');\n                console.log('Global var: ' + globalValue);\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n  - info:\n      name: 03-Chained-Requests\n      type: folder\n      seq: 3\n    docs:\n      content: |-\n        ## 02 \u2013 Chained Requests\n\n        Shows how Bruno passes data between requests using `bru.setVar()`.\n        Step 1 fetches a list of products and stores the top-rated product's ID.\n        Step 2 uses that stored ID to fetch the full product detail.\n\n        ```bash\n        bru run \"03-Chained-Requests\" --env Production\n        ```\n      type: text/markdown\n    items:\n      - info:\n          name: Get All Products\n          type: http\n          seq: 1\n          tags:\n            - smoke\n            - regression\n        http:\n          method: GET\n          url: '{{dummyUrl}}/products'\n          params:\n            - name: limit\n              value: '20'\n              type: query\n            - name: sortBy\n              value: rating\n              type: query\n            - name: order\n              value: desc\n              type: query\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                // Chaining, step 1 of 2. The API is already sorted by rating desc,\n                // so products[0] is the top one. Stash what the next request needs -\n                // no copy/pasting an id between tabs.\n                const body = res.getBody();\n                const products = body.products ?? [];\n\n                if (products.length > 0) {\n                  const top = products[0];\n                  bru.setVar(\"topProductId\", top.id);\n                  bru.setVar(\"topProductTitle\", top.title);\n                  bru.setVar(\"topProductRating\", top.rating);\n                  console.log(`Top-rated product: [${top.id}] ${top.title} (rating: ${top.rating})`);\n                }\n            - type: tests\n              code: |-\n                const body = res.getBody();\n\n                test(\"status is 200\", () => {\n                  expect(res.status).to.equal(200);\n                });\n\n                test(\"products array is not empty\", () => {\n                  expect(body.products).to.be.an(\"array\").with.length.greaterThan(0);\n                });\n\n                test(\"first product has an id and rating\", () => {\n                  const first = body.products[0];\n                  expect(first).to.have.property(\"id\").that.is.a(\"number\");\n                  expect(first).to.have.property(\"rating\").that.is.a(\"number\");\n                });\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n            - expression: res.body.products\n              operator: isArray\n              value: ''\n        settings:\n          encodeUrl: true\n          timeout: 10000\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Get Top Product Detail\n          type: http\n          seq: 2\n          tags:\n            - smoke\n            - regression\n        http:\n          method: GET\n          url: '{{dummyUrl}}/products/{{topProductId}}'\n          auth: inherit\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                // Chaining, step 2 of 2. {{topProductId}} in the URL above was set by\n                // the previous request - nothing here was typed in by hand.\n                const body = res.getBody();\n\n                test(\"status is 200\", () => {\n                  expect(res.status).to.equal(200);\n                });\n\n                test(\"id matches the chained variable\", () => {\n                  const expectedId = Number(bru.getVar(\"topProductId\"));\n                  expect(body.id).to.equal(expectedId);\n                });\n\n                test(\"product has stock and price\", () => {\n                  expect(body).to.have.property(\"price\").that.is.a(\"number\");\n                  expect(body).to.have.property(\"stock\").that.is.a(\"number\");\n                });\n\n                console.log(`Fetched: ${body.title} | Price: $${body.price} | Stock: ${body.stock}`);\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n            - expression: res.body.id\n              operator: isNumber\n              value: ''\n        settings:\n          encodeUrl: true\n          timeout: 10000\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ## Chained Request \u2013 Product Detail\n\n          The product ID (`{{topProductId}}`) was set by the previous request's `after-response` script.\n          This demonstrates how Bruno CLI runs requests sequentially and shares state via variables.\n  - info:\n      name: 04-Shared-Scripts\n      type: folder\n      seq: 4\n    docs:\n      content: |-\n        ## 05 - Shared Scripts\n\n        The same JS modules, reused by all three collections in this workspace.\n        Modules live in `/shared-scripts/` at the workspace root and are exposed\n        to this collection by `additionalContextRoots` in `opencollection.yml`:\n\n        ```yml\n        extensions:\n          bruno:\n            scripts:\n              additionalContextRoots:\n                - \"../../shared-scripts\"\n        ```\n\n        Requires **Developer Mode** in the app, and `--sandbox=developer` on the\n        CLI (v3.0.0+):\n\n        ```bash\n        bru run \"04-Shared-Scripts\" --env Production --sandbox=developer\n\n        # Same run without the flag - fails on the require(), on purpose.\n        bru run \"04-Shared-Scripts\" --env Production\n        ```\n\n        Docs: https://docs.usebruno.com/testing/script/js-file\n      type: text/markdown\n    items:\n      - info:\n          name: Shared Asserts\n          type: http\n          seq: 1\n          tags:\n            - shared-scripts\n        http:\n          method: GET\n          url: '{{baseUrl}}/posts/{{postId}}'\n          headers:\n            - name: X-Correlation-Id\n              value: '{{correlationId}}'\n              description: Generated in the pre-request script by shared-scripts/testData.js\n        runtime:\n          scripts:\n            - type: before-request\n              code: |-\n                // Shared module from the workspace root - path is relative to the\n                // collection root and allowed by additionalContextRoots.\n                const { correlationId, today } = require('../../shared-scripts/testData.js');\n\n                // Run-scoped only: setVar does not persist to disk in V4.\n                bru.setVar('correlationId', correlationId('fundamentals'));\n                bru.setVar('runDate', today());\n\n                console.log(`Correlation ID: ${bru.getVar('correlationId')}`);\n            - type: tests\n              code: |-\n                const {\n                  assertHealthyJsonResponse,\n                  assertRequiredFields\n                } = require('../../shared-scripts/httpAsserts.js');\n\n                const body = res.getBody();\n\n                test('200, JSON, under 2s (one shared helper)', () => {\n                  assertHealthyJsonResponse(res, { status: 200, maxMs: 2000 });\n                });\n\n                test('post payload has the contract fields', () => {\n                  assertRequiredFields(body, ['id', 'userId', 'title', 'body']);\n                });\n\n                test('correlation ID was generated and echoed on the request', () => {\n                  const sent = req.getHeader('X-Correlation-Id');\n                  expect(sent).to.be.a('string');\n                  expect(sent).to.match(/^fundamentals-/);\n                });\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: '200'\n            - expression: res.body\n              operator: isJson\n              value: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          ### Shared asserts from `/shared-scripts/`\n\n          Everything test-shaped in this request comes from two modules that live\n          **outside** this collection:\n\n          ```js\n          const { correlationId, today } = require('../../shared-scripts/testData.js');\n          const { assertHealthyJsonResponse } = require('../../shared-scripts/httpAsserts.js');\n          ```\n\n          Same two lines appear in `02 - Auth and Scripting` and\n          `04 - CLI CI and V4 Features` - one definition, four collections.\n\n          **Gotcha to demo:** runtime globals (`res`, `bru`, `expect`, `test`) are not\n          injected into a required module, which is why `res` is passed in as an\n          argument. Helpers throw a plain `Error`; the surrounding `test()` turns that\n          into a failed test with the message.\n\n          ```bash\n          bru run \"04-Shared-Scripts\" --env Production --sandbox=developer\n          ```\n  - info:\n      name: 05-API-Requests-Support\n      type: folder\n      seq: 5\n    docs:\n      content: |-\n        ## 05 - API Parity\n\n        > **Demo 02 - \"Day-to-day API Parity\".** REST, SOAP and the core HTTP\n        > methods have to work as-is, like the old tool, because teams use them\n        > daily. This folder is that proof, one row of the slide per sub-folder.\n\n        | Slide row | Where | What to show |\n        |---|---|---|\n        | 01 REST and all HTTP methods | `01-HTTP-Methods` | GET / POST / PUT / PATCH / DELETE / HEAD / OPTIONS, each verified by the echo response |\n        | 02 SOAP (incl. WSDL import) and GraphQL | `02-SOAP-and-GraphQL` | SOAP 1.1 + 1.2 envelopes, GraphQL with variables; import the WSDL live |\n        | 03 gRPC, WebSocket, SSE | `04-Other-Protocols` | one of each, app-only; the deeper gRPC streaming tour is in collection 04 |\n        | 04 JSON, XML, form, multipart | `03-Data-Formats` | one request per body type, file attached from the folder |\n        | 05 Code generation | any request -> **Generate Code** (`...` menu) | cURL, Python, Java, C#, Node, Go and more from the same request |\n\n        Everything here hits free public endpoints with no auth, so it runs on\n        any laptop or in CI:\n\n        ```bash\n        # whole folder: 14 HTTP/SOAP/GraphQL requests. Nested folders need -r, and\n        # the gRPC/WebSocket/SSE requests are app-only (SSE never ends and would hang the run)\n        bru run \"05-API-Parity\" -r --env Demo --exclude-tags app-only\n\n        # just the verbs, or just the formats\n        bru run \"05-API-Parity/01-HTTP-Methods\" --env Demo\n        bru run \"05-API-Parity/03-Data-Formats\" --env Demo\n\n        # by tag, from anywhere in the collection (same exclusion applies)\n        bru run --env Demo --tags api-parity --exclude-tags app-only\n        ```\n\n        Endpoints: JSONPlaceholder (`baseUrl`, REST verbs), httpfaker.org\n        (`echoUrl`, Bruno's own echo service - github.com/usebruno/httpfaker),\n        dataaccess.com NumberConversion (`soapUrl`), countries.trevorblades.com\n        (`graphqlUrl`), grpcb.in, echo.websocket.org, stream.wikimedia.org.\n        The four URL vars are set in the Demo, Staging and Production\n        environments.\n      type: text/markdown\n    items:\n      - info:\n          name: 01-HTTP-Methods\n          type: folder\n          seq: 1\n        docs:\n          content: |-\n            ## 01 - HTTP Methods\n\n            One request per verb - GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS -\n            against JSONPlaceholder (`{{baseUrl}}`), a free fake REST API that\n            answers each verb the way a real service would: `201` + new id on POST,\n            merged fields on PATCH, headers-only on HEAD, `Access-Control-Allow-Methods`\n            on OPTIONS. Every Tests tab asserts on that, so the proof is in the\n            response, not on a slide.\n\n            Open any request and point at the layout: method dropdown, URL,\n            Params / Body / Headers / Auth / Vars / Script / Assert / Tests / Docs.\n\n            ```bash\n            bru run \"05-API-Parity/01-HTTP-Methods\" --env Demo\n            ```\n          type: text/markdown\n        items:\n          - info:\n              name: GET\n              type: http\n              seq: 1\n              tags:\n                - api-parity\n                - http-methods\n            http:\n              method: GET\n              url: '{{baseUrl}}/posts/{{postId}}'\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"returns the requested post\", () => {\n                      expect(res.getBody().id).to.equal(Number(bru.getEnvVar(\"postId\")));\n                      expect(res.getBody()).to.have.all.keys(\"userId\", \"id\", \"title\", \"body\");\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## GET /posts/{{postId}}\n\n              GET: read one resource. The URL carries `{{postId}}` from the environment.\n\n              Same request shape as the old tool - method dropdown, URL, Params / Body /\n              Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is\n              a free fake REST API that answers every verb with a realistic response.\n          - info:\n              name: POST\n              type: http\n              seq: 2\n              tags:\n                - api-parity\n                - http-methods\n            http:\n              method: POST\n              url: '{{baseUrl}}/posts'\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"title\": \"Bruno demo\", \"body\": \"created from the API Parity folder\", \"userId\": 1}'\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"status is 201 Created\", () => {\n                      expect(res.status).to.equal(201);\n                    });\n\n                    test(\"server assigned an id and echoed the body\", () => {\n                      expect(res.getBody().id).to.be.a(\"number\");\n                      expect(res.getBody().title).to.equal(\"Bruno demo\");\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '201'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## POST /posts\n\n              POST: create. JSON body in, `201 Created` and a new `id` back.\n\n              Same request shape as the old tool - method dropdown, URL, Params / Body /\n              Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is\n              a free fake REST API that answers every verb with a realistic response.\n          - info:\n              name: PUT\n              type: http\n              seq: 3\n              tags:\n                - api-parity\n                - http-methods\n            http:\n              method: PUT\n              url: '{{baseUrl}}/posts/{{postId}}'\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"id\": 1, \"title\": \"Bruno demo (replaced)\", \"body\": \"full replacement\", \"userId\": 1}'\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"whole resource replaced\", () => {\n                      expect(res.getBody().title).to.equal(\"Bruno demo (replaced)\");\n                      expect(res.getBody().body).to.equal(\"full replacement\");\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## PUT /posts/{{postId}}\n\n              PUT: full replacement of a resource.\n\n              Same request shape as the old tool - method dropdown, URL, Params / Body /\n              Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is\n              a free fake REST API that answers every verb with a realistic response.\n          - info:\n              name: PATCH\n              type: http\n              seq: 4\n              tags:\n                - api-parity\n                - http-methods\n            http:\n              method: PATCH\n              url: '{{baseUrl}}/posts/{{postId}}'\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"title\": \"Bruno demo (patched)\"}'\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"only the title changed, other fields kept\", () => {\n                      expect(res.getBody().title).to.equal(\"Bruno demo (patched)\");\n                      expect(res.getBody().userId).to.equal(1);\n                      expect(res.getBody().body).to.be.a(\"string\").and.not.empty;\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## PATCH /posts/{{postId}}\n\n              PATCH: partial update - send one field, the rest is preserved.\n\n              Same request shape as the old tool - method dropdown, URL, Params / Body /\n              Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is\n              a free fake REST API that answers every verb with a realistic response.\n          - info:\n              name: DELETE\n              type: http\n              seq: 5\n              tags:\n                - api-parity\n                - http-methods\n            http:\n              method: DELETE\n              url: '{{baseUrl}}/posts/{{postId}}'\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"empty object back, nothing else\", () => {\n                      expect(res.getBody()).to.deep.equal({});\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## DELETE /posts/{{postId}}\n\n              DELETE: delete. No body sent, empty object back.\n\n              Same request shape as the old tool - method dropdown, URL, Params / Body /\n              Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is\n              a free fake REST API that answers every verb with a realistic response.\n          - info:\n              name: HEAD\n              type: http\n              seq: 6\n              tags:\n                - api-parity\n                - http-methods\n            http:\n              method: HEAD\n              url: '{{baseUrl}}/posts/{{postId}}'\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"headers only - content-length set, body empty\", () => {\n                      expect(res.getHeader(\"content-type\")).to.include(\"application/json\");\n                      expect(res.getBody()).to.satisfy((b) => b === null || b === undefined || b === \"\");\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## HEAD /posts/{{postId}}\n\n              HEAD: same headers as GET, no body - cheap existence / size check.\n\n              Same request shape as the old tool - method dropdown, URL, Params / Body /\n              Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is\n              a free fake REST API that answers every verb with a realistic response.\n          - info:\n              name: OPTIONS\n              type: http\n              seq: 7\n              tags:\n                - api-parity\n                - http-methods\n            http:\n              method: OPTIONS\n              url: '{{baseUrl}}/posts/{{postId}}'\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"status is 204 No Content\", () => {\n                      expect(res.status).to.equal(204);\n                    });\n\n                    test(\"server advertises the verbs it accepts\", () => {\n                      const allowed = res.getHeader(\"access-control-allow-methods\") || \"\";\n                      [\"GET\", \"POST\", \"PUT\", \"PATCH\", \"DELETE\"].forEach((v) => expect(allowed).to.include(v));\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '204'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## OPTIONS /posts/{{postId}}\n\n              OPTIONS: capability probe - the answer is in the headers, not the body.\n\n              Same request shape as the old tool - method dropdown, URL, Params / Body /\n              Headers / Auth / Vars / Script / Assert / Tests / Docs. JSONPlaceholder is\n              a free fake REST API that answers every verb with a realistic response.\n      - info:\n          name: 02-SOAP-and-GraphQL\n          type: folder\n          seq: 2\n        docs:\n          content: |-\n            ## 02 - SOAP and GraphQL\n\n            - **SOAP 1.1** and **SOAP 1.2** against a public number-conversion\n              service. SOAP in Bruno is an ordinary HTTP request with an XML body -\n              there is no separate mode to learn.\n            - **GraphQL** is its own request type: query editor with schema\n              autocomplete, a Variables tab, and a Docs explorer loaded from the\n              endpoint.\n\n            **WSDL import** (app): `Import Collection -> WSDL`, paste\n            `https://www.dataaccess.com/webservicesserver/NumberConversion.wso?WSDL`\n            and Bruno generates a request per operation with the envelope filled in.\n            Worth doing live - the audience sees the requests appear.\n\n            ```bash\n            bru run \"05-API-Parity/02-SOAP-and-GraphQL\" --env Demo\n            ```\n          type: text/markdown\n        items:\n          - info:\n              name: SOAP 1.1 - NumberToWords\n              type: http\n              seq: 1\n              tags:\n                - api-parity\n                - soap\n            http:\n              method: POST\n              url: '{{soapUrl}}/NumberConversion.wso'\n              headers:\n                - name: Content-Type\n                  value: text/xml; charset=utf-8\n                - name: SOAPAction\n                  value: http://www.dataaccess.com/webservicesserver/NumberToWords\n              body:\n                type: xml\n                data: |-\n                  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n                  <soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n                    <soap:Body>\n                      <NumberToWords xmlns=\"http://www.dataaccess.com/webservicesserver/\">\n                        <ubiNum>{{soapNumber}}<\/ubiNum>\n                      <\/NumberToWords>\n                    <\/soap:Body>\n                  <\/soap:Envelope>\n              auth: inherit\n            runtime:\n              variables:\n                - name: soapNumber\n                  value: '500'\n              scripts:\n                - type: tests\n                  code: |-\n                    // SOAP is plain HTTP + XML. res.getBody() is the raw envelope string,\n                    // so pull the result element out with a regex - no XML library needed.\n                    const xml = res.getBody();\n                    const words = (xml.match(/<m:NumberToWordsResult>([^<]*)<\/) || [])[1];\n\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"response is a SOAP 1.1 envelope\", () => {\n                      expect(res.getHeader(\"content-type\")).to.include(\"text/xml\");\n                      expect(xml).to.include(\"http://schemas.xmlsoap.org/soap/envelope/\");\n                    });\n\n                    test(\"500 -> 'five hundred'\", () => {\n                      expect(words.trim()).to.equal(\"five hundred\");\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 15000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## SOAP 1.1 - NumberToWords\n\n              A SOAP call is an HTTP POST with an XML envelope and two headers -\n              `Content-Type: text/xml` and `SOAPAction`. Nothing special is needed in\n              Bruno: pick **Body -> XML**, paste the envelope, send.\n\n              The response panel renders the XML envelope with syntax highlighting, and\n              the Tests tab reads the result element out of the raw body.\n\n              Change `soapNumber` in the Vars tab to convert a different number.\n\n              **WSDL import:** `Import Collection -> WSDL` builds one request per\n              operation straight from the service's WSDL, envelope included.\n              This service's WSDL: `https://www.dataaccess.com/webservicesserver/NumberConversion.wso?WSDL`\n          - info:\n              name: SOAP 1.2 - NumberToDollars\n              type: http\n              seq: 2\n              tags:\n                - api-parity\n                - soap\n            http:\n              method: POST\n              url: '{{soapUrl}}/NumberConversion.wso'\n              headers:\n                - name: Content-Type\n                  value: application/soap+xml; charset=utf-8\n              body:\n                type: xml\n                data: |-\n                  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n                  <soap12:Envelope xmlns:soap12=\"http://www.w3.org/2003/05/soap-envelope\">\n                    <soap12:Body>\n                      <NumberToDollars xmlns=\"http://www.dataaccess.com/webservicesserver/\">\n                        <dNum>1234.56<\/dNum>\n                      <\/NumberToDollars>\n                    <\/soap12:Body>\n                  <\/soap12:Envelope>\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    const xml = res.getBody();\n                    const words = (xml.match(/<m:NumberToDollarsResult>([^<]*)<\/) || [])[1];\n\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"response is a SOAP 1.2 envelope\", () => {\n                      expect(xml).to.include(\"http://www.w3.org/2003/05/soap-envelope\");\n                    });\n\n                    test(\"1234.56 -> dollars and cents in words\", () => {\n                      expect(words).to.include(\"one thousand two hundred and thirty four dollars\");\n                      expect(words).to.include(\"fifty six cents\");\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 15000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## SOAP 1.2 - NumberToDollars\n\n              Same service, SOAP 1.2 flavour: the envelope namespace changes and the\n              action moves out of the `SOAPAction` header into the\n              `application/soap+xml` content type. Still just a POST with an XML body.\n          - info:\n              name: GraphQL - Country Lookup\n              type: graphql\n              seq: 3\n              tags:\n                - api-parity\n                - graphql\n            graphql:\n              url: '{{graphqlUrl}}'\n              method: POST\n              body:\n                query: |\n                  query CountryLookup($code: ID!) {\n                    country(code: $code) {\n                      name\n                      capital\n                      currency\n                      continent {\n                        name\n                      }\n                    }\n                  }\n                variables: |-\n                  {\n                    \"code\": \"{{countryCode}}\"\n                  }\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    const { data, errors } = res.getBody();\n\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"no GraphQL errors\", () => {\n                      // GraphQL returns 200 even on failure - check the errors array, not the status\n                      expect(errors).to.be.undefined;\n                    });\n\n                    test(\"country resolved from the $code variable\", () => {\n                      expect(data.country.name).to.equal(\"United States\");\n                      expect(data.country.continent.name).to.equal(\"North America\");\n                    });\n              variables:\n                - name: countryCode\n                  value: US\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## GraphQL - Country Lookup\n\n              A native GraphQL request type: the Query tab has schema-aware\n              autocomplete and the Variables tab takes JSON. `{{countryCode}}` is a\n              request-level var (Vars tab) - change it to `DE` or `JP` and resend.\n\n              Click **Docs** in the query editor to load the schema from the endpoint\n              and browse the types, same as the old tool's schema explorer.\n\n              Compare with `04 - CLI CI and V4 Features/02-Additional-Request-Types/graphql-query`\n              for a second public endpoint (PokeAPI).\n      - info:\n          name: 03-Data-Formats\n          type: folder\n          seq: 3\n        docs:\n          content: |-\n            ## 03 - Data Formats\n\n            The four body types teams send every day - **JSON**, **XML**,\n            **form URL-encoded**, **multipart** (text fields + a file) - all POSTed\n            to the echo service. Each Tests tab checks the `Content-Type` Bruno set\n            and that the payload came back intact.\n\n            `sample-statement.txt` is the file attached by the multipart request;\n            the path is relative to the collection root so it ships with the collection.\n\n            ```bash\n            bru run \"05-API-Parity/03-Data-Formats\" --env Demo\n            ```\n          type: text/markdown\n        items:\n          - info:\n              name: JSON Body\n              type: http\n              seq: 1\n              tags:\n                - api-parity\n                - data-formats\n            http:\n              method: POST\n              url: '{{echoUrl}}/api/echo'\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"format\": \"json\",\n                    \"nested\": { \"ok\": true, \"count\": 3 },\n                    \"tags\": [\"bruno\", \"demo\"]\n                  }\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    const echo = res.getBody();\n\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"sent as application/json\", () => {\n                      expect(echo.headers[\"content-type\"]).to.include(\"application/json\");\n                    });\n\n                    test(\"JSON round-tripped, nested values intact\", () => {\n                      // httpfaker echoes the raw body as a string - parse it to inspect\n                      const sent = JSON.parse(echo.body);\n                      expect(sent.nested.count).to.equal(3);\n                      expect(sent.tags).to.deep.equal([\"bruno\", \"demo\"]);\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## JSON body\n\n              Body -> JSON. The editor validates and formats, `{{vars}}` interpolate\n              inside the body, and the echo service returns exactly what it received\n              under `body`.\n          - info:\n              name: XML Body\n              type: http\n              seq: 2\n              tags:\n                - api-parity\n                - data-formats\n            http:\n              method: POST\n              url: '{{echoUrl}}/api/echo'\n              headers:\n                - name: Content-Type\n                  value: application/xml\n              body:\n                type: xml\n                data: |-\n                  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n                  <order id=\"1001\">\n                    <customer>ACME Corp<\/customer>\n                    <items>\n                      <item sku=\"A-1\" qty=\"2\"/>\n                      <item sku=\"B-7\" qty=\"1\"/>\n                    <\/items>\n                  <\/order>\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    const echo = res.getBody();\n\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"sent as application/xml\", () => {\n                      expect(echo.headers[\"content-type\"]).to.include(\"application/xml\");\n                    });\n\n                    test(\"XML arrived byte-for-byte\", () => {\n                      // The raw body comes back under `body`; the server does not parse XML\n                      expect(echo.body).to.include('<order id=\"1001\">');\n                      expect(echo.body).to.include('<item sku=\"B-7\" qty=\"1\"/>');\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## XML body\n\n              Body -> XML. Same editor as the SOAP envelopes in `02-SOAP-and-GraphQL`,\n              just a plain XML document and `Content-Type: application/xml`.\n          - info:\n              name: Form URL-Encoded\n              type: http\n              seq: 3\n              tags:\n                - api-parity\n                - data-formats\n            http:\n              method: POST\n              url: '{{echoUrl}}/api/echo'\n              body:\n                type: form-urlencoded\n                data:\n                  - name: username\n                    value: '{{formUser}}'\n                  - name: grant_type\n                    value: password\n                  - name: scope\n                    value: read write\n              auth: inherit\n            runtime:\n              variables:\n                - name: formUser\n                  value: edward.demo\n              scripts:\n                - type: tests\n                  code: |-\n                    const echo = res.getBody();\n                    // httpfaker returns the raw body - decode the key=value pairs here\n                    const form = Object.fromEntries(\n                      (echo.body || \"\")\n                        .split(\"&\")\n                        .filter(Boolean)\n                        .map((pair) => pair.split(\"=\").map((s) => decodeURIComponent(s.replace(/\\+/g, \" \"))))\n                    );\n\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"Content-Type set automatically\", () => {\n                      expect(echo.headers[\"content-type\"]).to.include(\"application/x-www-form-urlencoded\");\n                    });\n\n                    test(\"fields decoded server-side, {{formUser}} var interpolated\", () => {\n                      expect(form.username).to.equal(\"edward.demo\");\n                      expect(form.grant_type).to.equal(\"password\");\n                      expect(form.scope).to.equal(\"read write\");\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## Form URL-Encoded\n\n              Body -> Form URL Encoded: a key/value table, with the content type and\n              the URL-encoding handled for you (`scope=read+write`). This is the shape\n              of most OAuth2 token endpoints and legacy login forms.\n          - info:\n              name: Multipart Form\n              type: http\n              seq: 4\n              tags:\n                - api-parity\n                - data-formats\n            http:\n              method: POST\n              url: '{{echoUrl}}/api/echo'\n              body:\n                type: multipart-form\n                data:\n                  - name: description\n                    type: text\n                    value: quarterly statement upload\n                  - name: statement\n                    type: file\n                    value:\n                      - 05-API-Parity/03-Data-Formats/sample-statement.txt\n              auth: inherit\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    const echo = res.getBody();\n\n                    test(\"status is 200\", () => {\n                      expect(res.status).to.equal(200);\n                    });\n\n                    test(\"sent as multipart/form-data with a boundary\", () => {\n                      expect(echo.headers[\"content-type\"]).to.include(\"multipart/form-data; boundary=\");\n                    });\n\n                    test(\"text field arrived as a form part\", () => {\n                      // httpfaker echoes the raw multipart body, boundaries and all\n                      expect(echo.body).to.include('name=\"description\"');\n                      expect(echo.body).to.include(\"quarterly statement upload\");\n                    });\n\n                    test(\"file part arrived with filename and contents\", () => {\n                      expect(echo.body).to.include('filename=\"sample-statement.txt\"');\n                      expect(echo.body).to.include(\"ACCOUNT 1001\");\n                    });\n              assertions:\n                - expression: res.status\n                  operator: eq\n                  value: '200'\n            settings:\n              encodeUrl: true\n              timeout: 10000\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## Multipart Form\n\n              Body -> Multipart Form: text fields and file parts in one table. The file\n              path is stored relative to the collection root, so `sample-statement.txt`\n              sits next to this request and travels with the collection in Git.\n\n              The echo service returns the raw multipart body, so you can see the\n              boundaries, each part's `Content-Disposition`, and the file contents.\n      - info:\n          name: 04-Other-Protocols\n          type: folder\n          seq: 4\n        docs:\n          content: |-\n            ## 04 - Other Protocols (gRPC, WebSocket, SSE)\n\n            Lower priority for this prospect than REST/SOAP, but on the slide, so\n            one request each: a gRPC unary call, a WebSocket echo with two saved\n            messages, and a live Server-Sent Events feed. All public, no auth.\n\n            These are **app-only** - open them in Bruno and hit Send (gRPC and\n            WebSocket) or watch the pane fill (SSE). All three carry the `app-only`\n            tag: the CLI cannot run gRPC/WebSocket and the SSE stream never ends, so\n            on the CLI always add `--exclude-tags app-only`:\n\n            ```bash\n            bru run \"05-API-Parity\" -r --env Demo --exclude-tags app-only\n            ```\n\n            The fuller tour (gRPC scripting, server/bidi streams) lives in\n            `04 - CLI CI and V4 Features / 02-Additional-Request-Types`.\n          type: text/markdown\n        items:\n          - info:\n              name: gRPC - Unary Sum\n              type: grpc\n              seq: 1\n              tags:\n                - api-parity\n                - grpc\n                - app-only\n            grpc:\n              url: https://grpcb.in/\n              method: /addsvc.Add/Sum\n              methodType: unary\n              message: |-\n                {\n                  \"a\": 988,\n                  \"b\": 67\n                }\n              auth: inherit\n            docs:\n              content: |-\n                ## gRPC - unary call\n\n                Native gRPC request type: point at the server, Bruno pulls the service\n                list via reflection (or a `.proto` you import), pick the method, send a\n                JSON message. `grpcb.in` is a public echo/test server - `Sum` returns\n                `{ \"v\": 1055 }`.\n\n                Streaming methods (server, client, bidi) are demoed in\n                `04 - CLI CI and V4 Features / 02-Additional-Request-Types / gRPC-Scripting`.\n              type: text/markdown\n          - info:\n              name: WebSocket - Echo\n              type: websocket\n              seq: 2\n              tags:\n                - api-parity\n                - websocket\n                - app-only\n            websocket:\n              url: wss://echo.websocket.org\n              message:\n                - title: Greeting\n                  selected: true\n                  message:\n                    type: json\n                    data: |-\n                      {\n                        \"type\": \"message\",\n                        \"content\": \"Hello from Bruno!\",\n                        \"user\": {\n                          \"id\": 123,\n                          \"name\": \"{{username}}\"\n                        }\n                      }\n                - title: Ping\n                  message:\n                    type: text\n                    data: ping\n              auth: inherit\n            docs:\n              content: |-\n                ## WebSocket - echo\n\n                Connect, then fire either saved message (\"Greeting\" JSON, \"Ping\" text)\n                and watch the server echo it back in the Messages pane. One request can\n                hold several saved messages, and `{{username}}` interpolates inside the\n                payload like any HTTP body.\n\n                Endpoint: `wss://echo.websocket.org`. It sends a \"Request served by ...\"\n                banner frame on connect, then echoes each message. Backup if it is down\n                on demo day: `wss://ws.ifelse.io`.\n              type: text/markdown\n          - info:\n              name: SSE - Wikimedia Page Creates\n              type: http\n              seq: 3\n              tags:\n                - api-parity\n                - sse\n                - app-only\n            http:\n              method: GET\n              url: https://stream.wikimedia.org/v2/stream/page-create\n              headers:\n                - name: Accept\n                  value: text/event-stream\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              ## Server-Sent Events\n\n              Bruno sees the `text/event-stream` response and renders each event as it\n              arrives instead of waiting for a body that never ends. This is Wikimedia's\n              public feed of every page created across its wikis - about one event per\n              second, readable on a call. Swap `page-create` for `recentchange` for the\n              full firehose.\n\n              **App-only.** The stream never closes, so the CLI waits forever on it\n              (the request timeout does not cut a stream short). Always run this\n              folder with `--exclude-tags app-only` on the CLI.\ndocs:\n  content: |-\n    # \uD83C\uDF93 01 - Fundamentals\n\n    > **Start here.** Basic CRUD requests, variable precedence, and chained requests \u2014 all against free public test APIs (JSONPlaceholder, DummyJSON, NewsAPI, Bruno's echo service). Data-driven runs moved to `02 - Auth and Scripting/05-Data-Driven`.\n\n    ---\n\n    ## \uD83D\uDCDA What's Inside\n\n    | # | Folder | Requests | Focus |\n    |---|--------|:--------:|-------|\n    | 01 | \uD83C\uDF10 **Basic-Requests** | 8 | Core CRUD operations & HTTP verbs |\n    | 02 | \uD83D\uDD27 **Variables-and-Environments** | 2 | Variable precedence & scoping |\n    | 03 | \uD83D\uDD17 **Chained-Requests** | 2 | Passing data between requests |\n    | 04 | \uD83E\uDDE9 **Shared-Scripts** | 1 | Reusable workspace scripts |\n    | 05 | \uD83E\uDD1D **API-Parity** | 17 | Demo 02: all HTTP verbs, SOAP 1.1/1.2, GraphQL, JSON/XML/form/multipart bodies, gRPC/WS/SSE |\n\n    ---\n\n    ## \uD83D\uDE80 Quick Start\n\n    ### \u25B6\uFE0F Run the entire collection\n    ```bash\n    bru run --env Production\n    ```\n\n    ### \uD83D\uDCC1 Run a specific folder\n    ```bash\n    bru run \"01-Basic-Requests\" --env Production\n\n    # folders with nested sub-folders need -r; API-Parity also holds app-only\n    # gRPC/WebSocket/SSE requests, so exclude those on the CLI\n    bru run \"05-API-Parity\" -r --env Production --exclude-tags app-only\n    ```\n\n    ### \uD83D\uDCC8 Generate reports (JSON + HTML + JUnit)\n    ```bash\n    bru run --env Production \\\n      --reporter-json reports/results.json \\\n      --reporter-html reports/results.html \\\n      --reporter-junit reports/results.xml\n    ```\n\n    ### \uD83D\uDEE0\uFE0F Shared scripts (requires developer sandbox)\n    ```bash\n    # Folders that require() workspace shared scripts need the developer sandbox\n    bru run \"04-Shared-Scripts\" --env Production --sandbox=developer\n    ```\n\n    ---\n\n    ## \uD83D\uDCA1 Tips\n\n    - \uD83E\uDDEA Use `--env Production` to load the correct `baseUrl` and other environment variables.\n    - \uD83D\uDD10 Secrets like `password` and `globalApiKey` are stored as secret variables \u2014 never hard-code them.\n    - \uD83D\uDCDD Add `--verbose` for detailed logs while debugging.\n\n    Happy testing! \uD83C\uDF89\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    exportedAt: '2026-11-12T15:55:27.371Z'\n    exportedUsing: usebruno-cli/4.3.0\n";
