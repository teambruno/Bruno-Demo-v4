info:
  name: Delete Post
  type: http
  seq: 6
  tags:
    - regression

http:
  method: DELETE
  url: "{{baseUrl}}/posts/{{postId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("response body is empty object (JSONPlaceholder behaviour)", () => {
          const body = res.getBody();
          expect(body).to.be.an("object");
          expect(Object.keys(body).length).to.equal(0);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

