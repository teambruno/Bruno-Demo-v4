info:
  name: Get Random Dog Fact
  type: http
  seq: 2
  tags:
    - demo

http:
  method: GET
  url: https://dogapi.dog/api/v2/facts
  headers:
    - name: Content-Type
      value: application/json
      disabled: true
  params:
    - name: max_length
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const responseUrl = res.getUrl();
        console.log("Response URL:", responseUrl);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      disabled: true
    - expression: res.body
      operator: isJson
      disabled: true
    - expression: res.body.data
      operator: isArray
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
app:
  enabled: true
  code: |-
    <!DOCTYPE html>
    <html>
    <head>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        font-family: 'Comic Sans MS', 'Marker Felt', cursive;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background 0.3s;
      }
      body.light {
        background: repeating-linear-gradient(45deg, #fff8dc, #fff8dc 10px, #ffeeba 10px, #ffeeba 20px);
        color: #222;
      }
      body.dark {
        background: repeating-linear-gradient(45deg, #1a1a2e, #1a1a2e 10px, #16213e 10px, #16213e 20px);
        color: #f5f5f5;
      }

      .stage {
        position: relative;
        max-width: 720px;
        margin: 0 auto;
        min-height: 420px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 20px;
        padding: 40px 20px 20px;
      }

      .controls {
        text-align: center;
        margin-bottom: 20px;
      }

      button {
        font-family: inherit;
        font-size: 18px;
        font-weight: bold;
        padding: 12px 28px;
        border: 3px solid #000;
        border-radius: 50px;
        background: #ffdd57;
        color: #000;
        cursor: pointer;
        box-shadow: 4px 4px 0 #000;
        transition: transform 0.1s, box-shadow 0.1s;
      }
      button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; }
      button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      /* Speech bubble */
      .bubble {
        position: relative;
        background: #fff;
        color: #000;
        border: 4px solid #000;
        border-radius: 24px;
        padding: 30px 24px 20px 60px;
        max-width: 380px;
        min-height: 80px;
        font-size: 18px;
        line-height: 1.4;
        box-shadow: 6px 6px 0 #000;
        opacity: 0;
        transform: scale(0.3) rotate(-6deg);
        transform-origin: bottom right;
        transition: opacity 0.3s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        align-self: flex-start;
        margin-top: 20px;
      }
      .bubble.show { opacity: 1; transform: scale(1) rotate(-2deg); }
      .bubble::before {
        content: '';
        position: absolute;
        bottom: -30px;
        right: 20px;
        width: 0;
        height: 0;
        border: 20px solid transparent;
        border-top-color: #000;
        border-bottom: 0;
        border-right: 0;
      }
      .bubble::after {
        content: '';
        position: absolute;
        bottom: -22px;
        right: 26px;
        width: 0;
        height: 0;
        border: 14px solid transparent;
        border-top-color: #fff;
        border-bottom: 0;
        border-right: 0;
      }
      .bubble .pow {
        position: absolute;
        top: -18px;
        left: -18px;
        background: #ff4757;
        color: #fff;
        border: 3px solid #000;
        border-radius: 50%;
        width: 60px; height: 60px;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px;
        transform: rotate(-15deg);
        box-shadow: 3px 3px 0 #000;
      }

      /* Dog */
      .dog {
        position: relative;
        width: 180px;
        height: 180px;
        flex-shrink: 0;
        animation: bob 2s ease-in-out infinite;
      }
      .dog.bark { animation: bark 0.4s ease-out; }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes bark {
        0% { transform: translateY(0) scale(1); }
        30% { transform: translateY(-20px) scale(1.08); }
        60% { transform: translateY(0) scale(0.98); }
        100% { transform: translateY(0) scale(1); }
      }

      .dog svg { width: 100%; height: 100%; display: block; }

      .tail {
        transform-origin: 60px 95px;
        animation: wag 0.4s ease-in-out infinite;
      }
      @keyframes wag {
        0%, 100% { transform: rotate(-15deg); }
        50% { transform: rotate(25deg); }
      }

      .error {
        color: #ff4757;
        text-align: center;
        font-weight: bold;
        margin-top: 10px;
      }

      .loader {
        display: inline-block;
        width: 20px; height: 20px;
        border: 3px solid rgba(0,0,0,0.2);
        border-top-color: #000;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-left: 8px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .title {
        text-align: center;
        font-size: 32px;
        margin: 0 0 10px;
        text-shadow: 3px 3px 0 #ffdd57;
      }
      body.dark .title { text-shadow: 3px 3px 0 #ff4757; }
    </style>
    </head>
    <body class="light">
      <h1 class="title">🐾 Dog Fact Comics 🐾</h1>
      <div class="controls">
        <button id="fetchBtn">Woof me a fact!</button>
        <div id="error" class="error"></div>
      </div>

      <div class="stage">
        <div id="bubble" class="bubble">
          <div class="pow">WOOF!</div>
          <span id="factText">Click the button to hear a dog fact!</span>
        </div>

        <div id="dog" class="dog">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Tail -->
            <path class="tail" d="M60 95 Q30 70 20 40 Q35 55 55 80 Z" fill="#c68b4a" stroke="#000" stroke-width="3"/>
            <!-- Body -->
            <ellipse cx="100" cy="130" rx="55" ry="40" fill="#e0a865" stroke="#000" stroke-width="4"/>
            <!-- Legs -->
            <rect x="70" y="155" width="15" height="30" rx="5" fill="#e0a865" stroke="#000" stroke-width="3"/>
            <rect x="115" y="155" width="15" height="30" rx="5" fill="#e0a865" stroke="#000" stroke-width="3"/>
            <!-- Head -->
            <circle cx="130" cy="80" r="40" fill="#e0a865" stroke="#000" stroke-width="4"/>
            <!-- Ears -->
            <path d="M100 55 Q90 30 110 45 Z" fill="#c68b4a" stroke="#000" stroke-width="3"/>
            <path d="M160 55 Q170 30 150 45 Z" fill="#c68b4a" stroke="#000" stroke-width="3"/>
            <!-- Eye -->
            <circle cx="140" cy="75" r="5" fill="#000"/>
            <circle cx="142" cy="73" r="1.5" fill="#fff"/>
            <!-- Snout -->
            <ellipse cx="155" cy="95" rx="18" ry="12" fill="#f5d3a3" stroke="#000" stroke-width="3"/>
            <!-- Nose -->
            <ellipse cx="168" cy="90" rx="5" ry="4" fill="#000"/>
            <!-- Mouth -->
            <path id="mouth" d="M158 100 Q163 108 170 102" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <!-- Tongue (hidden by default) -->
            <path id="tongue" d="M160 102 Q165 115 172 105 Z" fill="#ff6b9d" stroke="#000" stroke-width="2" opacity="0"/>
          </svg>
        </div>
      </div>

    <script>
      (function () {
        const btn = document.getElementById('fetchBtn');
        const bubble = document.getElementById('bubble');
        const factText = document.getElementById('factText');
        const dog = document.getElementById('dog');
        const tongue = document.getElementById('tongue');
        const errEl = document.getElementById('error');

        function applyTheme(theme) {
          if (!theme) return;
          document.body.classList.remove('light', 'dark');
          document.body.classList.add(theme.mode === 'dark' ? 'dark' : 'light');
        }

        function showFact(text) {
          bubble.classList.remove('show');
          // force reflow for retrigger
          void bubble.offsetWidth;
          factText.textContent = text;
          dog.classList.remove('bark');
          void dog.offsetWidth;
          dog.classList.add('bark');
          tongue.style.opacity = 1;
          setTimeout(() => { tongue.style.opacity = 0; }, 500);
          setTimeout(() => bubble.classList.add('show'), 100);
        }

        function extractFact(data) {
          if (!data) return null;
          // dogapi.dog v2 shape: { data: [{ attributes: { body: '...' } }] }
          if (Array.isArray(data.data) && data.data[0]?.attributes?.body) {
            return data.data[0].attributes.body;
          }
          if (data.data?.attributes?.body) return data.data.attributes.body;
          if (typeof data === 'string') return data;
          return JSON.stringify(data).slice(0, 200);
        }

        async function fetchFact() {
          errEl.textContent = '';
          btn.disabled = true;
          const originalLabel = btn.textContent;
          btn.innerHTML = 'Fetching… <span class="loader"></span>';
          try {
            const res = await bru.ctx.submitRequest();
            const data = res?.data ?? res?.body;
            const fact = extractFact(data);
            if (!fact) throw new Error('No fact in response');
            showFact(fact);
          } catch (e) {
            errEl.textContent = '🐶 Ruh roh! ' + (e?.message || 'Something went wrong.');
            bru.ctx.log?.('Dog fact error', e);
          } finally {
            btn.disabled = false;
            btn.textContent = originalLabel;
          }
        }

        btn.addEventListener('click', fetchFact);

        bru.ctx.onInit = function (ctx) {
          applyTheme(ctx.theme);
          const existing = ctx.http?.response;
          if (existing && existing.data) {
            const fact = extractFact(existing.data);
            if (fact) showFact(fact);
          }
        };

        bru.ctx.onThemeChange = applyTheme;

        bru.ctx.http.onResponseChange = function (response) {
          if (!response || !response.data) return;
          const fact = extractFact(response.data);
          if (fact) showFact(fact);
        };
      })();
    </script>
    </body>
    </html>
