info:
  name: Get Random Dog Fact
  type: http
  seq: 2
  tags:
    - demo

http:
  method: GET
  url: https://dogapi.dog/api/v2/facts?max_length=
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: max_length
      value: ""
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const responseUrl = res.getUrl();
        console.log("Response URL:", responseUrl);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      disabled: true
    - expression: res.body
      operator: isJson
      disabled: true
    - expression: res.body.data
      operator: isArray
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
