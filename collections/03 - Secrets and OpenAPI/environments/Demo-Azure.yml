name: Demo-Azure
color: "#346AB2"
variables:
  - name: httpfakerUrl
    value: https://www.httpfaker.org
  - name: dummyUrl
    value: https://dummyjson.com
  - name: echoUrl
    value: https://echo.usebruno.com
  - name: oauthUrl
    value: https://www.httpfaker.org/api/auth/oauth2/client-credentials
  - name: specUrl
    value: https://petstore3.swagger.io/api/v3/openapi.json
    description: live OpenAPI document used by 03-OpenAPI
  - name: providerLabel
    value: Azure Key Vault
    description: shown in test output so the demo makes the provider obvious
externalSecrets:
  type: azure-key-vault
  variables:
    - name: secretStore
      vaultName: bruno-demo-kv
