info:
  name: 01-Resolve Secret Value
  type: http
  seq: 1
  tags:
    - secret-store

http:
  method: POST
  url: "{{httpfakerUrl}}/api/echo"
  headers:
    - name: content-type
      value: application/json
    - name: x-secret-probe
      value: "{{secretStore.oauth-client-secret}}"
      description: connectivity check only - see docs for why this value is safe to echo
  body:
    type: json
    data: |-
      {
        "provider": "{{providerLabel}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const echo = res.getBody();

        // httpfaker's /api/echo returns { url, method, headers, body }, with
        // header keys lowercased and `body` as a raw string.
        const sent = echo.headers["x-secret-probe"];
        const payload = JSON.parse(echo.body);

        test("the secret store binding resolved", () => {
          expect(res.getStatus()).to.equal(200);
          expect(sent, "header never reached the wire").to.be.a("string");
          expect(sent, "still an unresolved template").to.not.include("{{");
          expect(sent, "empty - key missing from the store").to.not.equal("");
        });

        test("the provider is the one selected in the dropdown", () => {
          expect(payload.provider).to.equal(bru.getEnvVar("providerLabel"));
        });

        console.log(`resolved from: ${payload.provider}`);

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Does the binding work at all?

  Run this first. `httpfaker.org/api/echo` hands the request straight back, so
  you can see the value that actually came out of the store. If this 200s, the
  connection and the read permission are both good and the rest of the folder
  will work.

  ### The assertion to point at

  `to.not.include("{{")`.

  An unresolved Bruno template is **sent literally** rather than raising an
  error, so a request can look like it succeeded while shipping the string
  `{{secretStore.oauth-client-secret}}` as a credential. That silent pass is
  the failure mode worth showing, and it is why every request in this folder
  asserts on the resolved value rather than only on the status code.

  ### Why echoing this particular secret is fine

  This is the only request in the folder that puts a stored value on the wire
  in the clear. It uses `oauth-client-secret`, whose value is
  `demo-client-secret` - the same string that sits in plain text in
  `02 - Advanced/04-Auth/04-OAuth2/01-Client Credentials.yml`. It is public by
  construction, so there is nothing to leak. Every other request here either
  sends its secret inside an auth exchange or, in the case of 04, never sends
  it at all.

  For CI, `--reporter-skip-headers x-secret-probe` keeps it out of published
  reports regardless.
