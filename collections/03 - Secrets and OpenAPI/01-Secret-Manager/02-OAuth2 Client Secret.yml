info:
  name: 02-OAuth2 Client Secret
  type: http
  seq: 2
  tags:
    - secret-store

http:
  method: GET
  url: "{{oauthUrl}}/resource?access_token"
  params:
    - name: access_token
      value: ""
      type: query
      description: where this token endpoint expects the token to be placed
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{oauthUrl}}/token"
    credentials:
      clientId: demo-client-id
      clientSecret: "{{secretStore.oauth-client-secret}}"
      placement: body
    scope: user:read
    tokenConfig:
      id: credentials
      placement:
        query: access_token
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false

runtime:
  scripts:
    - type: tests
      code: |-
        test("token exchange succeeded using the vault secret", () => {
          // A wrong secret returns 401, so this 200 is real evidence the value
          // pulled out of the store was correct - not just that a request went out.
          expect(res.getStatus()).to.equal(200);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## The one to lead with

  Open this file next to
  `02 - Advanced/04-Auth/04-OAuth2/01-Client Credentials.yml`. They are the same
  request. The only difference is one line:

  ```yml
  # 02 - Advanced - committed to git
  clientSecret: demo-client-secret

  # here - resolved at run time, never on disk
  clientSecret: "{{secretStore.oauth-client-secret}}"
  ```

  Two files, side by side on screen, is the entire before-and-after.

  This is a genuine client-credentials exchange against httpfaker, not an echo
  endpoint - a wrong secret returns 401, so the 200 means the vault value was
  actually correct.

  `scope=user:read` is required by this token endpoint; dropping it 401s even
  when the secret is right.

  ### The demo move, if you have a vault console open

  Change the secret's value in the provider console and re-run **without
  touching Bruno**. It 401s. Change it back, it passes. That is the answer to
  "so the store is really the source of truth?", and it is worth more than any
  number of green checkmarks.
