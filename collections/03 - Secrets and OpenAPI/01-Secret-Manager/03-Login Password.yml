info:
  name: 03-Login Password
  type: http
  seq: 3
  tags:
    - secret-store

http:
  method: POST
  url: "{{dummyUrl}}/auth/login"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "jamesd",
        "password": "{{secretStore.dummyjson-password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.accessToken) {
          // setVar, not setEnvVar. A vault-derived token written with
          // setEnvVar would land in the environment file on disk in V4 and
          // undo the entire point of the vault.
          bru.setVar("vaultLoginToken", body.accessToken);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("real login with the vault password", () => {
          expect(res.getStatus()).to.equal(200);
          expect(body).to.have.property("accessToken");
          expect(body.username).to.equal("jamesd");
        });

        test("a real JWT came back", () => {
          expect(body.accessToken.split(".")).to.have.lengthOf(3);
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## A real credential, a real JWT

  `dummyjson.com/auth/login` returns a signed JWT for a real user record. The
  password comes out of the vault, so the session token is genuinely derived
  from a secret that was never committed.

  Worth calling out the `bru.setVar()` in the post-response script. V4 made
  `bru.setEnvVar()` write to disk immediately - so a vault-sourced token
  stored with `setEnvVar` would be written into the environment file, and the
  vault would have bought you nothing. `setVar` keeps it run-scoped and in
  memory.

  The key `dummyjson-password` holds `jamesdpass` in every provider, which is
  the password for DummyJSON's user `jamesd` (James Davis, id 4).

  Note this uses a different user to
  `02 - Advanced/04-Auth/01-Token-Handoff/01-Login.yml` (`emilys`). That is not an oversight -
  the point of this request is that the password comes from the vault, so it
  uses whichever credential the vault actually holds. Nothing here is
  hand-edited to make a test pass.
