info:
  name: 02-Response Visualization
  type: http
  seq: 3
  tags:
    - regression

http:
  method: GET
  url: "{{pokeUrl}}/pokemon/{{pokemonName}}"
  headers:
    - name: X-Request-Id
      value: "{{requestId}}"
      description: Built in the before-request script below
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody() || {};
        const name = body.name || 'Unknown';
        const id = body.id != null ? `#${String(body.id).padStart(3, '0')}` : '';
        const sprites = body.sprites || {};
        const other = sprites.other || {};
        const artwork = (other['official-artwork'] || {}).front_default;
        const home = (other.home || {}).front_default;
        const dream = (other.dream_world || {}).front_default;
        const front = sprites.front_default;
        const shiny = sprites.front_shiny;
        const back = sprites.back_default;
        const primaryImage = artwork || home || dream || front || '';
        const types = (body.types || []).map(t => t && t.type && t.type.name).filter(Boolean);
        const typeColors = {
          normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#F7D02C',
          grass: '#7AC74C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1',
          ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A',
          rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746',
          steel: '#B7B7CE', fairy: '#D685AD'
        };
        const typeBadges = types.map(t => `<span style="background:${typeColors[t] || '#777'};color:#fff;padding:4px 12px;border-radius:12px;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-right:6px;">${t}</span>`).join('');
        const height = body.height != null ? `${(body.height / 10).toFixed(1)} m` : '—';
        const weight = body.weight != null ? `${(body.weight / 10).toFixed(1)} kg` : '—';
        const spriteThumb = (url, label) => url ? `<figure style="margin:0;text-align:center;"><img src="${url}" alt="${label}" style="width:96px;height:96px;object-fit:contain;background:#f4f4f5;border-radius:8px;"/><figcaption style="font-size:11px;color:#666;margin-top:4px;">${label}</figcaption></figure>` : '';
        const thumbnails = [
          spriteThumb(front, 'Front'),
          spriteThumb(back, 'Back'),
          spriteThumb(shiny, 'Shiny'),
          spriteThumb(home, 'Home'),
          spriteThumb(dream, 'Dream World')
        ].filter(Boolean).join('');
        const cry = (body.cries || {}).latest;
        const cryPlayer = cry ? `<audio controls src="${cry}" style="margin-top:12px;width:100%;max-width:320px;"></audio>` : '';

        const html = `
        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:12px;color:#fff;">
          <div style="background:rgba(255,255,255,0.95);color:#222;border-radius:12px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,0.2);">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;">
              <h1 style="margin:0;text-transform:capitalize;font-size:32px;">${name}</h1>
              <span style="color:#888;font-size:20px;font-weight:600;">${id}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;">
              <div style="flex:0 0 auto;text-align:center;">
                ${primaryImage ? `<img src="${primaryImage}" alt="${name}" style="width:240px;height:240px;object-fit:contain;background:#f4f4f5;border-radius:12px;"/>` : '<div style="width:240px;height:240px;background:#f4f4f5;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#999;">No image</div>'}
                ${cryPlayer}
              </div>
              <div style="flex:1;min-width:220px;">
                <div style="margin-bottom:12px;">${typeBadges || '<span style="color:#888;">No types</span>'}</div>
                <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;">
                  <strong>Height</strong><span>${height}</span>
                  <strong>Weight</strong><span>${weight}</span>
                  <strong>Base XP</strong><span>${body.base_experience ?? '—'}</span>
                  <strong>Order</strong><span>${body.order ?? '—'}</span>
                </div>
              </div>
            </div>
            ${thumbnails ? `<hr style="border:none;border-top:1px solid #eee;margin:20px 0;"/><div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">${thumbnails}</div>` : ''}
          </div>
        </div>
        `;

        bru.visualize('html', {
          name: `${name} ${id}`,
          content: html
        });
    - type: tests
      code: |-
        test("the pre-request script's header reached the wire", () => {
          const sent = req.getHeader("X-Request-Id");
          expect(sent).to.be.a("string").and.match(/^apiworld-/);
        });

        test("the post-response script stashed a summary", () => {
          const summary = JSON.parse(bru.getVar("pokemonSummary"));
          expect(summary.name).to.equal(res.getBody().name);
          expect(summary.types).to.be.an("array").with.length.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## The two script hooks

  | Hook | Runs | Typical job |
  |------|------|-------------|
  | `before-request` | after variables resolve, before the send | build a signature, a timestamp, a correlation id |
  | `after-response` | once the reply is back | extract a value, reshape the body, log |

  Here the pre-request script generates `X-Request-Id` - a header no human
  should be typing - and the post-response script folds the 20-key PokeAPI
  response down to four fields.

  ### The bit that gets a reaction

  `bru.getEnvVar("verboseLogging")` returns a real `false`, not the string
  `"false"`. Typed variables (`number`, `boolean`, `object`) arrive parsed, so
  `if (bru.getEnvVar("verboseLogging"))` does what it looks like it does. See
  `03-Variables/02-Typed Variables`.
