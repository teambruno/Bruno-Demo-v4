info:
  name: 03-Shared Script File
  type: http
  seq: 4
  tags:
    - shared-scripts

http:
  method: POST
  url: https://echo.usebruno.com
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: "{{correlationId}}"
      description: Generated by shared-scripts/testData.js
  body:
    type: json
    data: |-
      {
        "user": {{newUser}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // This file lives OUTSIDE the collection, at the workspace root. The
        // require() only resolves because opencollection.yml lists
        // ../../shared-scripts under extensions.bruno.scripts.additionalContextRoots.
        const { buildUser, correlationId } = require('../../shared-scripts/testData.js');

        const user = buildUser({ source: '01 - Core' });

        bru.setVar('newUser', JSON.stringify(user));
        bru.setVar('expectedEmail', user.email);
        bru.setVar('correlationId', correlationId('core'));
    - type: tests
      code: |-
        const {
          assertHealthyJsonResponse,
          assertRequiredFields
        } = require('../../shared-scripts/httpAsserts.js');

        const body = res.getBody();

        test('200, JSON, under 3s (one shared helper)', () => {
          assertHealthyJsonResponse(res, { status: 200, maxMs: 3000 });
        });

        test('echoed user carries every generated field', () => {
          assertRequiredFields(body.user, ['name', 'email', 'role', 'createdAt', 'source']);
        });

        test('the email came from the shared factory, not this request', () => {
          expect(body.user.email).to.equal(bru.getVar('expectedEmail'));
          expect(body.user.email).to.include('@usebruno.test');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## One JS module, every collection

  Nothing test-shaped in this request is written here. Both halves come from
  two files at the workspace root:

  ```js
  const { buildUser, correlationId } = require('../../shared-scripts/testData.js');
  const { assertHealthyJsonResponse } = require('../../shared-scripts/httpAsserts.js');
  ```

  All three collections in this workspace `require()` the same two modules.
  Write the "generate a unique user" helper once, not once per request.

  Opt in per collection, in `opencollection.yml`:

  ```yml
  extensions:
    bruno:
      scripts:
        additionalContextRoots:
          - "../../shared-scripts"
  ```

  ### The gate to demo

  A `require()` is sandboxed to its own collection by default. Reaching
  outside needs the developer sandbox:

  ```bash
  # Works
  bru run "02-Tests-and-Scripts" --env Demo --sandbox=developer

  # Fails on the require() - safe mode blocks paths outside the collection
  bru run "02-Tests-and-Scripts" --env Demo
  ```

  In the app the same switch is Developer Mode in the collection's script
  settings. Docs: <https://docs.usebruno.com/testing/script/js-file>

  ### One gotcha worth volunteering

  Runtime globals (`res`, `bru`, `expect`, `test`) are **not** injected into a
  required module, which is why `res` is passed into
  `assertHealthyJsonResponse(res, ...)` as an argument. The helpers throw a
  plain `Error`; the surrounding `test()` turns that into a named failure.
