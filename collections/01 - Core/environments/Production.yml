name: Production
color: "#CE4F3B"
variables:
  - name: pokeUrl
    value: https://pokeapi.co/api/v2
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
  - name: pokemonName
    value: ditto
    description: Different value to Demo, so switching the dropdown visibly changes the response
  - name: postId
    value: "1"
  - name: releaseStage
    value: production
  - name: retryLimit
    value:
      type: number
      data: "3"
    description: number - arrives in scripts as 3, not "3", so arithmetic just works
  - name: verboseLogging
    value:
      type: boolean
      data: "false"
    description: boolean - use it directly in an if(), no string comparison needed
  - name: featureFlags
    value:
      type: object
      data: |-
        {
          "betaSearch": false,
          "newAuthFlow": false,
          "maxBatchSize": 100
        }
    description: object - read nested keys, e.g. bru.getEnvVar("featureFlags").betaSearch
