info:
  name: 01-Secrets Manager Migration
  type: http
  seq: 1
  tags:
    - v4-feature

http:
  method: GET
  url: https://httpbin.org/get?token={{azure-keys.reqres-api-key}}
  params:
    - name: token
      value: "{{azure-keys.reqres-api-key}}"
      type: query
  auth: inherit

docs:
  content: |-
    ### V4 feature: secrets move into the environment

    Before (V3 and earlier) - `secrets.json` at the collection root:

    ```json
    {
      "type": "azure-key-vault",
      "data": [
        {
          "environment": "Demo-Env",
          "secrets": [
            { "name": "azure-keys", "vaultName": "Demo-James", "enabled": true }
          ]
        }
      ]
    }
    ```

    Referenced in requests as `{{$secrets.azure-keys.reqres-api-key}}`.

    After (V4) - the same config lives in `environments/Demo-Env.yml` under
    `externalSecrets`, managed from the Environment UI instead of Collection
    Settings > Secrets, and referenced with the simpler `{{name.keyname}}`
    form used in this request. The old `{{$secrets.*}}` syntax still works
    but is deprecated and gets an underline/tooltip in the app.

    This workspace previously had a `secrets.json` doing exactly this - it's
    been removed as part of the V4 cleanup; see `environments/Demo-Env.yml`
    in the "02 - Auth and Scripting" collection for the migrated shape.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
