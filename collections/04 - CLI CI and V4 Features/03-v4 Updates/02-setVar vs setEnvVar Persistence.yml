info:
  name: 02-setVar vs setEnvVar Persistence
  type: http
  seq: 2
  tags:
    - v4-feature

http:
  method: POST
  url: https://www.httpfaker.org/api/echo
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // NOT persisted to disk - lives only for this run.
        // Use this for anything sensitive (tokens, passwords, one-off values).
        bru.setVar('sessionToken', 'demo-' + Date.now());

    - type: after-response
      code: |-
        // Persisted to disk automatically in V4 (this did NOT write to disk
        // pre-V4). Fine for non-sensitive values like a baseUrl or counter,
        // but audit any script using setEnvVar/setGlobalEnvVar with secrets
        // before upgrading, and switch those to setVar/deleteVar instead.
        bru.setEnvVar('lastRunAt', new Date().toISOString());
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs:
  content: |-
    ### V4 feature: environment variable persistence

    In V4, `bru.setEnvVar()` / `bru.setGlobalEnvVar()` write straight to the
    environment file on disk. Pre-V4 they only lived in memory for the run.

    Watch out: if a script sets a token/credential this way and the
    environment file is committed to git, that secret now gets pushed to
    the repo. For sensitive values, use `bru.setVar()` / `bru.deleteVar()`
    instead - same API, but memory-only for the duration of the run.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
