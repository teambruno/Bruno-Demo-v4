info:
  name: 04-Legacy Secret Var - Migrated
  type: http
  seq: 4
  tags:
    - v4-feature

http:
  method: POST
  url: "https://www.httpfaker.org/api/echo?token={{secretStore.reqres-api-key}}"
  params:
    - name: token
      value: "{{secretStore.reqres-api-key}}"
      type: query
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

docs:
  content: |-
    This is the migrated version of the old "Bruno Secret Mgr Variable"
    request from the pre-revamp workspace. It used to point at
    www.httpfaker.com and referenced `{{$secrets.vault.reqres-api-key}}`
    (V3 syntax, backed by a root-level secrets.json). Both the endpoint and
    the syntax have been updated - see 01-Secrets Manager Migration.yml for
    the before/after.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
