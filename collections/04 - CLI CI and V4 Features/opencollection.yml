opencollection: 1.0.0

info:
  name: 04 - CLI CI and V4 Features
  version: v1.0.0
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |-
    # 04 - CLI CI and V4 Features

    CLI runner + reporter demos (tags, data-driven, multi-format reports),
    protocol coverage beyond REST (SOAP, SSE, gRPC, GraphQL, WebSocket),
    and a dedicated tour of what's new in Bruno V4.

    ```bash
    bru run --env Production --tags smoke
    bru run --env Production --tags regression
    bru run --env Production --exclude-tags slow
    bru run --env Production --reporter-junit reports/results.xml

    # Shared scripts (additionalContextRoots) need the developer sandbox
    bru run "03-v4 Updates" --env Production --sandbox=developer
    ```
  type: text/markdown
bundled: false
extensions:
  bruno:
    scripts:
      additionalContextRoots:
        - ../../shared-scripts
