name: Production
color: "#4CAF50"
variables:
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
  - name: breweryUrl
    value: https://api.openbrewerydb.org/v1
  - name: dummyUrl
    value: https://dummyjson.com
  - name: weatherUrl
    value: https://api.open-meteo.com/v1
  - name: postId
    value: "1"
  - name: userId
    value: "1"
  - name: releaseStage
    value: production
  - name: retryLimit
    value:
      type: number
      data: "2"
    description: number - retry twice before failing the pipeline
  - name: failFast
    value:
      type: boolean
      data: "false"
    description: boolean - run everything so the report covers the full suite
  - name: reporterConfig
    value:
      type: object
      data: |-
        {
          "junit": true,
          "html": true,
          "outputDir": "reports"
        }
    description: object - reporter switches grouped into one typed variable
