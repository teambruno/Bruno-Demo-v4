docs:
  content: |-
    ## 06 – Tags & Filtering

    Bruno CLI lets you target specific subsets of requests using tags.
    Each request in this folder is tagged so you can mix and match runs.

    | Request                    | Tags                        |
    |----------------------------|-----------------------------|
    | 01-Health Check            | `smoke`                     |
    | 02-List Comments           | `smoke`, `regression`       |
    | 03-List Albums             | `regression`                |
    | 04-Brewery Search          | `regression`, `slow`        |

    ```bash
    # Run only smoke tests (fast CI gate)
    bru run "06-Tags-and-Filtering" --env Production --tags smoke

    # Run full regression suite
    bru run "06-Tags-and-Filtering" --env Production --tags regression

    # Exclude slow tests
    bru run "06-Tags-and-Filtering" --env Production --exclude-tags slow

    # Combine: regression but not slow
    bru run "06-Tags-and-Filtering" --env Production --tags regression --exclude-tags slow
    ```
  type: text/markdown
