info:
  name: echo-websocket (V4 multi-message demo)
  type: websocket
  seq: 3
  tags:
    - v4-feature

websocket:
  url: wss://echo.websocket.org
  message:
    - title: Greeting
      selected: true
      message:
        type: json
        data: |-
          {
            "type": "message",
            "content": "Hello from Bruno!",
            "user": {
              "id": 123,
              "name": "{{nameVar}}"
            }
          }
    - title: Ping
      selected: false
      message:
        type: text
        data: ping
  auth: inherit

docs:
  content: |-
    ### V4 feature: multiple WebSocket messages

    Bruno V4 lets a single WebSocket request store more than one saved message
    ("Greeting", "Ping" above) and switch between them with the `selected` flag,
    instead of being limited to one payload per request.

    Endpoint: `wss://echo.websocket.org` - verified live 2026-08-12. It sends
    a "Request served by ..." banner frame on connect, then echoes each
    message back, so the Messages pane fills up as you fire Greeting and Ping.

    Backup if it's down on demo day: `wss://ws.ifelse.io` (same operator,
    identical behaviour). Avoid `wss://echo.websocket.events` - dead as of
    this date (ENOTFOUND). `wss://ws.postman-echo.com/raw` also works but
    don't put a Postman URL on screen during a Bruno demo.
  type: text/markdown
