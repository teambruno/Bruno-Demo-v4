info:
  name: 03-OAuth2 Client Credentials
  type: http
  seq: 3
  tags:
    - regression
    - auth

http:
  method: GET
  url: "{{httpfakerUrl}}/api/auth/oauth2/client-credentials/resource?access_token"
  params:
    - name: access_token
      value: ""
      type: query
      description: where this token endpoint expects the token to be placed
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{httpfakerUrl}}/api/auth/oauth2/client-credentials/token"
    credentials:
      clientId: demo-client-id
      clientSecret: demo-client-secret
      placement: body
    scope: user:read
    tokenConfig:
      id: credentials
      placement:
        query: access_token
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: false

runtime:
  scripts:
    - type: tests
      code: |-
        test("the client-credentials exchange succeeded", () => {
          // A wrong secret or a missing scope returns 401, so a 200 here is
          // real evidence the token exchange worked.
          expect(res.getStatus()).to.equal(200);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## OAuth2, handled for you

  Two requests' worth of work in one. `autoFetchToken` is on, so Bruno calls
  the token endpoint, reads `access_token` out of the response, and places it
  on this request - all before the send. There is no "get token" request in
  this folder because you do not need one.

  Bruno supports all four OAuth2 flows: client credentials (here),
  authorization code with PKCE, implicit, and password credentials.

  This runs against `httpfaker.org`, which Bruno owns and operates, so a
  third-party sandbox outage cannot take the demo down. The token endpoint
  requires `scope=user:read` - dropping it 401s even with a correct secret.

  ### The obvious next question

  `clientSecret` is sitting in this file in plain text. That is the wrong place
  for it, and the fix is one collection over:
  **03 - Secrets and OpenAPI / 01-Secret-Manager / 02-OAuth2 Client Secret**
  is this exact request with the secret read from a vault instead. Put the two
  files side by side - it is the whole before-and-after in one frame.
