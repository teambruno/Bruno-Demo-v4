opencollection: 1.0.0

info:
  name: 02 - Advanced
  version: v1.0.0
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |-
    # 02 - Advanced

    The things people do not expect an open-source API client to do.

    | # | Folder | The one-line pitch |
    |---|--------|--------------------|
    | 01 | **Chaining** | Four requests walk a Pokemon's evolution chain by following links in each response. Nobody pastes an id. |
    | 02 | **Data-Driven** | One request file, eight rows of a CSV, eight runs. |
    | 03 | **Runner-and-Tags** | Tag requests `smoke` / `regression` / `slow` and run any slice of them. |
    | 04 | **Auth** | Four schemes in subfolders: JWT handoff, Bearer inherited from the folder, API key header-or-query, OAuth2. |
    | 05 | **Beyond-REST** | GraphQL, WebSocket, SSE and gRPC in the same client. |
    | 06 | **Reusable-Scripts** | `require()` a real JS module: one local, one shared across collections, one npm package. |

    Default environment at the table: **Demo**.

    ## The 90-second version

    Open `01-Chaining`, hit **Run** on the folder, and talk while it goes:
    "It picked a random electric Pokemon, looked it up, followed the species
    link, then walked the evolution chain - `pichu` to `pikachu` to `raichu`.
    Four requests, zero hardcoded ids."

    Then `02-Data-Driven` for "and the same request over a spreadsheet of test
    data", and `05-Beyond-REST` if they ask about protocols.

    ## Run it

    ```bash
    # The whole collection. The flags matter - see the notes below.
    bru run --env Demo --exclude-tags app-only,data-driven --sandbox=developer

    # The chain
    bru run "01-Chaining" --env Demo

    # Data-driven: 8 rows -> 8 iterations
    bru run "02-Data-Driven" --env Demo --csv-file-path "02-Data-Driven/pokemon.csv"
    bru run "02-Data-Driven" --env Demo --json-file-path "02-Data-Driven/pokemon.json"

    # Auth: subfolders, so -r or nothing runs
    bru run "04-Auth" -r --env Demo --exclude-tags app-only

    # Tag slices
    bru run --env Demo --tags smoke
    bru run --env Demo --tags regression --exclude-tags slow

    # Reusable JS modules: request 01 needs no flag, 02 and 03 do
    bru run "06-Reusable-Scripts" --env Demo --sandbox=developer

    # Reports in all three formats
    bru run "03-Runner-and-Tags" --env Demo \
      --reporter-html ../../reports/advanced.html \
      --reporter-json ../../reports/advanced.json \
      --reporter-junit ../../reports/advanced.xml
    ```

    ### Two exclusions to know before you run the whole collection

    `--exclude-tags app-only,data-driven` is not decoration:

    - **`app-only`** - the CLI cannot execute WebSocket or gRPC requests, and
      an SSE stream has no final response to assert against. Those three
      requests live in `05-Beyond-REST` and are app demos. A fourth carries
      the tag for a different reason: `04-Auth/03-API-Key/02-Key in the Query
      String` - on bru 4.0.0 the CLI assembles the URL before interpolating
      variables, so a query-placed API key never reaches the wire. It works in
      the app; its docs have the detail.
    - **`data-driven`** - `02-Data-Driven` is *designed* to fail when no data
      file is attached, so that forgetting `--csv-file-path` is loud rather
      than silent. Run that folder with its own command.

    Without them a whole-collection run reports five failures, all expected -
    which is a bad look at a table even when you can explain it.

    With them: **20 passed, 66 tests, ~3s.**

    `--exclude-tags` takes **one comma-separated value**. Repeating the flag
    (`--exclude-tags a --exclude-tags b`) fails with
    `excludeTags.split is not a function` on bru 4.0.0.

    ### And one flag, plus one install

    `--sandbox=developer` is needed by two requests in `06-Reusable-Scripts`:
    `02-Shared JS File` (requires a module from outside the collection) and
    `03-NPM Module` (requires an npm package from `node_modules`). Without it
    they fail with
    `Access to files outside of the collectionPath is not allowed.`

    Their sibling `01-Collection JS File` requires a `.js` file from *inside*
    the collection and needs no flag at all. That difference is the point of
    folder 06.

    **First-run setup for `03-NPM Module`.** This collection has a
    `package.json` (committed) and a `node_modules` (gitignored), so once per
    clone:

    ```bash
    cd "collections/02 - Advanced" && npm install
    ```

    A lot of what people want is bundled already - `ajv`, `crypto-js`,
    `jsonwebtoken`, `axios`, `chai`, `uuid`, `moment` - and needs no install
    and no flag. See the folder docs for the full verified list.
  type: text/markdown
bundled: false
extensions:
  bruno:
    scripts:
      additionalContextRoots:
        - ../../shared-scripts
