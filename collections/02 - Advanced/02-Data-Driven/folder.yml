docs:
  content: |-
    ## 02 - Data-Driven

    One request file. Eight rows. Eight runs.

    Bruno iterates the request over every row of a data file and injects that
    row's columns as variables for that iteration. `{{pokemonName}}` in the
    URL is a different Pokemon each time.

    | pokemonName | expectedType | expectedId |
    |-------------|--------------|-----------|
    | pikachu | electric | 25 |
    | charizard | fire | 6 |
    | snorlax | normal | 143 |
    | gengar | ghost | 94 |
    | bulbasaur | grass | 1 |
    | squirtle | water | 7 |
    | mewtwo | psychic | 150 |
    | dragonite | dragon | 149 |

    Eight rows, eight **distinct primary types** - so the run visibly exercises
    different data rather than the same shape eight times. Every id and type
    was checked against the live API on 2026-08-20.

    `pokemon.csv` and `pokemon.json` hold the same eight rows, so the two flags
    below are interchangeable - handy for showing this is not a CSV-only
    feature.

    ```bash
    # CSV
    bru run "02-Data-Driven" --env Demo --csv-file-path "02-Data-Driven/pokemon.csv"

    # JSON - same eight rows, same result
    bru run "02-Data-Driven" --env Demo --json-file-path "02-Data-Driven/pokemon.json"

    # With an HTML report - each iteration is its own section
    bru run "02-Data-Driven" --env Demo \
      --csv-file-path "02-Data-Driven/pokemon.csv" \
      --reporter-html ../../reports/data-driven.html
    ```

    Run these from the collection root (`collections/02 - Advanced`) - the
    data-file path resolves relative to the working directory.

    **At the table:** open `pokemon.csv` in an editor, add a row, re-run.
    "Your test data is a spreadsheet your QA lead can edit. No code change."
  type: text/markdown
