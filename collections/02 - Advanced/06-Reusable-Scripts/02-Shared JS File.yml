info:
  name: 02-Shared JS File
  type: http
  seq: 2
  tags:
    - shared-scripts
    - js-file

http:
  method: POST
  url: "{{echoUrl}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: "{{correlationId}}"
      description: Generated by shared-scripts/testData.js
  body:
    type: json
    data: |-
      {
        "user": {{newUser}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // This file lives OUTSIDE the collection, at the workspace root. The
        // require() only resolves because opencollection.yml lists
        // ../../shared-scripts under
        // extensions.bruno.scripts.additionalContextRoots - and only under the
        // developer sandbox.
        const { buildUser, correlationId } = require('../../shared-scripts/testData.js');

        const user = buildUser({ source: '02 - Advanced' });

        bru.setVar('newUser', JSON.stringify(user));
        bru.setVar('expectedEmail', user.email);
        bru.setVar('correlationId', correlationId('advanced'));
    - type: tests
      code: |-
        const {
          assertHealthyJsonResponse,
          assertRequiredFields
        } = require('../../shared-scripts/httpAsserts.js');

        const body = res.getBody();

        test('200, JSON, under 3s (shared helper)', () => {
          assertHealthyJsonResponse(res, { status: 200, maxMs: 3000 });
        });

        test('echoed user carries every generated field (shared helper)', () => {
          assertRequiredFields(body.user, ['name', 'email', 'role', 'createdAt', 'source']);
        });

        test('the email came from the shared factory, not this request', () => {
          expect(body.user.email).to.equal(bru.getVar('expectedEmail'));
          expect(body.user.email).to.include('@usebruno.test');
        });

        test('role is one of the values the shared factory can pick', () => {
          expect(['admin', 'editor', 'viewer']).to.include(body.user.role);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## A JS file shared across collections

  Same idea as request 01, one directory higher. Nothing test-shaped in this
  request is written here - the payload is built by
  `/shared-scripts/testData.js` and validated by `/shared-scripts/httpAsserts.js`:

  ```js
  const { buildUser, correlationId } = require('../../shared-scripts/testData.js');
  const { assertHealthyJsonResponse } = require('../../shared-scripts/httpAsserts.js');
  ```

  Those two modules sit at the **workspace root**, so every collection here can
  use them. Write the "generate a unique user" helper once, not once per
  collection.

  ## What it costs, versus request 01

  Reaching outside a collection is opt-in, in two places.

  **1. Declare the directory** in each collection's `opencollection.yml`
  (`bruno.json` for BRU collections):

  ```yml
  extensions:
    bruno:
      scripts:
        additionalContextRoots:
          - "../../shared-scripts"
  ```

  All three collections in this workspace declare it.

  **2. Use the developer sandbox.** The default has been `safe` since CLI 3.0.0.

  ```bash
  # Works
  bru run "06-Reusable-Scripts" --env Demo --sandbox=developer

  # Fails on the require()
  bru run "06-Reusable-Scripts" --env Demo
  # -> Access to files outside of the collectionPath is not allowed.
  ```

  In the app the equivalent switch is Developer Mode in the collection's script
  settings.

  ### Reading the error you get

  Two different messages, and they mean different things:

  | Message | Fix |
  |---|---|
  | `Access to files outside of the collectionPath is not allowed.` | turn on the developer sandbox |
  | `Access to files outside of the allowed context roots is not allowed: .` | add the directory to `additionalContextRoots` |

  Both verified on bru 4.0.0. Docs:
  <https://docs.usebruno.com/testing/script/js-file>
