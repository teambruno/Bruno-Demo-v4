info:
  name: Create Subscriptions
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/subscriptions"
  body:
    type: json
    data: |-
      {
        "name":"SubscriptionName1",
        "filterOptions":{
          "includedActionTypes":[
            "USER.CREATED",
            "USER.UPDATED"
          ],
          "includedPopulations":[
            {"id": "{{popID}}"}
          ],
          "includedApplications":[
            {"id": "{{appID}}"}
          ]
        },
         "httpEndpoint":{
          "url":"https://subscriptionendpoint.com",
          "headers":{
            "some-header":"some-value"
          }
        },
        "format":"ACTIVITY",
        "verifyTlsCertificates":true,
        "tlsClientAuthKeyPair":{
            "id": "{{keyID}}"
        },
        "enabled":true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("subscriptionID", jsonData.id);
            console.log("subscriptionID is now: " + bru.getEnvVar("subscriptionID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Subscriptions](https://developer.pingidentity.com/pingone-api/platform/subscriptions-webhooks/create-subscriptions.html).
