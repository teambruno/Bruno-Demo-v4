info:
  name: Create User Import External Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.user.import+json
  body:
    type: json
    data: |-
      {
         "population": {
             "id": "{{popID}}"
         },
         "username": "myRemoteUser-1",
         "password" : {
            "external" : {
                 "gateway" : {
                     "id" : "{{gatewayID}}",
                     "userType": {
                         "id" : "{{userTypeID}}"
                     },
                     "correlationAttributes" : {
                         "uid" : "{{username}}"
                     }
                 }
            }
         }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("userID", jsonData.id);
            console.log("userID is now: " + bru.getEnvVar("userID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create User Import External Password](https://developer.pingidentity.com/pingone-api/platform/users/users-1/create-user-import-external-password.html).
