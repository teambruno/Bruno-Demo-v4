info:
  name: Verify User
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.user.verify+json
  body:
    type: json
    data: |-
      {
          "verificationCode": "{{verificationCode}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Verify User](https://developer.pingidentity.com/pingone-api/platform/users/users-1/verify-user-1.html).
