info:
  name: Read User by ID
  type: http
  seq: 7

http:
  method: GET
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}?expand=population"
  params:
    - name: expand
      value: population
      type: query
      description: Returns information about the user's population assignment.
    - name: include
      value: memberOfGroupNames
      type: query
      description: Includes all groups to which the user belongs. See documentation for usage.
      disabled: true
    - name: filter
      value: ""
      type: query
      disabled: true
    - name: limit
      value: ""
      type: query
      disabled: true
    - name: order
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Read User by ID](https://developer.pingidentity.com/pingone-api/platform/users/users-1/read-one-user.html).
