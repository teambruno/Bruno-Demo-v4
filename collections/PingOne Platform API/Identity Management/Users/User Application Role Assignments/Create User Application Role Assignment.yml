info:
  name: Create User Application Role Assignment
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/applicationRoles"
  body:
    type: json
    data: |-
      {
          "id": "{{appRoleID}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("roleAssignmentID", jsonData.id);
            console.log("roleAssignmentID is now: " + bru.getEnvVar("roleAssignmentID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create User Application Role Assignment](https://developer.pingidentity.com/pingone-api/platform/users/user-application-role-assignments/create-user-application-role-assignments.html).
