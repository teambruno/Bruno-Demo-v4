info:
  name: Read All Sessions
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/sessions"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 200) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("someObjectID", jsonData._embedded.sessions[0].id);
            console.log("someObjectID is now: " + bru.getEnvVar("someObjectID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Read All Sessions](https://developer.pingidentity.com/pingone-api/platform/users/user-sessions/read-all-sessions.html).
