info:
  name: Resend Admin Invite
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.user.invite+json
  body:
    type: json
    data: |
      {
         "invite": {
           "expirationMinutes": 120
         }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Resend Admin Invite](https://developer.pingidentity.com/pingone-api/platform/users/user-admin-invitations/resend-admin-invite.html).
