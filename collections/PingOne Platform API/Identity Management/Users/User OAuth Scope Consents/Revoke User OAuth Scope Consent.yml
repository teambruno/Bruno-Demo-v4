      value: application/vnd.pingidentity.consent.revoke+json
  body:
    type: json
    data: |
      {
        "status" : "REVOKED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

