info:
  name: Read One User OAuth Scope Consent
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/oauthConsents/{{oauthConsentID}}"
  params:
    - name: expand
      value: applications
      type: query
      description: Returns additional information about the associated app in the response.
      disabled: true
    - name: filter
      value: application.id eq "{{appID}}"
      type: query
      description: Filters a user's consents by app ID or app name.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Read One User OAuth Scope Consent](https://developer.pingidentity.com/pingone-api/platform/users/user-oauth-scope-consents/read-one-user-oauth-scope-consent.html).
