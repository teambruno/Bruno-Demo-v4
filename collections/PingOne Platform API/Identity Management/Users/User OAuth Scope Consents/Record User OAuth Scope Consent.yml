info:
  name: Record User OAuth Scope Consent
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/oauthConsents"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.consent.accept+json
  body:
    type: json
    data: |-
      {
        "application": {
          "name": "externalApp1",
          "appType": "EXTERNAL"
        },
        "scope": [
          "openid"
        ],
        "browser": {
          "name": "Chrome",
          "version": "101"
        },
        "operatingSystem": {
          "name": "Mac OS",
          "version": "12.5.1"
        },
        "device": {
          "type": "desktop"
        },
        "status": "ACCEPTED"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("oauthConsentID", jsonData.id);
            console.log("oauthConsentID is now: " + bru.getEnvVar("oauthConsentID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Record User OAuth Scope Consent](https://developer.pingidentity.com/pingone-api/platform/users/user-oauth-scope-consents/record-user-oauth-scope-consent.html).
