  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/population"
  body:
    type: json
    data: |-
      {
          "id": "{{popID}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

