info:
  name: Password Force Change
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/password"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.password.forceChange
    - name: Accept
      value: application/json
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Password Force Change](https://developer.pingidentity.com/pingone-api/platform/users/user-passwords/force-change-password.html).
