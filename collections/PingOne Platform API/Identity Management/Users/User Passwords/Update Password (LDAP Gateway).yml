info:
  name: Update Password (LDAP Gateway)
  type: http
  seq: 11

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/password"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.password.setGateway+json
  body:
    type: json
    data: |-
      {
          "id": "{{gatewayID}}",
          "userType": {
              "id": "{{userTypeID}}"
          },
          "correlationAttributes": {
              "uid": "eFudd",
              "mail": "eFudd@example.com"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Password (LDAP Gateway)](https://developer.pingidentity.com/pingone-api/platform/users/user-passwords/update-password-external.html).
