info:
  name: Password Recover
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/password"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.password.recover+json
  body:
    type: json
    data: |-
      {
        "recoveryCode": "{{code}}",
        "newPassword": "{{newPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Password Recover](https://developer.pingidentity.com/pingone-api/platform/users/user-passwords/password-recover.html).
