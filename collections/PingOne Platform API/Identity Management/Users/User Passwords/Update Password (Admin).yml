info:
  name: Update Password (Admin)
  type: http
  seq: 8

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/password"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.password.reset+json
  body:
    type: json
    data: |-
      {
          "newPassword": "{{newPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Password (Admin)](https://developer.pingidentity.com/pingone-api/platform/users/user-passwords/update-password-admin.html).
