info:
  name: Password Check
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/password"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.password.check+json
  body:
    type: json
    data: |-
      {
        "password":"{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Password Check](https://developer.pingidentity.com/pingone-api/platform/users/user-passwords/password-check.html).
