info:
  name: Accept Agreement
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/agreementConsents/{{agreementID}}"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.consent.accept+json
  body:
    type: json
    data: |-
      {
          "language": {
              "id": "{{languageID}}"
          },
          "revision": {
              "id": "{{revisionID}}"
          },
          "consentedAt": {{date}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Accept Agreement](https://developer.pingidentity.com/pingone-api/platform/users/user-agreement-consents/accept-agreement.html).
