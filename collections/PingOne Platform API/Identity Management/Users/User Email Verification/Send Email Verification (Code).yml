info:
  name: Send Email Verification (Code)
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/users/{{userID}}/emailVerification"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.user.emailVerification.send+json
  body:
    type: json
    data: |-
      {
          "notificationType": "admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Send Email Verification (Code)](https://developer.pingidentity.com/pingone-api/platform/users/user-email-verification/send-email-verification-code.html).
