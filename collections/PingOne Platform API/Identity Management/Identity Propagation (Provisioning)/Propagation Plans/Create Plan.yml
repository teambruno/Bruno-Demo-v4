info:
  name: Create Plan
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/plans"
  body:
    type: json
    data: |-
      {
          "name": "Default Plan"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("planID", jsonData.id);
            console.log("planID is now: " + bru.getEnvVar("planID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Plan](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-plans/create-plan.html).
