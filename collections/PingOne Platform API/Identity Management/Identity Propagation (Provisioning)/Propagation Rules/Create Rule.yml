info:
  name: Create Rule
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/plans/{{planID}}/rules"
  body:
    type: json
    data: |-
      {
          "plan": {
              "id": "{{planID}}"
          },
          "environment": {
              "id": "{{envID}}"
          },
          "sourceStore": {
              "id": "{{sourceStoreID}}"
          },
          "targetStore": {
              "id": "{{targetStoreID}}"
          },
          "groups": [
               {
                   "id": "{{groupID}}"
               }
           ],
          "deprovision": true,
          "name": "rule name",
          "description": "rule description",
          "populationExpression": "population.id eq \"{{popID}}\""
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("ruleID", jsonData.id);
            console.log("ruleID is now: " + bru.getEnvVar("ruleID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Rule](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-rules/create-rule.html).
