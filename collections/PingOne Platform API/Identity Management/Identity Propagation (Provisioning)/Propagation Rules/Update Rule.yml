info:
  name: Update Rule
  type: http
  seq: 12

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/propagation/rules/{{ruleID}}"
  body:
    type: json
    data: |-
      {
          "plan": {
              "id": "{{planID}}"
          },
          "name": "updated rule",
          "environment": {
              "id": "{{envID}}"
          },
          "sourceStore": {
              "id": "{{sourceStoreID}}"
          },
          "targetStore": {
              "id": "{{targetStoreID}}"
          },
          "groups": [
              {
                  "id": "{{groupID}}"
              }
          ],
          "active": true,
          "populationExpression": "population.id eq \"{{popID}}\""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Rule](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-rules/update-rule.html).
