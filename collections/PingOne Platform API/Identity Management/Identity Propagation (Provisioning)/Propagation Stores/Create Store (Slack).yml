info:
  name: Create Store (Slack)
  type: http
  seq: 12

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "type": "Slack",
          "name": "Slack target store",
          "description": "Create a Slack connection",
          "configuration": {
              "UNIQUE_USER_IDENTIFIER": "primaryEmail",
              "CREATE_USERS": true,
              "UPDATE_USERS": true,
              "DEPROVISION_USERS": true,
              "DISABLE_USERS": true,
              "OAUTH_ACCESS_TOKEN": "yourOauthAccessToken",
              "REMOVE_ACTION": "Disable",
              "GROUP_MEMBERSHIP_HANDLING": "Overwrite"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response body JSON contains name and id strings", function () {
          const jsonData = res.getBody();
          expect(jsonData.name).to.be.a('string');
          expect(jsonData.id).to.be.a('string');
          bru.setEnvVar("storeID", jsonData.id);
          console.log("storeID is now: " + bru.getEnvVar("storeID"));
          bru.setEnvVar("targetStoreID", jsonData.id);
          console.log("targetStoreID is now: " + bru.getEnvVar("targetStoreID"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (Slack)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-slack.html).
