info:
  name: Create Store (SalesforceContacts)
  type: http
  seq: 9

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "type": "SalesforceContacts",
          "name": "SalesforceLeadsTest",
          "configuration": {
              "RECORD_TYPE": "Lead",
              "ENABLE_COMMUNITIES": false,
              "PERMISSION_SET_MANAGEMENT": "Merge with permission sets in SalesforceContacts",
              "CREATE_USERS": true,
              "UPDATE_USERS": true,
              "DISABLE_USERS": true,
              "PROVISION_DISABLED_USERS": true,
              "SALESFORCE_DOMAIN": "my.salesforce.com",
              "PROFILE_ID": "yourProfileID",
              "ACCOUNT_ID": "yourAccountID",
              "CLIENT_ID": "yourClientID",
              "CLIENT_SECRET": "yourClientSecret",
              "OAUTH_ACCESS_TOKEN": "yourAccessToken",
              "OAUTH_REFRESH_TOKEN": "yourRefreshToken"
          },
          "image": {
              "href": "https://d1oekt4jpdthse.cloudfront.net/branding/market/cb933bfe-8282-405a-a780-0a19b97edc02.png"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("storeID", jsonData.id);
            console.log("storeID is now: " + bru.getEnvVar("storeID"));
            bru.setEnvVar("targetStoreID", jsonData.id);
            console.log("targetStoreID is now: " + bru.getEnvVar("targetStoreID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (SalesforceContacts)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-salesforcecontacts.html).
