info:
  name: Create Store (SCIM)
  type: http
  seq: 10

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "type": "scim",
          "name": "scim",
          "configuration": {
              "AUTHENTICATION_METHOD": "None",
              "USER_FILTER": "username Eq \"%s\"",
              "UNIQUE_USER_IDENTIFIER": "userName",
              "REMOVE_ACTION": "Disable",
              "CREATE_USERS": true,
              "UPDATE_USERS": true,
              "DISABLE_USERS": true,
              "REMOVE_ACTION": "Delete",
              "GROUP_MEMBERSHIP_HANDLING": "Overwrite",
              "GROUP_NAME_SOURCE": "Distinguished Name",
              "GROUPS_RESOURCE": "/Groups",
              "USERS_RESOURCE": "/Users",
              "SCIM_VERSION": "2.0",
              "SCIM_URL": "https://example.com",
              "AUTHORIZATION_TYPE": "Basic",
              "OAUTH_ACCESS_TOKEN": "yourAccessToken",
              "OAUTH_TOKEN_REQUEST": "https://example.com/oauthtoken",
              "OAUTH_CLIENT_ID": "yourOauthClientId",
              "OAUTH_CLIENT_SECRET": "yourOauthClientSecret",
              "BASIC_AUTH_USER": "{{basicAuthUsername}}",
              "BASIC_AUTH_PASSWORD": "{{basicAuthPassword}}"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("storeID", jsonData.id);
            console.log("storeID is now: " + bru.getEnvVar("storeID"));
            bru.setEnvVar("targetStoreID", jsonData.id);
            console.log("targetStoreID is now: " + bru.getEnvVar("targetStoreID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (SCIM)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-scim.html).
