info:
  name: Create Store (Aquera)
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "type": "Aquera",
          "name": "AqueraTest",
          "configuration": {
              "AUTHENTICATION_METHOD": "None",
              "USER_FILTER": "username Eq \"%s\"",
              "UNIQUE_USER_IDENTIFIER": "userName",
              "REMOVE_ACTION": "Disable",
              "CREATE_USERS": true,
              "UPDATE_USERS": true,
              "DISABLE_USERS": true,
              "USERS_RESOURCE": "/Users",
              "SCIM_VERSION": "2.0",
              "SCIM_URL": "https://example.com",
              "AUTHORIZATION_TYPE": "Basic",
              "BASIC_AUTH_USER": "{{basicAuthUsername}}",
              "BASIC_AUTH_PASSWORD": "{{basicAuthPassword}}"
          },
          "image": {
              "href": "https://d1oekt4jpdthse.cloudfront.net/branding/market/cb933bfe-8282-405a-a780-0a19b97edc02.png"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("storeID", jsonData.id);
            console.log("storeID is now: " + bru.getEnvVar("storeID"));
            bru.setEnvVar("targetStoreID", jsonData.id);
            console.log("targetStoreID is now: " + bru.getEnvVar("targetStoreID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (Aquera)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-aquera.html).
