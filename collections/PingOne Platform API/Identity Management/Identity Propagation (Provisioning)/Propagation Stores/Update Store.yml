  url: "{{apiPath}}/environments/{{envID}}/propagation/stores/{{storeID}}"
  body:
    type: json
    data: |-
      {
          "type": "scim",
          "name": "scim",
          "description": "Update a scim connection",
          "configuration": {
              "AUTHENTICATION_METHOD": "Basic Authentication",
              "SCIM_URL": "https://scim.url",
