info:
  name: Create Store (AzureActiveDirectorySAML2)
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "type": "AzureActiveDirectorySAML2",
          "name": "azureTest2",
          "configuration": {
              "CREATE_USERS": true,
              "UPDATE_USERS": true,
              "DEPROVISION_USERS": true,
              "DISABLE_USERS": true,
              "ClientId": "azureADClientId",
              "TenantDomain": "TenantDomain",
              "ClientSecret": "azureADClientSecret",
              "REMOVE_ACTION": "Delete",
              "RemoveLicensesWhenSkuIdEmpty": true
          },
          "image": {
              "href": "https://d1oekt4jpdthse.cloudfront.net/branding/market/cb933bfe-8282-405a-a780-0a19b97edc02.png"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("storeID", jsonData.id);
            console.log("storeID is now: " + bru.getEnvVar("storeID"));
            bru.setEnvVar("targetStoreID", jsonData.id);
            console.log("targetStoreID is now: " + bru.getEnvVar("targetStoreID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (AzureActiveDirectorySAML2)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-azure-ad-saml.html).
