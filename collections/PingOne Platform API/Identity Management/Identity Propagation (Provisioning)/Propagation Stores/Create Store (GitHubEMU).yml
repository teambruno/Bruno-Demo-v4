info:
  name: Create Store (GitHubEMU)
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "type": "GitHubEMU",
          "status": "INACTIVE",
          "configuration": {
              "BASE_URL": "https://store.example.com/",
              "CREATE_USERS": true,
              "DEPROVISION_USERS": true,
              "OAUTH_ACCESS_TOKEN": "amlYM1UwRmpscEljTjlKMGExdWdVMTc3dzVtb1hJYU9jR2hhamg3cHREdENPSUNiZUZsTzF2cGlsS0JW",
              "REMOVE_ACTION": "Disable",
              "UPDATE_USERS": true,
              "GROUP_MEMBERSHIP_HANDLING": "Overwrite"
          },
          "name": "GitHubEMU connection",
          "managed": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("storeID", jsonData.id);
            console.log("storeID is now: " + bru.getEnvVar("storeID"));
            bru.setEnvVar("targetStoreID", jsonData.id);
            console.log("targetStoreID is now: " + bru.getEnvVar("targetStoreID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (GitHubEMU)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-githubemu.html).
