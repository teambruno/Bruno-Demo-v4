info:
  name: Create Store (Workday)
  type: http
  seq: 13

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "type": "Workday",
          "name": "WorkdayTest",
          "configuration": {
              "username": "basicUserName",
              "password": "{{password}}",
              "tenantId": "tenant_Id",
              "subdomain": "subdomain",
              "host": "example.workday.com",
              "excludeInactiveWorkers": true,
              "excludeContingentWorkers": true,
              "integrationSystemIds": "CustomAttributes-Danny, SailPointCustomAttributes"
          },
          "image": {
              "href": "https://d1oekt4jpdthse.cloudfront.net/branding/market/cb933bfe-8282-405a-a780-0a19b97edc02.png"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("storeID", jsonData.id);
            console.log("storeID is now: " + bru.getEnvVar("storeID"));
            bru.setEnvVar("sourceStoreID", jsonData.id);
            console.log("sourceStoreID is now: " + bru.getEnvVar("sourceStoreID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (Workday)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-workday.html).
