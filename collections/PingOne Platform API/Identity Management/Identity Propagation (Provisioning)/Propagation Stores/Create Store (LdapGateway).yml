info:
  name: Create Store (LdapGateway)
  type: http
  seq: 6

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "configuration": {
              "CREATE_USERS": false,
              "UPDATE_USERS": true,
              "DEPROVISION_USERS": false,
              "DISABLE_USERS": true,
              "ENVIRONMENT_ID": "{{envID}}",
              "GATEWAY_ID": "{{gatewayID}}",
              "LDAP_TYPE": "PingDirectory",
              "REMOVE_ACTION": "Disable"
          },
          "type": "LdapGateway",
          "image": {
              "href": "https://d1oekt4jpdthse.cloudfront.net/branding/market/cb933bfe-8282-405a-a780-0a19b97edc02.png"
          },
          "name": "PingOne Gateway (PingOne)"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("storeID", jsonData.id);
            console.log("storeID is now: " + bru.getEnvVar("storeID"));
            bru.setEnvVar("targetStoreID", jsonData.id);
            console.log("targetStoreID is now: " + bru.getEnvVar("targetStoreID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (LdapGateway)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-ldapgateway.html).
