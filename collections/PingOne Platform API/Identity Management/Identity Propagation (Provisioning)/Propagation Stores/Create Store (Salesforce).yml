info:
  name: Create Store (Salesforce)
  type: http
  seq: 8

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/stores"
  body:
    type: json
    data: |-
      {
          "type": "Salesforce",
          "name": "test",
          "configuration": {
              "FREEZE_USER_FLAG": false,
              "ENABLE_COMMUNITIES": true,
              "PERMISSION_SET_MANAGEMENT": "Merge with permission sets in Salesforce",
              "CREATE_USERS": true,
              "UPDATE_USERS": true,
              "DISABLE_USERS": true,
              "PROVISION_DISABLED_USERS": true,
              "SALESFORCE_DOMAIN": "https://example.com",
              "PROFILE_ID": "fds",
              "ACCOUNT_ID": "fdsf",
              "CLIENT_ID": "fdsfd",
              "CLIENT_SECRET": "fdsafds",
              "OAUTH_ACCESS_TOKEN": "fdsfds",
              "OAUTH_REFRESH_TOKEN": "fdsfdsa"
          },
          "image": {
              "href": "https://d1oekt4jpdthse.cloudfront.net/branding/market/cb933bfe-8282-405a-a780-0a19b97edc02.png"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("storeID", jsonData.id);
            console.log("storeID is now: " + bru.getEnvVar("storeID"));
            bru.setEnvVar("targetStoreID", jsonData.id);
            console.log("targetStoreID is now: " + bru.getEnvVar("targetStoreID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Store (Salesforce)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-stores/create-store-salesforce.html).
