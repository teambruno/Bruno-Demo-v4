info:
  name: Identity Propagation Store Metadata (Aquera)
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/storeMetadata/Aquera"
  body:
    type: json
    data: |-
      {
          "AUTHENTICATION_METHOD": "None",
          "USER_FILTER": "username Eq \"%s\"",
          "UNIQUE_USER_IDENTIFIER": "userName",
          "USERS_RESOURCE": "/Users",
          "SCIM_VERSION": "2.0",
          "SCIM_URL": "https://example.com",
          "AUTHORIZATION_TYPE": "Basic",
          "BASIC_AUTH_USER": "{{basicAuthUsername}}",
          "BASIC_AUTH_PASSWORD": "{{basicAuthPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Identity Propagation Store Metadata (Aquera)](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-store-metadata/identity-propagation-store-metadata-aquera.html).
