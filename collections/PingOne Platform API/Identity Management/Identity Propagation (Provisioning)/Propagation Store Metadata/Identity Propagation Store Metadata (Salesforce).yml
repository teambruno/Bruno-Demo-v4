        "CLIENT_ID": "salesforceClientID",
        "CLIENT_SECRET": "salesforceClientSecret",
        "OAUTH_ACCESS_TOKEN": "token",
        "OAUTH_REFRESH_TOKEN": "token"
      }
  auth: inherit

settings:
