info:
  name: Create Rule Mapping
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/propagation/rules/{{ruleID}}/mappings"
  body:
    type: json
    data: |-
      {
          "sourceAttribute": "accountId",
          "targetAttribute": "userName",
          "attributeMappingType": "userAttributeMapping"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("mappingID", jsonData.id);
            console.log("mappingID is now: " + bru.getEnvVar("mappingID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Rule Mapping](https://developer.pingidentity.com/pingone-api/platform/identity-propagation-provisioning/propagation-mappings/create-rule-mapping.html).
