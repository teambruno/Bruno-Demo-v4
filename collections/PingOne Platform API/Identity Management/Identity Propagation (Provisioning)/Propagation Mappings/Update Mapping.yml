http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/propagation/mappings/{{mappingID}}"
  body:
    type: json
    data: |-
      {
          "rule": {
              "id": "{{ruleID}}"
          },
          "sourceAttribute": "username",
          "targetAttribute": "accountId"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

