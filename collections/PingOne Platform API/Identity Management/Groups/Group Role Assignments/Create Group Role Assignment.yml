info:
  name: Create Group Role Assignment
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/groups/{{groupID}}/roleAssignments"
  body:
    type: json
    data: |-
      {
          "role": {
              "id": "{{roleID}}"
          },
          "scope": {
              "id": "{{envID}}",
              "type": "environment"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("groupID", jsonData.id);
            console.log("groupID is now: " + bru.getEnvVar("groupID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Group Role Assignment](https://developer.pingidentity.com/pingone-api/platform/group-role-assignments/create-group-role-assignment.html).
