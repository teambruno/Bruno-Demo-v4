info:
  name: Create Identity Provider (Amazon)
  type: http
  seq: 7

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/identityProviders"
  params:
    - name: expand
      value: attributes
      type: query
      description: Shows the details for the core attribute mapping created by the request.
      disabled: true
  body:
    type: json
    data: |-
      {
          "description": "Amazon Provider",
          "enabled": true,
          "name": "AmazonIdP",
          "type": "AMAZON",
          "clientId": "AMAZON_ID",
          "clientSecret": "AMAZON_SECRET"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", function() {
            expect(res.getStatus()).to.equal(201);
        });

        test("Response body JSON contains createdAt and id strings", function() {
            const jsonData = res.getBody();
            expect(jsonData.createdAt).to.be.a('string');
            expect(jsonData.id).to.be.a('string');
            bru.setEnvVar("providerID", jsonData.id);
            console.log("providerID is now: " + bru.getEnvVar("providerID"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Identity Provider (Amazon)](https://developer.pingidentity.com/pingone-api/platform/identity-provider-management/identity-providers/create-identity-provider-amazon.html).
