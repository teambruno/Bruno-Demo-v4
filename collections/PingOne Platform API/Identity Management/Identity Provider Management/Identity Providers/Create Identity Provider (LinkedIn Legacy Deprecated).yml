info:
  name: Create Identity Provider (LinkedIn Legacy Deprecated)
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/identityProviders"
  body:
    type: json
    data: |-
      {
          "description": "Custom LinkedIn ID Provider",
          "enabled": true,
          "name": "LinkedInIdP",
          "type": "LINKEDIN",
          "clientId": "LINKEDIN_ID",
          "clientSecret": "LINKEDIN_SECRET"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", function() {
            expect(res.getStatus()).to.equal(201);
        });

        test("Response body JSON contains createdAt and id strings", function() {
            const jsonData = res.getBody();
            expect(jsonData.createdAt).to.be.a('string');
            expect(jsonData.id).to.be.a('string');
            bru.setEnvVar("providerID", jsonData.id);
            console.log("providerID is now: " + bru.getEnvVar("providerID"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Identity Provider (LinkedIn Legacy Deprecated)](https://developer.pingidentity.com/pingone-api/platform/identity-provider-management/identity-providers/create-identity-provider-linkedin.html).
