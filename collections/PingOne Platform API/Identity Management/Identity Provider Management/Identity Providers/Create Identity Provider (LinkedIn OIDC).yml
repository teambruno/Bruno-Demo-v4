info:
  name: Create Identity Provider (LinkedIn OIDC)
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/identityProviders"
  body:
    type: json
    data: |-
      {
          "description": "Custom OIDC LinkedIn Identity Provider",
          "enabled": true,
          "name": "LinkedInIdP_OIDC",
          "type": "LINKEDIN_OIDC",
          "clientId": "LINKEDIN_ID_OIDC",
          "clientSecret": "LINKEDIN_SECRET_OIDC"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", function() {
            expect(res.getStatus()).to.equal(201);
        });

        test("Response body JSON contains createdAt and id strings", function() {
            const jsonData = res.getBody();
            expect(jsonData.createdAt).to.be.a('string');
            expect(jsonData.id).to.be.a('string');
            bru.setEnvVar("providerID", jsonData.id);
            console.log("providerID is now: " + bru.getEnvVar("providerID"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Identity Provider (LinkedIn OIDC)](https://developer.pingidentity.com/pingone-api/platform/identity-provider-management/identity-providers/create-identity-provider-linkedin-oidc.html).
