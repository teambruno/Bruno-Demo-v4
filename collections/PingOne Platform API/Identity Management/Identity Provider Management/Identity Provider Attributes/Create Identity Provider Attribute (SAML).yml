info:
  name: Create Identity Provider Attribute (SAML)
  type: http
  seq: 13

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/identityProviders/{{providerID}}/attributes"
  body:
    type: json
    data: |-
      {
          "name": "externalId",
          "value": "${providerAttributes.externalId}",
          "update": "ALWAYS"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("idpAttrID", jsonData.id);
            console.log("idpAttrID is now: " + bru.getEnvVar("idpAttrID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Identity Provider Attribute (SAML)](https://developer.pingidentity.com/pingone-api/platform/identity-provider-management/identity-provider-attributes/create-identity-provider-attribute-saml.html).
