info:
  name: Update Identity Provider Attribute
  type: http
  seq: 16

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/identityProviders/{{providerID}}/attributes/{{idpAttrID}}"
  body:
    type: json
    data: |-
      {
          "name": "name.given",
          "value": "${providerAttributes.first_name}",
          "update": "EMPTY_ONLY"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

