info:
  name: Create Direct-mapped User
  type: http
  seq: 1

http:
  method: POST
  url: "{{scimPath}}/environments/{{envID}}/v2/DirectMappedUsers"
  body:
    type: json
    data: |-
      {
          "address": {
              "streetAddress": "221 Baker St.",
              "region": "London",
              "countryCode": "UK"
          },
          "email": "directmapped@example.com",
          "name": {
              "formatted": "Rawnald Gregory Erickson II",
              "given": "Rawnald",
              "family": "Erickson",
              "honorificPrefix": "Mr.",
              "honorificSuffix": "II"
          },
          "nickname": "Ronnie",
          "preferredLanguage": "en",
          "primaryPhone": "1234567890",
          "username": "tmp-dm-user-1",
          "population": {
              "id": "{{popID}}"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response body JSON contains username and id strings", function () {
          const jsonData = res.getBody();
          expect(jsonData.username).to.be.a('string');
          bru.setEnvVar("username", jsonData.username);
          console.log("username is now: " + bru.getEnvVar("username"));
          expect(jsonData.id).to.be.a('string');
          bru.setEnvVar("userID", jsonData.id);
          console.log("userID is now: " + bru.getEnvVar("userID"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Direct-mapped User](https://developer.pingidentity.com/pingone-api/platform/scim/direct-mapped-users/create-direct-mapped-user.html).
