info:
  name: Create Password Policy
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/passwordPolicies"
  body:
    type: json
    data: |-
      {
          "name": "PassphraseCustom1",
          "description": "A policy that encourages the use of passphrases",
          "excludesProfileData": true,
          "notSimilarToCurrent": true,
          "excludesCommonlyUsed": true,
          "minComplexity": 7,
          "maxAgeDays": 182,
          "minAgeDays": 1,
          "history": {
              "count": 8,
              "retentionDays": 365
          },
          "lockout": {
              "failureCount": 3,
              "durationSeconds": 900
          },
          "default": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("passwordPolicyID", jsonData.id);
            console.log("passwordPolicyID is now: " + bru.getEnvVar("passwordPolicyID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Password Policy](https://developer.pingidentity.com/pingone-api/platform/password-policies/create-password-policy.html).
