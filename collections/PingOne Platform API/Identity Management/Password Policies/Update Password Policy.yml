info:
  name: Update Password Policy
  type: http
  seq: 4

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/passwordPolicies/{{passwordPolicyID}}"
  body:
    type: json
    data: |-
      {
          "name": "PassphraseCustom1",
          "description": "A policy that encourages the use of passphrases",
          "excludesProfileData": true,
          "notSimilarToCurrent": true,
          "excludesCommonlyUsed": true,
          "minComplexity": 7,
          "maxAgeDays": 182,
          "minAgeDays": 1,
          "history": {
              "count": 6,
              "retentionDays": 365
          },
          "lockout": {
              "failureCount": 4,
              "durationSeconds": 900
          },
          "default": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Password Policy](https://developer.pingidentity.com/pingone-api/platform/password-policies/update-password-policy.html).
