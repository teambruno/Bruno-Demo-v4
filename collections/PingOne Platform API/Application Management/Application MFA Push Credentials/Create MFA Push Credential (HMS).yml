info:
  name: Create MFA Push Credential (HMS)
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications/{{appID}}/pushCredentials"
  body:
    type: json
    data: |-
      {
          "type": "HMS",
          "clientId": "18990***63257248",
          "clientSecret": "B15B497V44E080EBE2C4DE4E74230***98549516B2M1A5C8F0FCD2C579A8EB14"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("pushCredID", jsonData.id);
            console.log("pushCredID is now: " + bru.getEnvVar("pushCredID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create MFA Push Credential (HMS)](https://developer.pingidentity.com/pingone-api/platform/applications/application-mfa-push-credentials/create_mfa_push_credentials_hms.html).
