info:
  name: Create MFA Push Credential (APNS)
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications/{{appID}}/pushCredentials"
  body:
    type: json
    data: |-
      {
          "type": "APNS",
          "key": "key.value",
          "teamId": "team.id",
          "token": "-----BEGIN PRIVATE KEY-----\nMIGTAgEA****7HUikGZU\n-----END PRIVATE KEY-----"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("pushCredID", jsonData.id);
            console.log("pushCredID is now: " + bru.getEnvVar("pushCredID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create MFA Push Credential (APNS)](https://developer.pingidentity.com/pingone-api/platform/applications/application-mfa-push-credentials/create-mfa-push-credential-apns.html).
