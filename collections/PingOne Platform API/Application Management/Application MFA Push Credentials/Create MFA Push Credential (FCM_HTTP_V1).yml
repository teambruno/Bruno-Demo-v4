info:
  name: Create MFA Push Credential (FCM_HTTP_V1)
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications/{{appID}}/pushCredentials"
  body:
    type: json
    data: |-
      {
          "type": "FCM_HTTP_V1",
          "googleServiceAccountCredentials": "{{googleCredentialsJsonContent}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("pushCredID", jsonData.id);
            console.log("pushCredID is now: " + bru.getEnvVar("pushCredID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create MFA Push Credential (FCM_HTTP_V1)](https://developer.pingidentity.com/pingone-api/platform/applications/application-mfa-push-credentials/create-mfa-push-credential-fcm.html).
