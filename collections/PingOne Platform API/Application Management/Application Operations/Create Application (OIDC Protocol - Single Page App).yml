info:
  name: Create Application (OIDC Protocol - Single Page App)
  type: http
  seq: 3

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications"
  params:
    - name: expand
      value: attributes
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
          "enabled": true,
          "name": "OIDC-SPA-App",
          "description": "Test Description - OIDC App (Single Page App)",
          "type": "SINGLE_PAGE_APP",
          "protocol": "OPENID_CONNECT",
          "homePageUrl": "https://example.com/homePage",
          "loginPageUrl": "https://example.com/loginPage",
          "icon": {
              "id": "{{imageID}}",
              "href": "https://upload.image.org/image.jpg"
          },
          "grantTypes": [
              "AUTHORIZATION_CODE"
          ],
          "postLogoutRedirectUris": [
              "https://example.com/logout"
          ],
          "redirectUris": [
              "https://example.com"
          ],
          "responseTypes": [
              "CODE"
          ],
          "tokenEndpointAuthMethod": "NONE",
          "pkceEnforcement": "S256_REQUIRED",
          "refreshTokenDuration": 86400,
          "refreshTokenRollingDuration": 86400
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("appID", jsonData.id);
            console.log("appID is now: " + bru.getEnvVar("appID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Application (OIDC Protocol - Single Page App)](https://developer.pingidentity.com/pingone-api/platform/applications/applications-1/create-application-oidc-protocol---single-page-app.html).
