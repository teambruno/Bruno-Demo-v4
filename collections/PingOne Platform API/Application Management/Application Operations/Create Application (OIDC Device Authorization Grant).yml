info:
  name: Create Application (OIDC Device Authorization Grant)
  type: http
  seq: 8

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications"
  body:
    type: json
    data: |-
      {
          "enabled": true,
          "name": "Device-App{{$timestamp}}",
          "description": "App for Device Authorization Grant",
          "type": "CUSTOM_APP",
          "protocol": "OPENID_CONNECT",
          "grantTypes": [
              "DEVICE_CODE",
              "REFRESH_TOKEN"
          ],
          "deviceTimeout": 600,
          "devicePollingInterval": 5,
          "tokenEndpointAuthMethod": "NONE",
          "devicePathId": "go"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("deviceAppID", jsonData.id);
            console.log("deviceAppID is now: " + bru.getEnvVar("deviceAppID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Application (OIDC Device Authorization Grant)](https://developer.pingidentity.com/pingone-api/platform/applications/applications-1/create-application-oidc-device-authorization-grant.html).
