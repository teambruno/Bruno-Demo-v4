info:
  name: Create Application (OIDC Protocol - Service App)
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications"
  params:
    - name: expand
      value: attributes
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
          "enabled": true,
          "name": "OIDC-Service-App_{{$timestamp}}",
          "description": "Test Description - CREATE OIDC App (Service) request",
          "type": "SERVICE",
          "protocol": "OPENID_CONNECT",
          "grantTypes": [
              "CLIENT_CREDENTIALS"
          ],
          "tokenEndpointAuthMethod": "CLIENT_SECRET_POST"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("appID", jsonData.id);
            console.log("appID is now: " + bru.getEnvVar("appID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Application (OIDC Protocol - Service App)](https://developer.pingidentity.com/pingone-api/platform/applications/applications-1/create-application-oidc-protocol---service-app.html).
