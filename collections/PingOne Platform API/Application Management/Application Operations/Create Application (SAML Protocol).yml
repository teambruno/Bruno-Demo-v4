info:
  name: Create Application (SAML Protocol)
  type: http
  seq: 10

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications"
  body:
    type: json
    data: |-
      {
          "name": "app_{{$timestamp}}",
          "description": "this is my application",
          "enabled": true,
          "loginPageUrl": "https://example.com",
          "type": "WEB_APP",
          "protocol": "SAML",
          "icon": {
              "id": "{{iconID}}",
              "href": "https://upload.wikimedia.org/wikipedia/commons/a/a8/Baby_Jake.jpg"
          },
          "assertionDuration": 60,
          "acsUrls": [
              "https://example.com"
          ],
          "sloResponseEndpoint": "https://example.com",
          "spEntityId": "test",
          "nameIdFormat": "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("appID", jsonData.id);
            console.log("appID is now: " + bru.getEnvVar("appID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Application (SAML Protocol)](https://developer.pingidentity.com/pingone-api/platform/applications/applications-1/create-application-saml-protocol.html).
