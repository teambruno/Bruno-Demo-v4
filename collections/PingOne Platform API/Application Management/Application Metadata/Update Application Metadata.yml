info:
  name: Update Application Metadata
  type: http
  seq: 2

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/applications/{{appID}}/metadata"
  body:
    type: json
    data: |-
      {
        "metadata": {
          "Contact": "Kelly Johnson",
          "Department": "Accounting",
          "Meeting": "Last Thursday of the month"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Application Metadata](https://developer.pingidentity.com/pingone-api/platform/applications/application-metadata/update-application-metadata.html).
