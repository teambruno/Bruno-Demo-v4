info:
  name: Create Application Attribute Mapping
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications/{{appID}}/attributes"
  body:
    type: json
    data: |-
      {
          "name": "email",
          "value": "${user.email}",
          "required": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("samlAttrID", jsonData.id);
            console.log("samlAttrID is now: " + bru.getEnvVar("samlAttrID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Application Attribute Mapping](https://developer.pingidentity.com/pingone-api/platform/applications/application-attribute-mapping/create-application-attribute-mapping.html).
