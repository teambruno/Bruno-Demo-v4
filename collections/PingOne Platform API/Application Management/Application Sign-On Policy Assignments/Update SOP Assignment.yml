http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/applications/{{appID}}/signOnPolicyAssignments/{{SOPAssignmentID}}"
  body:
    type: json
    data: |-
      {
          "priority": 2,
          "signOnPolicy": {
              "id": "{{policyID}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

