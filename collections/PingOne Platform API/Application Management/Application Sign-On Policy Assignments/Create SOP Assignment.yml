info:
  name: Create SOP Assignment
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications/{{appID}}/signOnPolicyAssignments"
  body:
    type: json
    data: |-
      {
          "priority": 1,
          "signOnPolicy": {
              "id": "{{policyID}}"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("SOPAssignmentID", jsonData.id);
            console.log("SOPAssignmentID is now: " + bru.getEnvVar("SOPAssignmentID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create SOP Assignment](https://developer.pingidentity.com/pingone-api/platform/applications/application-sign-on-policy-assignments/create-sop-assignment.html).
