info:
  name: Create an Application Flow Policy Assignment
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/applications/{{appID}}/flowPolicyAssignments"
  body:
    type: json
    data: |-
      {
          "priority": 1,
          "flowPolicy": {
              "id": "{{flowPolicyID}}"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("flowPolicyAssignmentID", jsonData.id);
            console.log("flowPolicyAssignmentID is now: " + bru.getEnvVar("flowPolicyAssignmentID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create an Application Flow Policy Assignment](https://developer.pingidentity.com/pingone-api/platform/applications/application-flow-policy-assignments/create-flow-policy-assignment.html).
