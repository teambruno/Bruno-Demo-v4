info:
  name: Create Resource Attribute
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/resources/{{resourceID}}/attributes"
  body:
    type: json
    data: |-
      {
          "name": "firstName",
          "value": "${user.name.given}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("resourceAttrID", jsonData.id);
            console.log("resourceAttrID is now: " + bru.getEnvVar("resourceAttrID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Resource Attribute](https://developer.pingidentity.com/pingone-api/platform/resources/resource-attributes/create-resource-attribute.html).
