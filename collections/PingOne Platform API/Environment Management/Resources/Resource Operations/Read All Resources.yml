info:
  name: Read All Resources
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiPath}}/environments/{{envID}}/resources"
  params:
    - name: filter
      value: ""
      type: query
      disabled: true
    - name: limit
      value: ""
      type: query
      disabled: true
    - name: expand
      value: ""
      type: query
      disabled: true
    - name: order
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        const jsonData = res.getBody();
        const resList = jsonData._embedded.resources;

        test("Response body JSON's _embedded:resources is an array of objs w/ IDs", function () {
          expect(resList).to.be.an('array');
          if (resList.length > 0) {
            console.log("Found " + resList.length + " resource(s)")
            resList.forEach((elem) => {
              expect(elem.id).to.be.a('string');
            });
            bru.setEnvVar("resID", resList[0].id);
            console.log("resID is now: " + bru.getEnvVar("resID"));
          } else {
            console.log("No resources!");
          }
        });

        test("Response body JSON's _embedded:resources has the default resources for each env", function () {
          if (resList && resList.length > 1) {
            const oidcFilter = resList.filter(e => e.name === 'openid');
            expect(oidcFilter).to.be.an('array').and.have.lengthOf(1);
            bru.setEnvVar("openidResourceID", oidcFilter[0].id);
            console.log("openidResourceID is now: " + bru.getEnvVar("openidResourceID"));

            const platFilter = resList.filter(e => e.name.toLowerCase().includes('pingone'));
            expect(platFilter).to.be.an('array').and.have.lengthOf(1);
            bru.setEnvVar("p1ResID", platFilter[0].id);
            console.log("p1ResID is now: " + bru.getEnvVar("p1ResID"));
          } else {
            console.log("Problem finding default resources");
            expect.fail();
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Read All Resources](https://developer.pingidentity.com/pingone-api/platform/resources/resources-1/read-all-resources.html).
