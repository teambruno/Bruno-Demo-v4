info:
  name: Create Resource
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/resources"
  body:
    type: json
    data: |-
      {
          "name": "CustomResource{{$timestamp}}",
          "description": "This is my custom resource",
          "audience": "https://api.customresource{{$timestamp}}.com",
          "accessTokenValiditySeconds": 7200,
          "applicationPermissionsSettings": {
              "claimEnabled": true
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("resourceID", jsonData.id);
            console.log("resourceID is now: " + bru.getEnvVar("resourceID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Resource](https://developer.pingidentity.com/pingone-api/platform/resources/resources-1/create-resource.html).
