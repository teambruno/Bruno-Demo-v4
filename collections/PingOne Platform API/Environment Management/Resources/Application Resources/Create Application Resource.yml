info:
  name: Create Application Resource
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/resources/{{resourceID}}/applicationResources"
  body:
    type: json
    data: |-
      {
          "name": "accounts"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("appResourceID", jsonData.id);
            console.log("appResourceID is now: " + bru.getEnvVar("appResourceID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Application Resource](https://developer.pingidentity.com/pingone-api/platform/resources/application-resources/create-application-resource.html).
