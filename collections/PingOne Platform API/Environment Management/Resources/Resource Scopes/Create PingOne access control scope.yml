info:
  name: Create PingOne access control scope
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/resources/{{resourceID}}/scopes"
  body:
    type: json
    data: |-
      {
          "name": "p1:update:user:email-only",
          "description": "Access control scope to limit update to email only",
          "schemaAttributes": [
              "name.family",
              "name.given"
          ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("scopeID", jsonData.id);
            console.log("scopeID is now: " + bru.getEnvVar("scopeID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create PingOne access control scope](https://developer.pingidentity.com/pingone-api/platform/resources/resource-scopes/create-pingone-access-control-scope.html).
