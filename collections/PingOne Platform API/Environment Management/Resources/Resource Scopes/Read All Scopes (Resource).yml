info:
  name: Read All Scopes (Resource)
  type: http
  seq: 4

http:
  method: GET
  url: "{{apiPath}}/environments/{{envID}}/resources/{{resourceID}}/scopes"
  params:
    - name: expand
      value: scopes
      type: query
      description: Lists all scopes for all resources and shows the scope sub-resource data in the _embedded section of the response.
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
         
        test("Response body JSON's _embedded:scopes is an array of objs w/ IDs", function () {
          const jsonData = res.getBody();
          const scopeList = jsonData._embedded.scopes;
          expect(scopeList).to.be.an('array');
          if (scopeList.length > 0) {
            const readUserScopeFilter = scopeList.filter(e => e.name === 'p1:read:user');
            expect(readUserScopeFilter).to.be.an('array').and.have.lengthOf(1);
            bru.setEnvVar("readUserScopeID", readUserScopeFilter[0].id);
            console.log("readUserScopeID is now: " + bru.getEnvVar("readUserScopeID"));
          } else {
            console.log("No Scopes!");
            expect.fail();
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Read All Scopes (Resource)](https://developer.pingidentity.com/pingone-api/platform/resources/resource-scopes/read-all-scopes-resource.html).
