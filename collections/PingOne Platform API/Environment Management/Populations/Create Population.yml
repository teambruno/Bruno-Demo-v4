info:
  name: Create Population
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/populations"
  body:
    type: json
    data: |-
      {
        "name" : "NA Eng Austin",
        "description" : "NA Engineering",
        "default" : false,
        "passwordPolicy": {
             "id": "{{passwordPolicyID}}"
         },
         "theme": {
          "id": "{{themeID}}"
         },
         "alternativeIdentifiers": [
          "Bob's crew",
          "Austin"
         ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("popID", jsonData.id);
            console.log("popID is now: " + bru.getEnvVar("popID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Population](https://developer.pingidentity.com/pingone-api/platform/populations/create-population.html).
