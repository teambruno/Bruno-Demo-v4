info:
  name: Update Population
  type: http
  seq: 5

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/populations/{{popID}}"
  body:
    type: json
    data: |-
      {
        "name" : "Accounting",
        "description" : "Accounting group",
        "default": false,
        "passwordPolicy": {
             "id": "{{passwordPolicyID}}"
         }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

