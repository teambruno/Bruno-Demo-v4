info:
  name: Create Sign-On Policy Action (IDENTITY_PROVIDER)
  type: http
  seq: 6

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/signOnPolicies/{{policyID}}/actions"
  body:
    type: json
    data: |-
      {
          "type": "IDENTITY_PROVIDER",
          "identityProvider": {
              "id": "{{idpID}}"
          },
          "condition": {
              "greater": 600,
              "secondsSince": "${session.lastSignOn.withAuthenticator.pwd.at}"
          },
          "priority": 10,
          "passUserContext": true,
          "registration": {
              "enabled": true,
              "confirmIdentityProviderAttributes": true,
              "population": {
                  "id": "{{popID}}"
              }
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("actionID", jsonData.id);
            console.log("actionID is now: " + bru.getEnvVar("actionID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Sign-On Policy Action (IDENTITY_PROVIDER)](https://developer.pingidentity.com/pingone-api/platform/sign-on-policies/sign-on-policy-actions/create-sign-on-policy-action-identity_provider.html).
