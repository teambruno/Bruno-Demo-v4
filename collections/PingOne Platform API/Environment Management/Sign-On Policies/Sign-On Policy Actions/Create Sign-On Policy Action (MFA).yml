info:
  name: Create Sign-On Policy Action (MFA)
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/signOnPolicies/{{policyID}}/actions"
  body:
    type: json
    data: |-
      {
          "priority": 30,
          "type": "MULTI_FACTOR_AUTHENTICATION",
          "condition": {
              "anonymousNetwork": [
                  "1.1.1.1/10"
              ],
              "valid": "${flow.request.http.remoteIp}"
          },
          "recovery": {
              "enabled": false
          },
          "deviceAuthenticationPolicy": {
              "id": "{{mfaPolicyID}}"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("actionID", jsonData.id);
            console.log("actionID is now: " + bru.getEnvVar("actionID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Sign-On Policy Action (MFA)](https://developer.pingidentity.com/pingone-api/platform/sign-on-policies/sign-on-policy-actions/create-sign-on-policy-action-mfa.html).
