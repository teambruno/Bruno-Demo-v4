info:
  name: Create Sign-On Policy Action (AGREEMENT)
  type: http
  seq: 5

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/signOnPolicies/{{policyID}}/actions"
  body:
    type: json
    data: |-
      {
          "priority": 50,
          "agreement": {
              "id": "{{agreementID}}"
          },
          "type": "AGREEMENT"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("actionID", jsonData.id);
            console.log("actionID is now: " + bru.getEnvVar("actionID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Sign-On Policy Action (AGREEMENT)](https://developer.pingidentity.com/pingone-api/platform/sign-on-policies/sign-on-policy-actions/create-sign-on-policy-action-agreement.html).
