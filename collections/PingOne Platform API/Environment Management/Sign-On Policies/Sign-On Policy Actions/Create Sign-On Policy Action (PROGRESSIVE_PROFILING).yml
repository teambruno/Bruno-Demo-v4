info:
  name: Create Sign-On Policy Action (PROGRESSIVE_PROFILING)
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/signOnPolicies/{{policyID}}/actions"
  body:
    type: json
    data: |-
      {
          "priority": 40,
          "type": "PROGRESSIVE_PROFILING",
          "condition": {
              "or": [
                  {
                      "value": "${user.population.id}",
                      "equals": "{{popID}}"
                  },
                  {
                      "value": "${user.type}",
                      "equals": "Customer"
                  }
              ]
          },
          "promptText": "For the best experience, we need a couple things from you.",
          "promptIntervalSeconds": 3600,
          "preventMultiplePromptsPerFlow": false,
          "attributes": [
              {
                  "name": "address.postalCode",
                  "required": false
              }
          ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("actionID", jsonData.id);
            console.log("actionID is now: " + bru.getEnvVar("actionID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Sign-On Policy Action (PROGRESSIVE_PROFILING)](https://developer.pingidentity.com/pingone-api/platform/sign-on-policies/sign-on-policy-actions/create-sign-on-policy-action-progressive_profiling.html).
