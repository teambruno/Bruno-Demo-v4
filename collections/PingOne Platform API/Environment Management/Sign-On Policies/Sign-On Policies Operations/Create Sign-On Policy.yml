info:
  name: Create Sign-On Policy
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/signOnPolicies"
  body:
    type: json
    data: |-
      {
          "name": "Simple_Login",
          "default": "false",
          "description": "A new basic sign-on policy."
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("policyID", jsonData.id);
            console.log("policyID is now: " + bru.getEnvVar("policyID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Sign-On Policy](https://developer.pingidentity.com/pingone-api/platform/sign-on-policies/sign-on-policies-1/create-sign-on-policy.html).
