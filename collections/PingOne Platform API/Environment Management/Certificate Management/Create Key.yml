info:
  name: Create Key
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/keys"
  body:
    type: json
    data: |-
      {
        "name": "Doc test cert",
        "serialNumber": 1575483893597,
        "subjectDN": "CN=Doc test cert, OU=Ping Identity, O=Ping Identity, L=, ST=, C=US",
        "algorithm": "RSA",
        "keyLength": 2048,
        "validityPeriod": 365,
        "signatureAlgorithm": "SHA256withRSA",
        "usageType": "SIGNING",
        "status": "VALID",
        "default": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("keyID", jsonData.id);
            console.log("keyID is now: " + bru.getEnvVar("keyID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Key](https://developer.pingidentity.com/pingone-api/platform/certificate-management/create-key.html).
