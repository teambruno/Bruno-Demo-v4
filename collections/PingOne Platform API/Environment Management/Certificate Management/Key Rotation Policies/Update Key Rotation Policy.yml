info:
  name: Update Key Rotation Policy
  type: http
  seq: 4

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/keyRotationPolicies/{{krpID}}"
  body:
    type: json
    data: |-
      {
          "name": "Test Key Rotation Policy update",
          "dn": "CN=Test Key Rotation Policy, OU=Ping Identity, O=Ping Identity, L=, ST=, C=US",
          "algorithm": "RSA",
          "keyLength": 2048,
          "validityPeriod": 365,
          "signatureAlgorithm": "SHA256withRSA",
          "usageType": "SIGNING",
          "rotationPeriod": 120
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Key Rotation Policy](https://developer.pingidentity.com/pingone-api/platform/certificate-management/key-rotation-policies/update-key-rotation-policy.html).
