info:
  name: Create Key Rotation Policy
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/keyRotationPolicies"
  body:
    type: json
    data: |-
      {
          "name": "Test Key Rotation Policy",
          "dn": "CN=Test Key Rotation Policy, OU=Ping Identity, O=Ping Identity, L=, ST=, C=US",
          "algorithm": "RSA",
          "keyLength": 2048,
          "validityPeriod": 365,
          "signatureAlgorithm": "SHA256withRSA",
          "usageType": "SIGNING",
          "rotationPeriod": 120
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("krpID", jsonData.id);
            console.log("krpID is now: " + bru.getEnvVar("krpID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Key Rotation Policy](https://developer.pingidentity.com/pingone-api/platform/certificate-management/key-rotation-policies/create-key-rotation-policy.html).
