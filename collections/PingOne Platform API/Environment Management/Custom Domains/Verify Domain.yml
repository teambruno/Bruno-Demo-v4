info:
  name: Verify Domain
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/customDomains/{{customDomainID}}"
  headers:
    - name: Content-Type
      value: application/vnd.pingidentity.domainName.verify+json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

