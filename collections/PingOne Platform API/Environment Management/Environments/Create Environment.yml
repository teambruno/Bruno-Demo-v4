info:
  name: Create Environment
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiPath}}/environments"
  body:
    type: json
    data: |-
      {
        "name": "New-Env_{{$timestamp}}",
        "description": "New environment description",
        "type": "SANDBOX",
        "region": "NA",
        "icon": "https://example.com/icons/environment.jpg",
        "billOfMaterials": {
          "products": [
            {
              "type": "PING_ONE_BASE",
              "description": "New environment product description",
              "console": {
                "href": "https://example.com"
              }
            }
          ]
        },
        "license": {
          "id": "{{licenseID}}"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("envID", jsonData.id);
            console.log("envID is now: " + bru.getEnvVar("envID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Environment](https://developer.pingidentity.com/pingone-api/platform/environments/create-environment.html).
