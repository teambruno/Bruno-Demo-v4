info:
  name: Create Notification Policy / user - claimed, unclaimed (instead of total)
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/notificationsPolicies"
  body:
    type: json
    data: |-
      {
        "name": "Per-User - used/not used - Notification Policy",
        "quotas": [
          {
            "type": "USER",
            "deliveryMethods": [
              "SMS",
              "Voice"
            ],
            "claimed": 50,
            "unclaimed": 50
          }
        ],
        "default": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("notificationPolicyID", jsonData.id);
            console.log("notificationPolicyID is now: " + bru.getEnvVar("notificationPolicyID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Notification Policy / user - claimed, unclaimed (instead of total)](https://developer.pingidentity.com/pingone-api/platform/notifications/notification-policies/create_user_notification_policy_used_unused.html).
