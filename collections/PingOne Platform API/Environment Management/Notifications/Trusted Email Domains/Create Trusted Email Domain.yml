info:
  name: Create Trusted Email Domain
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/emailDomains"
  body:
    type: json
    data: |-
      {
          "domainName": "example.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("emailDomainID", jsonData.id);
            console.log("emailDomainID is now: " + bru.getEnvVar("emailDomainID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Trusted Email Domain](https://developer.pingidentity.com/pingone-api/platform/notifications/trusted-email-domains/create-trusted-email-domain.html).
