info:
  name: Update Notifications Settings
  type: http
  seq: 2

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/notificationsSettings"
  body:
    type: json
    data: |-
      {
          "whitelist": [
              {
                  "user": {
                      "id": "{{userID}}"
                  }
              }
          ],
          "smsProvidersFallbackChain": [
              "TwilioPhoneDeliverySettingsId",
              "PINGONE_TWILIO"
          ],
          "deliveryMode": "WHITELIST",
          "from": {
              "name": "noreply",
              "address": "noreply@domain.com"
          },
          "replyTo": {
              "name": "noreply",
              "address": "noreply@domain.com"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Notifications Settings](https://developer.pingidentity.com/pingone-api/platform/notifications/notifications-settings/update-notifications-settings.html).
