http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/templates/{{templateName}}/contents/{{contentID}}"
  body:
    type: json
    data: |-
      {
          "locale": "en-gb",
          "title": "Push Message",
          "body": "${user.username}, you have a new authentication request.",
          "deliveryMethod": "Push"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

