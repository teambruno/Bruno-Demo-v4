info:
  name: Update Email Content
  type: http
  seq: 12

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/templates/{{templateName}}/contents/{{contentID}}"
  body:
    type: json
    data: |-
      {
          "locale": "en",
          "variant": "variant_C",
          "template": {
              "id": "transaction"
          },
          "subject": "PingOne: transaction approval",
          "body": "Approve this transfer of ${sum} ${currency} to ${user.username}, by entering this OTP: ${otp}",
          "deliveryMethod": "Email",
          "default": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Email Content](https://developer.pingidentity.com/pingone-api/platform/notifications/notifications-templates/update-email-content.html).
