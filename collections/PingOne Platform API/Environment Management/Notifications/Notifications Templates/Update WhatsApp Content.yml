info:
  name: Update WhatsApp Content
  type: http
  seq: 11

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/templates/{{templateName}}/contents/{{contentID}}"
  body:
    type: json
    data: |-
      {
          "deliveryMethod": "WhatsApp",
          "locale": "fr-FR",
          "whatsAppTemplate": {
              "id": "2223282941382315",
              "name": "device_pairing____15",
              "category": "AUTHENTICATION",
              "language": "fr"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("contentID", jsonData.id);
            console.log("contentID is now: " + bru.getEnvVar("contentID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update WhatsApp Content](https://developer.pingidentity.com/pingone-api/platform/notifications/notifications-templates/update_whatsapp_content.html).
