info:
  name: Create Trusted Email Address
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/emailDomains/{{emailDomainID}}/trustedEmails"
  body:
    type: json
    data: |-
      {
          "emailAddress": "noreply1@auth.shopco.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("trustedEmailId", jsonData.id);
            console.log("trustedEmailId is now: " + bru.getEnvVar("trustedEmailId"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Trusted Email Address](https://developer.pingidentity.com/pingone-api/platform/notifications/trusted-email-addresses/create-trusted-email-address.html).
