info:
  name: Create Phone Delivery Settings (Syniverse channels)
  type: http
  seq: 7

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/notificationsSettings/phoneDeliverySettings"
  body:
    type: json
    data: |-
      {
        "name": "Syniverse Channels notification sender",
        "authToken": "{{syniverseAuthToken}}",
        "provider": "CUSTOM_SYNIVERSE_CHANNELS"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("phoneDeliverySettingsId", jsonData.id);
            console.log("phoneDeliverySettingsId is now: " + bru.getEnvVar("phoneDeliverySettingsId"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Phone Delivery Settings (Syniverse channels)](https://developer.pingidentity.com/pingone-api/platform/notifications/phone-delivery-settings/create-phone-delivery-settings-syniverse-channels.html).
