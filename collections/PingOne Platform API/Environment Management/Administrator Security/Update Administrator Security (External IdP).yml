info:
  name: Update Administrator Security (External IdP)
  type: http
  seq: 3

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/adminConfig"
  body:
    type: json
    data: |-
      {
          "authenticationMethod": "EXTERNAL",
          "recovery": true,
          "mfaStatus": "ENFORCE",
          "provider": {
              "id": "{{providerID}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

