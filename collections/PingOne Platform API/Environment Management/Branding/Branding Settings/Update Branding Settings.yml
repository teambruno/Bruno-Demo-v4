info:
  name: Update Branding Settings
  type: http
  seq: 2

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/brandingSettings"
  body:
    type: json
    data: |-
      {
          "companyName": "Ping",
          "logo": {
              "href": "{{imageUrl}}",
              "id": "{{imageID}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Branding Settings](https://developer.pingidentity.com/pingone-api/platform/branding/branding-settings/update-branding-settings.html).
