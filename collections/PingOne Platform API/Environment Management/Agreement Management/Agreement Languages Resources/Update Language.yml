info:
  name: Update Language
  type: http
  seq: 4

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/agreements/{{agreementID}}/languages/{{languageID}}"
  body:
    type: json
    data: |-
      {
        "locale": "en",
        "displayName": "Language_{{$timestamp}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

