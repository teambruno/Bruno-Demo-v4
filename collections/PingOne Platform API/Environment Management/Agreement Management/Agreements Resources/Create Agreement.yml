info:
  name: Create Agreement
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/agreements"
  body:
    type: json
    data: |-
      {
        "name": "Agreement_2",
        "description": "Terms of service agreement",
        "reconsentPeriodDays": 180,
        "enabled": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response body JSON contains name and id strings", function () {
          const jsonData = res.getBody();
          expect(jsonData.name).to.be.a('string');
          expect(jsonData.id).to.be.a('string');
          bru.setEnvVar("agreementID", jsonData.id);
          console.log("agreementID is now: " + bru.getEnvVar("agreementID"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Agreement](https://developer.pingidentity.com/pingone-api/platform/agreement-management/agreements-resources/create-agreement.html).
