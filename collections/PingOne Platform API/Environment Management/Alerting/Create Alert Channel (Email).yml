info:
  name: Create Alert Channel (Email)
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/alertChannels"
  body:
    type: json
    data: |-
      {
          "channelType":"EMAIL",
          "alertName":"Cert Expired Alert",
          "includeSeverities":["ERROR"],
          "includeAlertTypes":["CERTIFICATE_EXPIRED"],
          "excludeAlertTypes":[],
          "addresses":["tom@example.com"]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("alertChannelID", jsonData.id);
            console.log("alertChannelID is now: " + bru.getEnvVar("alertChannelID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Alert Channel (Email)](https://developer.pingidentity.com/pingone-api/platform/alerting/create-alert-channel-email.html).
