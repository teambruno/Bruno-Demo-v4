    data: |-
      {
          "channelType":"EMAIL",
          "alertName":"Cert Expired Alert",
          "includeSeverities":["WARNING"],
          "includeAlertTypes":["CERTIFICATE_EXPIRED"],
          "excludeAlertTypes":[],
          "addresses":["tom@example.com"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

