info:
  name: Create Gateway Role Assignments
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/gateways/{{gatewayID}}/roleAssignments"
  body:
    type: json
    data: |-
      {
          "role": {
              "id": "{{roleID}}"
          },
          "scope": {
              "id": "{{envID}}",
              "type": "ENVIRONMENT"
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("gatewayRoleAssignmentsID", jsonData.id);
            console.log("gatewayRoleAssignmentsID is now: " + bru.getEnvVar("gatewayRoleAssignmentsID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Gateway Role Assignments](https://developer.pingidentity.com/pingone-api/platform/gateway-management/gateway-role-assignments/create-gateway-role-assignments.html).
