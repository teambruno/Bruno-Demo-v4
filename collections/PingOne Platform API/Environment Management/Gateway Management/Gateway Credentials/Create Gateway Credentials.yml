info:
  name: Create Gateway Credentials
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/gateways/{{gatewayID}}/credentials"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("gatewayCredID", jsonData.id);
            console.log("gatewayCredID is now: " + bru.getEnvVar("gatewayCredID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Gateway Credentials](https://developer.pingidentity.com/pingone-api/platform/gateway-management/gateway-credentials/create-gateway-credentials.html).
