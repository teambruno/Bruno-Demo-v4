info:
  name: Create RADIUS Gateway
  type: http
  seq: 4

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/gateways"
  body:
    type: json
    data: |-
      {
          "name": "New RADIUS Gateway",
          "description": "Gateway using updated settings",
          "type": "RADIUS",
          "enabled": true,
          "radiusClients": [
              {
                  "ip": "127.0.0.1",
                  "sharedSecret": null,
                  "blastRadiusMitigation": {
                      "requireMsgAuth" : "true"
                  }
              }
          ],
          "defaultSharedSecret": "secret",
          "davinci": {
              "policy": {
                  "id": "567a3443878d406e3fb22f5307059e0b"
              }
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("gatewayID", jsonData.id);
            console.log("gatewayID is now: " + bru.getEnvVar("gatewayID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create RADIUS Gateway](https://developer.pingidentity.com/pingone-api/platform/gateway-management/gateways/create-radius-gateway.html).
