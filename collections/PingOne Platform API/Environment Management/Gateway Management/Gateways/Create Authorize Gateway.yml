info:
  name: Create Authorize Gateway
  type: http
  seq: 6

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/gateways"
  body:
    type: json
    data: |-
      {
        "name": "My new Authorize Gateway",
        "type": "AUTHORIZE",
        "authorizationVersion": {
          "id": "{{authorizationVersionId}}"
        },
        "description": "A new authorize gateway",
        "enabled": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("gatewayID", jsonData.id);
            console.log("gatewayID is now: " + bru.getEnvVar("gatewayID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Authorize Gateway](https://developer.pingidentity.com/pingone-api/platform/gateway-management/gateways/create-authorize-gateway.html).
