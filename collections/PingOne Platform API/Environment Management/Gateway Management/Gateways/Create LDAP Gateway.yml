info:
  name: Create LDAP Gateway
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/gateways"
  body:
    type: json
    data: |-
      {
          "name": "LDAP-Gateway-NewTest",
          "description": "My gateway",
          "type": "LDAP",
          "enabled": true,
          "vendor": "PingDirectory",
          "serversHostAndPort": [
              "host1:389",
              "host.domain.com:389",
              "10.10.10.10:333",
              "2001:0db8:85a3:0000:0000:8a2e:0370:7334:389"
          ],
          "bindDN": "cn=svc-account",
          "bindPassword": "{{bindPassword}}",
          "searchBaseDN": "o=example",
          "userCorrelationFilterPattern": "(|(uid=$username$)(mail=$username$))",
          "userTypes": [
              {
                  "id": "{{userTypeID}}",
                  "name": "myType",
                  "passwordAuthority": "LDAP",
                  "searchBaseDn": "dc=example,dc=com",
                  "orderedCorrelationAttributes": [
                      "externalid",
                      "uid",
                      "username"
                  ],
                  "allowPasswordChanges": false,
                  "updateUserOnSuccessfulAuthentication": false,
                  "newUserLookup": {
                      "ldapFilterPattern": "(|(uid=${identifier})(mail=${identifier}))",
                      "population": {
                          "id": "{{popID}}"
                      },
                      "attributeMappings": [
                          {
                              "name": "username",
                              "value": "${ldapAttributes.uid}"
                          }
                      ]
                  }
              }
          ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("gatewayID", jsonData.id);
            console.log("gatewayID is now: " + bru.getEnvVar("gatewayID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create LDAP Gateway](https://developer.pingidentity.com/pingone-api/platform/gateway-management/gateways/create-ldap-gateway.html).
