info:
  name: Create API Gateway Integration
  type: http
  seq: 5

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/gateways"
  body:
    type: json
    data: |-
      {
        "name": "API-Gateway-Test",
        "description": "My API gateway",
        "type": "API_GATEWAY_INTEGRATION",
        "enabled": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("gatewayID", jsonData.id);
            console.log("gatewayID is now: " + bru.getEnvVar("gatewayID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create API Gateway Integration](https://developer.pingidentity.com/pingone-api/platform/gateway-management/gateways/create-api-gateway-integration.html).
