      value: forms
      type: query
      description: Specifies the interface module key value. See documentation for usage.
    - name: block
      value: customMessages
      type: query
      description: Specifies a key for a logical group of strings, such as a form or a tab.
  body:
    type: json
    data: |
      [     
            "forms.fields.customkey1",
            "forms.fields.customkey2",
            "forms.fields.customkey3"
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

