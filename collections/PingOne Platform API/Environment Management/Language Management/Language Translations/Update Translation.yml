info:
  name: Update Translation
  type: http
  seq: 3

http:
  method: PUT
  url: "{{apiPath}}/environments/{{envID}}/translations/{{locale}}"
  body:
    type: json
    data: |-
      [
        {
           "key":"flow-ui.label.username",
           "translatedText":"Nom"
        },
        {
           "key":"flow-ui.label.password",
           "translatedText":"le mot de passe"
        }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Update Translation](https://developer.pingidentity.com/pingone-api/platform/language-management/language-translations/update-translation.html).
