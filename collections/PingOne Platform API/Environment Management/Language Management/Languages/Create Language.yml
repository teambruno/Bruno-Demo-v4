info:
  name: Create Language
  type: http
  seq: 1

http:
  method: POST
  url: "{{apiPath}}/environments/{{envID}}/languages"
  body:
    type: json
    data: |-
      {
        "locale": "fi"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() == 201) {
            try {
                var jsonData = res.getBody();
            }
            catch (e) {
                console.log("There was an error parsing JSON ", e);
            }
            bru.setEnvVar("languageID", jsonData.id);
            console.log("languageID is now: " + bru.getEnvVar("languageID"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This PingOne collection contains only the requests without documentation. For the official Platform SSO APIs documentation, see [Create Language](https://developer.pingidentity.com/pingone-api/platform/language-management/languages/create-language-1.html).
