info:
  name: Response Time Check
  type: http
  seq: 2
  tags:
    - smoke
    - performance

http:
  method: GET
  url: "{{baseUrl}}/posts"
  params:
    - name: _limit
      value: "10"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("response time is under 3 seconds", () => {
          expect(res.responseTime).to.be.below(3000);
        });



        test("content-type is JSON", () => {
          const ct = res.headers["content-type"] ?? "";
          expect(ct).to.include("application/json");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.responseTime
      operator: lte
      value: "3000"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Response Time & Header Assertions

  Combines declarative YAML assertions (response time ≤ 3 000 ms) with
  scripted Chai tests to validate latency, pagination, and content-type headers.

  **CLI tip:** Use `--bail` so the suite stops immediately if latency spikes:
  ```bash
  bru run "04-Tests-and-Assertions" --env Production --bail
  ```
