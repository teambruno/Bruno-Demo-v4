name: Staging-Env
variables:
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
    description: Pinned here so the collection never inherits localhost from Globals-Local
  - name: userId
    value: "1"
    description: Used by 02-Scripting/03-Conditional Flow Control - pinned here, not inherited
  - name: breweryUrl
    value: https://api.openbrewerydb.org/v1
    description: Open Brewery DB base URL - no auth required
  - name: weatherUrl
    value: https://api.open-meteo.com/v1
    description: Open-Meteo base URL - no auth required
  - name: IdentityBaseUrl
    value: https://<vanity_domain>.login.net
  - name: clientID
    value: <clientID>
  - name: customerId
    value: <customerId>
  - name: ourAPIBaseUrl
    value: https://api.ourapi.net
  - name: DCCBase
    value: /dcc/api/public
  - name: DDXBase
    value: /ddx/v1
  - name: DPABase
    value: /dpa
  - name: DIABase
    value: /dia/api/v1
  - name: DTWBase
    value: /dtw/api/v1
  - name: tokenTtlSeconds
    value:
      type: number
      data: "900"
    description: number - compare against Date.now() without parseInt()
  - name: autoRefreshToken
    value:
      type: boolean
      data: "false"
    description: boolean - drives the refresh branch in the pre-request script
  - name: oauthConfig
    value:
      type: object
      data: |-
        {
          "grantType": "authorization_code",
          "scope": "openid profile",
          "audience": "https://staging.ourapi.net"
        }
    description: object - one variable instead of three, e.g. oauthConfig.scope
  - secret: true
    name: clientSecret
  - name: chainTodoId
    value:
      type: number
      data: "1"
    description: 06-Request-Chaining branch selector - 1 = open todo (07), 4 = completed todo (06)
