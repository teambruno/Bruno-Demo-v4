info:
  name: Update product example - not for runner
  type: http
  seq: 5

http:
  method: PUT
  url: https://dummyjson.com/products/{{productId}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Always skipped by the runner - kept as a scratch request to send by
        // hand. Same trick for any request you don't want in a CI run.
        bru.runner.skipRequest();

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
