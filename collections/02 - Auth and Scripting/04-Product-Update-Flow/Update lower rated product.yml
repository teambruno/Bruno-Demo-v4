info:
  name: Update lower rated product
  type: http
  seq: 3

http:
  method: PUT
  url: https://dummyjson.com/products/{{productId}}
  body:
    type: json
    data: |-
      {
        "discountPercentage": "{{updatedDiscountPercent}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // The low-rating branch. Reads the discount captured two requests ago,
        // doubles it, and feeds it back into the body as
        // {{updatedDiscountPercent}} - the body is built from live data.
        var currentDiscount = bru.getVar('discountPercent')
        bru.setVar('updatedDiscountPercent', currentDiscount * 2)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
