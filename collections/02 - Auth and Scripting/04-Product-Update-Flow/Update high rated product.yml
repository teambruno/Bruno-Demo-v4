info:
  name: Update high rated product
  type: http
  seq: 4

http:
  method: PUT
  url: https://dummyjson.com/products/{{productId}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Belt and braces: setNextRequest already routes around this one, but
        // a guard here means the request self-skips on a straight top-to-bottom
        // run too. skipRequest() drops it from the run - it is not a failure.
        if (bru.getVar('lastRating') <= 3)
        {
          bru.runner.skipRequest();
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
