opencollection: 1.0.0

info:
  name: 02 - Auth and Scripting
  version: v1.0.0
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: tokenVar
      value: tokenCollection
      disabled: true
  scripts:
    - type: before-request
      code: // console.log('Collection Level Script Logic')

docs:
  content: |-
    # 02 - Auth and Scripting

    Auth flows (Basic, Bearer, OAuth2 client-credentials), pre/post-request
    scripting, contract testing, and a product-update flow used for CI
    runner demos.

    Secrets in this collection use the V4 `externalSecrets` /
    `{{name.keyname}}` pattern - see Demo-Env.yml and
    "04 - CLI CI and V4 Features/03-v4 Updates" for the before/after.

    Scripting demos here use both flavours of JS file: `02-Scripting/contractTests.js`
    (collection-local) and `/shared-scripts/*.js` (shared across all three
    collections via `additionalContextRoots`).
  type: text/markdown
bundled: false
extensions:
  bruno:
    scripts:
      additionalContextRoots:
        - ../../shared-scripts
