docs:
  content: |-
    ## 05 - Data-Driven Testing

    Bruno CLI iterates a request over every row of a data file, injecting each
    row's columns as variables for that iteration. One request file, N runs.

    ### Data files

    Both files live in [`data-files/`](../../../data-files/) at the repo root and
    are shared with the reporter demo in "04 - CLI CI and V4 Features", so there
    is one copy of the rows, not three. They hold the same nine rows, so the two
    flags below are interchangeable - useful for showing the feature is not
    CSV-only.

    | name          | job                 |
    |---------------|---------------------|
    | John Doe      | Software Engineer   |
    | Jane Smith    | Product Manager     |
    | Mark Lee      | Data Scientist      |
    | Priya Raman   | QA Engineer         |
    | Tomas Herrera | DevOps Engineer     |
    | Aisha Bello   | Security Analyst    |
    | Wei Zhang     | Backend Developer   |
    | Lena Novak    | Technical Writer    |
    | Samuel Okafor | Solutions Architect |

    ```bash
    # CSV
    bru run "05-Data-Driven" --env Demo-Env \
      --csv-file-path "../../data-files/req-users.csv"

    # JSON - same nine rows, same result
    bru run "05-Data-Driven" --env Demo-Env \
      --json-file-path "../../data-files/req-users.json"

    # With reporters
    bru run "05-Data-Driven" --env Demo-Env \
      --csv-file-path "../../data-files/req-users.csv" \
      --reporter-html ../../reports/data-driven.html
    ```

    Run these from the collection root
    (`collections/02 - Auth and Scripting`), not the workspace root - the
    data-file and reporter paths resolve relative to the working directory,
    which is what the `../../` prefixes are for.

    ### Note on reading row values

    The request asserts against the echoed response rather than calling
    `bru.getVar("name")`. Row values interpolate into a request body
    reliably; reading them back with `getVar()` is not dependable across CLI
    versions. This folder previously used `getVar()` and had to run with
    `allow_failure: true` in CI as a result.
  type: text/markdown
