docs:
  content: |-
    ## 05 - Data-Driven Testing

    Bruno CLI iterates a request over every row of a data file, injecting each
    row's columns as variables for that iteration. One request file, N runs.

    ### Data files

    Both files hold the same three rows, so the two flags below are
    interchangeable - useful for showing the feature is not CSV-only.

    | name       | job                |
    |------------|--------------------|
    | John Doe   | Software Engineer  |
    | Jane Smith | Product Manager    |
    | Mark Lee   | Data Scientist     |

    ```bash
    # CSV
    bru run "05-Data-Driven" --env Demo-Env \
      --csv-file-path "05-Data-Driven/req-users.csv"

    # JSON - same three rows, same result
    bru run "05-Data-Driven" --env Demo-Env \
      --json-file-path "05-Data-Driven/req-users.json"

    # With reporters
    bru run "05-Data-Driven" --env Demo-Env \
      --csv-file-path "05-Data-Driven/req-users.csv" \
      --reporter-html reports/data-driven.html
    ```

    Run these from the collection root
    (`collections/02 - Auth and Scripting`), not the workspace root - the
    data-file path resolves relative to the working directory.

    ### Note on reading row values

    The request asserts against the echoed response rather than calling
    `bru.getVar("name")`. Row values interpolate into a request body
    reliably; reading them back with `getVar()` is not dependable across CLI
    versions. This folder previously used `getVar()` and had to run with
    `allow_failure: true` in CI as a result.
  type: text/markdown
