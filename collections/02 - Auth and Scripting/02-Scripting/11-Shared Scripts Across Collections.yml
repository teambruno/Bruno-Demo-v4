info:
  name: Shared Scripts Across Collections
  type: http
  seq: 11
  tags:
    - shared-scripts

http:
  method: POST
  url: https://echo.usebruno.com
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Correlation-Id
      value: "{{correlationId}}"
      description: Generated by shared-scripts/testData.js
  body:
    type: json
    data: |-
      {
        "user": {{newUser}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Local JS file: only reachable from inside this collection.
        //   require('./02-Scripting/contractTests.js')
        // Shared JS file: reachable from every collection in the workspace
        // because opencollection.yml lists ../../shared-scripts under
        // extensions.bruno.scripts.additionalContextRoots.
        const { buildUser, correlationId } = require('../../shared-scripts/testData.js');

        const user = buildUser({ source: '02 - Auth and Scripting' });

        bru.setVar('newUser', JSON.stringify(user));
        bru.setVar('expectedEmail', user.email);
        bru.setVar('correlationId', correlationId('auth-scripting'));
    - type: tests
      code: |-
        const {
          assertHealthyJsonResponse,
          assertRequiredFields
        } = require('../../shared-scripts/httpAsserts.js');

        const body = res.getBody();

        test('200, JSON, under 3s (shared helper)', () => {
          assertHealthyJsonResponse(res, { status: 200, maxMs: 3000 });
        });

        test('echoed user carries every generated field', () => {
          assertRequiredFields(body.user, ['name', 'email', 'role', 'createdAt', 'source']);
        });

        test('email came from the shared factory, not this request', () => {
          expect(body.user.email).to.equal(bru.getVar('expectedEmail'));
          expect(body.user.email).to.include('@usebruno.test');
        });

        test('role is one of the values the shared factory can pick', () => {
          expect(['admin', 'editor', 'viewer']).to.include(body.user.role);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Two kinds of JS file, side by side

  | | Path | Reachable from |
  | --- | --- | --- |
  | Collection-local | `./02-Scripting/contractTests.js` | this collection only, no config |
  | Workspace-shared | `../../shared-scripts/testData.js` | all three collections, needs `additionalContextRoots` |

  `07-Validating Pet Vaccines - JS File.yml` shows the local flavour. This
  request uses the shared flavour: the payload is built by
  `shared-scripts/testData.js` `buildUser()` and validated by
  `shared-scripts/httpAsserts.js` - the exact same modules
  `01 - Fundamentals/05-Shared-Scripts` and
  `03 - CLI CI and V4 Features/03-v4 Updates` call.

  Config (in `opencollection.yml`):

  ```yml
  extensions:
    bruno:
      scripts:
        additionalContextRoots:
          - "../../shared-scripts"
  ```

  Needs Developer Mode in the app, `--sandbox=developer` on the CLI:

  ```bash
  bru run "02-Scripting" --env Demo-Env --sandbox=developer
  ```

  Docs: https://docs.usebruno.com/testing/script/js-file
