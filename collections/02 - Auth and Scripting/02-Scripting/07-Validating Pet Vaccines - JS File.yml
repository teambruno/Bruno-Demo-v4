info:
  name: Validating Pet Vaccines - JS File
  type: http
  seq: 7

http:
  method: POST
  url: https://echo.usebruno.com
  body:
    type: json
    data: |
      {
        "pets": [
          {
            "id": "pet_002",
            "name": "Jerry",
            "age": 4,
            "vaccinated": true,
            "tags": ["friendly", "energetic"]
          },
          {
            "id": "pet_005",
            "name": "Sam",
            "age": 2,
            "vaccinated": false,
            "tags": ["quiet", "food-motivated"]
          }
        ]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        // Collection-local JS file. require() resolves from the collection
        // root, so the folder name is part of the path - see
        // "11-Shared Scripts Across Collections" for the cross-collection version.
        const { validateVaccinatedPetsResponse, checkAllPetsVaccinated } = require("./02-Scripting/contractTests.js");

        test("Valid response structure for pets", () => {
          validateVaccinatedPetsResponse(res.getBody());
        });

        test("All pets must be vaccinated", () => {
          checkAllPetsVaccinated(res.getBody());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
