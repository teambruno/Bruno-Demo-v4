info:
  name: 10-Upload Form
  type: http
  seq: 10

http:
  method: POST
  url: https://www.httpfaker.org/api/echo
  body:
    type: form-urlencoded
    data:
      - name: username
        value: johndoe
      - name: password
        value: secret123
  auth:
    type: apikey
    key: x-api-key
    value: "{{api-key}}"
    placement: header

runtime:
  scripts:
    - type: before-request
      code: |-
        console.log('before-request');
        req.setHeader("X-Timestamp", Date.now());
    - type: after-response
      code: |-
        console.log('after-response');
        // httpfaker returns the body as a raw string, not a parsed `form`
        // object the way httpbin did - so parse it here.
        const form = Object.fromEntries(
          (res.getBody().body || '')
            .split('&')
            .filter(Boolean)
            .map(pair => pair.split('=').map(decodeURIComponent))
        );
        bru.setVar("token", form.username);
    - type: tests
      code: |-
        const form = Object.fromEntries(
          (res.getBody().body || '')
            .split('&')
            .filter(Boolean)
            .map(pair => pair.split('=').map(decodeURIComponent))
        );

        test("should return 200", function() {
          expect(res.status).to.equal(200);
        });

        test("form fields survived the round trip", function() {
          expect(form.username).to.equal("johndoe");
          expect(form.password).to.equal("secret123");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Form-urlencoded POST + API key header + before/after scripts, against
    `httpfaker.org/api/echo`, which hands the request back so the test can
    check the encoded form actually arrived.

    Previously this pointed at httpbin.org/post. httpbin is Postman-owned, so
    an outage there blocks our demos; httpfaker is Bruno's own. The shapes
    differ - httpbin returned a parsed `form` object, httpfaker returns the
    raw body string - so the scripts split it by hand
    (URLSearchParams is not available in Bruno's sandbox).
  type: text/markdown
