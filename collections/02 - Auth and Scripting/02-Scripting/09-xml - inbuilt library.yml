info:
  name: xml2js - inbuilt library
  type: http
  seq: 3

http:
  method: POST
  url: https://www.httpfaker.org/api/echo/custom
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "headers": { "content-type": "application/xml" },
        "content": "<?xml version=\"1.0\" encoding=\"UTF-8\"?><slideshow title=\"Bruno Demo\" author=\"Bruno\"><slide type=\"all\"><title>Wake up to WonderWidgets!</title></slide><slide type=\"all\"><title>Overview</title><item>Why WonderWidgets are great</item></slide></slideshow>"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const { parseStringPromise } = require("xml2js");

        test("status is 200", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("response XML can be parsed with xml2js", () => {
          const body = res.getBody();
          return parseStringPromise(body, { explicitArray: false }).then(parsed => {
            expect(parsed).to.be.an("object");
            expect(parsed).to.have.property("slideshow");
            expect(parsed.slideshow).to.have.property("slide");
          });
        });

docs: |-
  ## xml2js, one of Bruno's inbuilt libraries

  `require("xml2js")` needs no install step - but on CLI 3.3.0 it does need
  the developer sandbox, so run it with `--sandbox developer` or the require
  fails with "Cannot find module xml2js". It works unprompted in the app.

  ```bash
  bru run "02-Scripting/09-xml - inbuilt library.yml" \
    --env Demo-Env --sandbox developer
  ```

  The XML itself now comes from `httpfaker.org/api/echo/custom`, which returns
  whatever `content` you hand it under whatever `content-type` you ask for -
  so it stands in for httpbin's old `/xml` endpoint while staying on
  Bruno-owned infrastructure. Verified: the response really does come back as
  `content-type: application/xml`, not JSON.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
