info:
  name: Get a list of available payment methods
  type: http
  seq: 2
  tags:
    - Payments

http:
  method: POST
  url: "{{baseUrl}}/paymentMethods"
  headers:
    - name: Idempotency-Key
      value: 37ca9c97-d1d1-4c62-89e8-706891a563ed
      description: A unique identifier for the message with a maximum of 64 characters (we recommend a UUID).
  body:
    type: json
    data: |-
      {
        "merchantAccount": "YOUR_MERCHANT_ACCOUNT"
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: List of available payment methods
    request:
      url: "{{baseUrl}}/paymentMethods"
      method: POST
      headers:
        - name: Idempotency-Key
          value: 37ca9c97-d1d1-4c62-89e8-706891a563ed
          description: A unique identifier for the message with a maximum of 64 characters (we recommend a UUID).
      body:
        type: json
        data: |-
          {
            "merchantAccount": "YOUR_MERCHANT_ACCOUNT"
          }
    response:
      status: 200
      statusText: OK
