  - name: Shopper's payment details tokenized
    description: Example response for tokenizing the shopper's payment details
    request:
      url: "{{baseUrl}}/sessions"
      method: POST
      headers:
        - name: Idempotency-Key
          value: 37ca9c97-d1d1-4c62-89e8-706891a563ed
          description: A unique identifier for the message with a maximum of 64 characters (we recommend a UUID).
      body:
        type: json
        data: |-
          {
            "merchantAccount": "TestMerchantCheckout",
            "amount": {
              "value": 100,
              "currency": "EUR"
            },
            "shopperReference": "YOUR_SHOPPER_REFERENCE",
            "returnUrl": "https://your-company.example.com/checkout?shopperOrder=12xy..",
            "reference": "YOUR_PAYMENT_REFERENCE",
            "countryCode": "NL",
            "storePaymentMethodMode": "enabled",
            "shopperInteraction": "Ecommerce",
            "recurringProcessingModel": "CardOnFile"
