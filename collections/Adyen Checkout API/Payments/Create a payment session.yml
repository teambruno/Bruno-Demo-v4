info:
  name: Create a payment session
  type: http
  seq: 5
  tags:
    - Payments

http:
  method: POST
  url: "{{baseUrl}}/sessions"
  headers:
    - name: Idempotency-Key
      value: 37ca9c97-d1d1-4c62-89e8-706891a563ed
      description: A unique identifier for the message with a maximum of 64 characters (we recommend a UUID).
  body:
    type: json
    data: |-
      {
        "merchantAccount": "YOUR_MERCHANT_ACCOUNT",
        "amount": {
          "value": 100,
          "currency": "EUR"
        },
        "returnUrl": "https://your-company.example.com/checkout?shopperOrder=12xy..",
        "reference": "YOUR_PAYMENT_REFERENCE",
        "countryCode": "NL"
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
