info:
  name: Create a payment link
  type: http
  seq: 1
  tags:
    - Payment links

http:
  method: POST
  url: "{{baseUrl}}/paymentLinks"
  headers:
    - name: Idempotency-Key
      value: 37ca9c97-d1d1-4c62-89e8-706891a563ed
      description: A unique identifier for the message with a maximum of 64 characters (we recommend a UUID).
  body:
    type: json
    data: |-
      {
        "reference": "YOUR_ORDER_NUMBER",
        "amount": {
          "value": 1250,
          "currency": "BRL"
        },
        "countryCode": "BR",
        "merchantAccount": "YOUR_MERCHANT_ACCOUNT",
        "shopperReference": "YOUR_SHOPPER_REFERENCE",
        "shopperEmail": "test@email.com",
        "shopperLocale": "pt-BR",
        "billingAddress": {
          "street": "Roque Petroni Jr",
          "postalCode": "59000060",
          "city": "São Paulo",
          "houseNumberOrName": "999",
          "country": "BR",
          "stateOrProvince": "SP"
        },
        "deliveryAddress": {
          "street": "Roque Petroni Jr",
          "postalCode": "59000060",
          "city": "São Paulo",
          "houseNumberOrName": "999",
          "country": "BR",
          "stateOrProvince": "SP"
        }
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

