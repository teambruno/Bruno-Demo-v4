info:
  name: Updates the order for PayPal Express Checkout
  type: http
  seq: 3
  tags:
    - Utility

http:
  method: POST
  url: "{{baseUrl}}/paypal/updateOrder"
  headers:
    - name: Idempotency-Key
      value: 37ca9c97-d1d1-4c62-89e8-706891a563ed
      description: A unique identifier for the message with a maximum of 64 characters (we recommend a UUID).
  body:
    type: json
    data: |-
      {
        "pspReference": "DZ4DPSHB4WD2WN82",
        "paymentData": "po7XZ...",
        "amount": {
          "currency": "EUR",
          "value": 12000
        },
        "deliveryMethods": [
          {
            "reference": "1",
            "description": "Express Shipping",
            "type": "Shipping",
            "amount": {
              "currency": "EUR",
              "value": 1000
            },
            "selected": true
          },
          {
            "reference": "2",
            "description": "Standard Ground",
            "type": "Shipping",
            "amount": {
              "currency": "EUR",
              "value": 500
            },
            "selected": false
          }
        ]
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

