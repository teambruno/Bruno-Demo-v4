          {
            "reference": "YOUR_UNIQUE_REFERENCE",
            "merchantAccount": "YOUR_MERCHANT_ACCOUNT",
            "amount": {
              "value": 2000,
              "currency": "EUR"
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "merchantAccount": "YOUR_MERCHANT_ACCOUNT",
            "paymentPspReference": "993617894903480A",
            "reference": "YOUR_UNIQUE_REFERENCE",
            "pspReference": "993617894906488A",
