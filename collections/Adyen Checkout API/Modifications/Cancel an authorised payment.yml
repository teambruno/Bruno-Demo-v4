info:
  name: Cancel an authorised payment
  type: http
  seq: 1
  tags:
    - Modifications

http:
  method: POST
  url: "{{baseUrl}}/cancels"
  headers:
    - name: Idempotency-Key
      value: 37ca9c97-d1d1-4c62-89e8-706891a563ed
      description: A unique identifier for the message with a maximum of 64 characters (we recommend a UUID).
  body:
    type: json
    data: |-
      {
        "paymentReference": "YOUR_UNIQUE_REFERENCE_FOR_THE_PAYMENT",
        "reference": "YOUR_UNIQUE_REFERENCE_FOR_THE_CANCELLATION",
        "merchantAccount": "YOUR_MERCHANT_ACCOUNT"
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

