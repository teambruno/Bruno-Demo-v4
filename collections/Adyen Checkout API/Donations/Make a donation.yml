info:
  name: Make a donation
  type: http
  seq: 1
  tags:
    - Donations

http:
  method: POST
  url: "{{baseUrl}}/donations"
  body:
    type: json
    data: |-
      {
        "amount": {
          "currency": "EUR",
          "value": 1000
        },
        "reference": "YOUR_DONATION_REFERENCE",
        "paymentMethod": {
          "type": "scheme"
        },
        "donationToken": "YOUR_DONATION_TOKEN",
        "donationOriginalPspReference": "991559660454807J",
        "donationCampaignId": "DONATION_CAMPAIGN_ID",
        "returnUrl": "https://your-company.example.com/...",
        "merchantAccount": "YOUR_MERCHANT_ACCOUNT"
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Successful donation to a campaign
    request:
      url: "{{baseUrl}}/donations"
      method: POST
      headers:
        - name: Idempotency-Key
          value: 37ca9c97-d1d1-4c62-89e8-706891a563ed
          description: A unique identifier for the message with a maximum of 64 characters (we recommend a UUID).
      body:
        type: json
        data: |-
          {
            "amount": {
              "currency": "EUR",
              "value": 1000
            },
            "reference": "YOUR_DONATION_REFERENCE",
            "paymentMethod": {
              "type": "scheme"
            },
            "donationToken": "YOUR_DONATION_TOKEN",
            "donationOriginalPspReference": "991559660454807J",
            "donationCampaignId": "DONATION_CAMPAIGN_ID",
            "returnUrl": "https://your-company.example.com/...",
            "merchantAccount": "YOUR_MERCHANT_ACCOUNT"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "UNIQUE_RESOURCE_ID",
            "status": "completed",
            "merchantAccount": "YOUR_MERCHANT_ACCOUNT",
            "amount": {
              "currency": "EUR",
              "value": 1000
            },
            "reference": "YOUR_DONATION_REFERENCE",
            "payment": {
              "pspReference": "8535762347980628",
              "resultCode": "Authorised",
              "amount": {
                "currency": "EUR",
                "value": 1000
              },
              "merchantReference": "YOUR_DONATION_REFERENCE"
            }
          }
