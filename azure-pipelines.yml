# Bruno CLI x Azure Pipelines - Bruno V4 Demo Kit
#
# The third of three equivalent pipelines in this workspace. Same collections,
# same commands, same reports:
#
#   GitHub Actions  .github/workflows/bruno-cli.yml
#   GitLab CI       bruno-cli.gitlab-ci.yml  (root .gitlab-ci.yml just includes it)
#   Azure Pipelines this file                (+ ci/azure/steps-bru-run.yml)
#
#   Overview  https://docs.usebruno.com/bru-cli/overview
#   Docker    https://docs.usebruno.com/bru-cli/docker
#   Options   https://docs.usebruno.com/bru-cli/commandOptions
#   Reporters https://docs.usebruno.com/bru-cli/builtInReporters
#   Secrets   https://docs.usebruno.com/bru-cli/secret-managers
#
# Optional pipeline variables (Pipelines > this pipeline > Edit > Variables, or
# a linked variable group - both override the YAML defaults below):
#
#   BRUNO_GLOBAL_API_KEY - keep it secret. Read by environments/Globals-CI.yml
#                          as {{process.env.BRUNO_GLOBAL_API_KEY}}
#   DEMO_POST_ID         - the --env-var override demo in the Basics stage
#
# Azure Key Vault (Stage 5, off until RUN_AZURE_VAULT_DEMO=true):
#   AZURE_SERVICE_CONNECTION - ARM service connection name, leg 1's only input
#   AZURE_TENANT_ID          - leg 2 only, all three secret. Not needed at all
#   AZURE_CLIENT_ID            if you only want leg 1, which is the path with
#   AZURE_CLIENT_SECRET        no stored credential anywhere.
#
# Setup, in order:
#   1. Project settings > Service connections > New > Azure Resource Manager >
#      Workload identity federation (automatic) > pick the subscription >
#      name it to match AZURE_SERVICE_CONNECTION
#   2. Grant that identity "Key Vault Secrets User" on bruno-demo-kv - the
#      vault uses RBAC, so an access policy entry will not do it
#   3. Set RUN_AZURE_VAULT_DEMO = true

trigger:
  # Keeps one run per branch in flight and rolls pending commits into the next
  # one. It is not quite GitLab's `interruptible: true` or Actions'
  # cancel-in-progress - those kill the running build; this one lets it finish
  # and batches what arrived while it ran. Cancelling in-flight builds is a
  # setting rather than YAML: Repos > Branches > main > Branch policies >
  # Build validation > "Automatically cancel in-progress builds".
  batch: true
  branches:
    include: [main]

# NOTE: a `pr:` trigger is honoured for GitHub/Bitbucket repos only. This repo
# lives in Azure Repos, where PR validation is a branch policy instead:
# Repos > Branches > main > Branch policies > Build validation > add this
# pipeline. Hence no `pr:` block - it would be silently ignored.
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Official image, pinned. Also published as ghcr.io/usebruno/cli, and as
  # :4, :latest and :4.0.0-debian if you'd rather track a moving tag.
  - name: BRUNO_CLI_IMAGE
    value: usebruno/cli:4.0.0
  # Workspace-level environment: environments/Globals-CI.yml
  - name: BRU_GLOBAL_ENV
    value: Globals-CI
  # Path back to the workspace root from a collection root, so --global-env resolves
  - name: BRU_WORKSPACE_PATH
    value: ../..
  - name: REPORT_DIR
    value: reports

  # Empty defaults for everything the step template reads. Without these an
  # undefined $(BRU_TARGET) would reach bash as the literal string
  # "$(BRU_TARGET)" - Azure Pipelines leaves macros it does not recognise
  # alone rather than blanking them. Matrix legs override these per job.
  - name: BRU_TARGET
    value: ''
  - name: BRU_ARGS
    value: ''
  - name: BRU_ENV_VARS
    value: ''
  # NOT declared here on purpose: BRUNO_GLOBAL_API_KEY, DEMO_POST_ID,
  # RUN_AZURE_VAULT_DEMO and the AZURE_* trio.
  #
  # A YAML variable BEATS a same-named variable set in the pipeline settings UI
  # or a variable group - the precedence runs queue-time > YAML > UI, not the
  # other way round. So declaring `RUN_AZURE_VAULT_DEMO: false` here would pin
  # it to false however you set it in the UI, and an empty
  # `BRUNO_GLOBAL_API_KEY: ""` would blank out a real secret. Verified the hard
  # way: build 37 skipped the Vault stage with the UI variable set to true.
  #
  # Leaving them undeclared makes the UI the single source of truth. The cost is
  # that an undefined $(NAME) reaches bash as that literal string rather than as
  # empty - Azure leaves macros it does not recognise alone - so every consumer
  # below normalises it. Stage conditions need no such care: an undefined
  # variable compares equal to '', which is why the Vault gate still defaults to
  # off when nobody has set it.

  # -- Vault stage (Stage 5) --------------------------------------------------
  # RUN_AZURE_VAULT_DEMO is deliberately NOT declared here - see above. Set it
  # to true in Edit > Variables once the service connection exists; undefined
  # means the stage stays skipped.
  #
  # Name of the ARM service connection (Project settings > Service connections).
  # Leg 1 authenticates with this and nothing else.
  - name: AZURE_SERVICE_CONNECTION
    value: bruno-demo-azure
  # Leg 2 needs AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET as
  # SECRET pipeline variables. Not declared here either, for the same reason -
  # a YAML default would shadow them. Leg 2 fails with a clear message when they
  # are missing. Leg 1 needs none of them.

  # Prefer a variable group over per-pipeline variables? Link it here and drop
  # the defaults above that it supplies:
  # - group: bruno-demo-ci

stages:
  # ---------------------------------------------------------------------------
  # Stage 1 - `bru run` on its own, no template, no matrix, no reporters
  #
  # Four commands, each its own line in the log. This is the whole CLI: point it
  # at a request or a folder, pick an environment, and it runs your tests.
  # Everything after this stage is the same command with more flags on it.
  # ---------------------------------------------------------------------------
  - stage: Basics
    displayName: bru basics
    jobs:
      - job: basics
        displayName: bru basics
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              # `bru` below is the pinned CLI image with this folder mounted at /c
              bru() { docker run --rm -v "$PWD:/c" -w /c "$(BRUNO_CLI_IMAGE)" "$@"; }

              bru --version

              # One request, one environment -> 8 tests
              bru run "01-Basic-Requests/01-Get Post.yml" --env Production

              # Same request, one variable overridden at run time (repeat --env-var to stack)
              bru run "01-Basic-Requests/01-Get Post.yml" --env Production --env-var postId=42

              # Same override, value supplied by Azure DevOps instead of the
              # command line: Edit > Variables > DEMO_POST_ID. An undeclared
              # variable arrives as the literal "$(DEMO_POST_ID)", so normalise
              # that to empty and then fall back to 5.
              case "$DEMO_POST_ID" in '$('*')') DEMO_POST_ID='' ;; esac
              bru run "01-Basic-Requests/01-Get Post.yml" --env Production --env-var postId="${DEMO_POST_ID:-5}"

              # A whole folder, in sequence: request 2 uses a variable request 1 set
              bru run "03-Chained-Requests" --env Production
            displayName: bru run
            workingDirectory: $(Build.SourcesDirectory)/collections/01 - Fundamentals
            env:
              # Explicit mapping so this keeps working when DEMO_POST_ID is
              # marked secret - secrets never land on the agent env by themselves.
              DEMO_POST_ID: $(DEMO_POST_ID)

  # ---------------------------------------------------------------------------
  # Stage 2 - fast gate: only requests tagged `smoke`, stop at the first failure
  #
  # GitLab expresses the fan-out as `parallel: matrix:` on a job that
  # `extends: [.bru, .all-collections]`. Azure's matrix is the same idea; the
  # shared half lives in ci/azure/steps-bru-run.yml.
  #
  # "02 - Auth and Scripting"'s Prod-Env.yml is deliberately bare in this demo
  # workspace, so CI injects the endpoints it needs with --env-var (repeatable).
  #
  # "03 - Secrets and Vaults" is deliberately NOT in this matrix. Its three
  # environments bind to live secret managers (Azure Key Vault, AWS Secrets
  # Manager, HashiCorp Vault) and every request needs data-plane credentials
  # the pipeline does not hold yet.
  # ---------------------------------------------------------------------------
  - stage: Smoke
    displayName: smoke
    dependsOn: Basics
    jobs:
      - job: smoke
        displayName: smoke
        strategy:
          # Azure runs every matrix leg to completion - there is no fail-fast to
          # switch off, so one red collection still shows you the other two.
          #
          # The leg names are underscored because each one becomes a job
          # identifier, and those take letters, digits and _ only - a hyphen
          # here fails validation before the pipeline ever starts. The
          # hyphenated slug lives in BRU_NAME instead, which is what the report
          # filenames and artifact names are built from.
          matrix:
            fundamentals:
              BRU_NAME: smoke-fundamentals
              BRU_COLLECTION: 01 - Fundamentals
              BRU_ENV: Production
              BRU_ARGS: -r --tags smoke --bail
            auth_scripting:
              BRU_NAME: smoke-auth-scripting
              BRU_COLLECTION: 02 - Auth and Scripting
              BRU_ENV: Prod-Env
              BRU_ARGS: -r --tags smoke --bail
              BRU_ENV_VARS: >-
                --env-var weatherUrl=https://api.open-meteo.com/v1
                --env-var breweryUrl=https://api.openbrewerydb.org/v1
                --env-var userId=1
            v4_features:
              BRU_NAME: smoke-v4-features
              BRU_COLLECTION: 04 - CLI CI and V4 Features
              BRU_ENV: Production
              BRU_ARGS: -r --tags smoke --bail
        steps:
          - template: ci/azure/steps-bru-run.yml

  # ---------------------------------------------------------------------------
  # Stage 3 - the suite, one job per collection, all running in parallel
  #
  # Microsoft-hosted pools run one job at a time on the free tier, so these
  # eight legs queue rather than fan out until you have parallel jobs granted.
  # ---------------------------------------------------------------------------
  - stage: Test
    displayName: test
    dependsOn: Smoke
    jobs:
      - job: test
        displayName: test
        strategy:
          matrix:
            # -- regression: --tags matches requests with ALL listed tags,
            #    --exclude-tags drops ANY
            regression_fundamentals:
              BRU_NAME: regression-fundamentals
              BRU_COLLECTION: 01 - Fundamentals
              BRU_ENV: Production
              BRU_ARGS: -r --tags regression --exclude-tags slow
            regression_auth_scripting:
              BRU_NAME: regression-auth-scripting
              BRU_COLLECTION: 02 - Auth and Scripting
              BRU_ENV: Prod-Env
              BRU_ARGS: -r --tags regression --exclude-tags slow
              BRU_ENV_VARS: >-
                --env-var weatherUrl=https://api.open-meteo.com/v1
                --env-var breweryUrl=https://api.openbrewerydb.org/v1
                --env-var userId=1
            regression_v4_features:
              BRU_NAME: regression-v4-features
              BRU_COLLECTION: 04 - CLI CI and V4 Features
              BRU_ENV: Production
              BRU_ARGS: -r --tags regression --exclude-tags slow

            # -- shared-scripts: require()-ing /shared-scripts via
            #    additionalContextRoots needs the developer sandbox
            #    (default is `safe` since CLI 3.0.0)
            shared_scripts_fundamentals:
              BRU_NAME: shared-scripts-fundamentals
              BRU_COLLECTION: 01 - Fundamentals
              BRU_ENV: Production
              BRU_ARGS: -r --tags shared-scripts --sandbox developer
            shared_scripts_auth_scripting:
              BRU_NAME: shared-scripts-auth-scripting
              BRU_COLLECTION: 02 - Auth and Scripting
              BRU_ENV: Prod-Env
              BRU_ARGS: -r --tags shared-scripts --sandbox developer
              BRU_ENV_VARS: >-
                --env-var weatherUrl=https://api.open-meteo.com/v1
                --env-var breweryUrl=https://api.openbrewerydb.org/v1
                --env-var userId=1
            shared_scripts_v4_features:
              BRU_NAME: shared-scripts-v4-features
              BRU_COLLECTION: 04 - CLI CI and V4 Features
              BRU_ENV: Production
              BRU_ARGS: -r --tags shared-scripts --sandbox developer

            # -- data-driven: 9 CSV rows -> 9 iterations, each one a row in the
            #    report. Swap the flag for --json-file-path /ws/data-files/req-users.json
            #    to drive the same nine iterations from JSON instead. Both files
            #    live in data-files/ at the repo root, shared with the
            #    Runner-DD-Users reporter demo. The repo is mounted at /ws and
            #    the workdir is the collection, so the data file needs the
            #    absolute form - same as the reporter paths in the template.
            data_driven:
              BRU_NAME: data-driven
              BRU_COLLECTION: 02 - Auth and Scripting
              BRU_ENV: Prod-Env
              BRU_TARGET: 05-Data-Driven
              BRU_ARGS: -r --csv-file-path /ws/data-files/req-users.csv

            # -- v4-features: scoped to this folder on purpose.
            #    02-Additional-Request-Types holds WebSocket/gRPC/SSE requests,
            #    which the CLI can't execute ("Unsupported protocol wss:") -
            #    those stay app-only demos.
            v4_updates:
              BRU_NAME: v4-updates
              BRU_COLLECTION: 04 - CLI CI and V4 Features
              BRU_ENV: Production
              BRU_TARGET: 03-v4 Updates
              BRU_ARGS: -r --sandbox developer
        steps:
          - template: ci/azure/steps-bru-run.yml

  # ---------------------------------------------------------------------------
  # Stage 4 - collect every report into one artifact plus a run summary
  #
  # Azure DevOps has no Pages equivalent, so where GitLab's `pages:` job serves
  # the HTML reports at a URL, this publishes them as one downloadable artifact
  # (with the same index.html inside) and attaches a markdown summary to the
  # run's Extensions tab via task.uploadsummary - the counterpart of Actions'
  # $GITHUB_STEP_SUMMARY. The per-request detail is already in the Tests tab.
  # ---------------------------------------------------------------------------
  - stage: Report
    displayName: report
    dependsOn: [Smoke, Test]
    condition: always() # the report matters most when the suite failed
    jobs:
      - job: report
        displayName: report
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download all reports
            inputs:
              patterns: bruno-reports-*/**
              path: $(Pipeline.Workspace)/downloads

          - bash: |
              set -uo pipefail
              cd "$(Pipeline.Workspace)"
              mkdir -p public

              # One artifact per matrix leg, so flatten the per-artifact
              # directories back into a single folder.
              find downloads -type f \( -name '*.html' -o -name '*.json' -o -name '*.xml' \) \
                -exec cp {} public/ \; 2>/dev/null || true

              {
                echo "## Bruno CLI reports"
                echo
                echo "\`$(Build.SourceBranchName)\` @ \`$(Build.SourceVersion)\`"
                echo
                echo "| Job | Status | Requests | Tests | Assertions |"
                echo "|---|---|---:|---:|---:|"
              } > summary.md

              # The JSON reporter emits an array of iterations, each with its own
              # .summary - so a data-driven run with 9 CSV rows has 9 entries.
              # Totals are summed across them.
              for f in public/*.json; do
                [ -e "$f" ] || continue
                name=${f##*/}; name=${name%.json}
                jq -r --arg n "$name" '
                  [.[].summary] |
                  (map(.failedRequests + .errorRequests) | add) as $fail |
                  (map(.failedTests + .failedAssertions) | add) as $tfail |
                  "| \($n) | \(if ($fail + $tfail) > 0 then "❌ fail" else "✅ pass" end) " +
                  "| \(map(.passedRequests)|add)/\(map(.totalRequests)|add) " +
                  "| \(map(.passedTests)|add)/\(map(.totalTests)|add) " +
                  "| \(map(.passedAssertions)|add)/\(map(.totalAssertions)|add) |"
                ' "$f" >> summary.md
              done

              {
                echo "<!doctype html><meta charset=\"utf-8\">"
                echo "<title>Bruno CLI reports - $(Build.SourceVersion)</title>"
                echo "<h1>Bruno CLI reports</h1>"
                echo "<p>Build $(Build.BuildNumber)"
                echo " &middot; $(Build.SourceBranchName) @ $(Build.SourceVersion)</p><ul>"
                for f in public/*.html; do
                  [ -e "$f" ] || continue
                  name=${f##*/}
                  [ "$name" = "index.html" ] && continue
                  echo "<li><a href=\"$name\">$name</a></li>"
                done
                echo "</ul>"
              } > public/index.html

              # Attaches summary.md to the run. Markdown tables render; the
              # logging command is the only way to write to the run itself.
              echo "##vso[task.uploadsummary]$(Pipeline.Workspace)/summary.md"
            displayName: Build summary and index

          - task: PublishPipelineArtifact@1
            displayName: Publish combined reports
            inputs:
              targetPath: $(Pipeline.Workspace)/public
              artifact: bruno-reports-all


  # ---------------------------------------------------------------------------
  # Stage 5 - Azure Key Vault, two ways to authenticate
  #
  #   https://docs.usebruno.com/bru-cli/secret-managers
  #
  # Careful: there are TWO different Key Vault integrations in play, and they
  # solve different problems.
  #
  #   Azure Pipelines' integration (the AzureKeyVault@2 task, or a variable
  #   group linked to a vault) has *Azure* fetch secrets and expose them as
  #   pipeline variables. Bruno never sees the vault. Good for things the
  #   pipeline itself needs - see the note at the bottom of this stage.
  #
  #   Bruno's integration (this stage) has the *CLI* fetch secrets at request
  #   time. "03 - Secrets and Vaults" is built for this: its Demo-Azure.yml
  #   binds the alias `secretStore` to the vault and nothing else -
  #
  #     externalSecrets:
  #       type: azure-key-vault
  #       variables:
  #         - name: secretStore
  #           vaultName: bruno-demo-kv
  #
  #   - and requests use {{secretStore.basic-auth-password}} the same way they
  #   use any other variable. Values resolve per request and are never written
  #   to disk, never become pipeline variables, and never reach the log.
  #
  # Note what is NOT in the collection: how to log in. That lives in the file
  # behind --secrets-env-file, which is why the identical collection runs on a
  # laptop and on a hosted agent with no edits - only the file changes.
  #
  # The matrix is the demo: same requests, same vault, two ways in.
  #
  #   azure-cli        an AzureCLI@2 task with an ARM service connection. It
  #                    leaves an `az login` session behind, and for an
  #                    azure-key-vault environment with no provider config the
  #                    CLI falls back to the Azure CLI credential - so the
  #                    service connection IS the configuration. No
  #                    --secrets-env-file, nothing rendered, nothing to clean
  #                    up, and with workload identity federation no secret
  #                    exists anywhere to leak. This is the one to show.
  #   secrets-env-file service principal credentials rendered from secret
  #                    pipeline variables at run time. Needs no `az` binary and
  #                    no session, so this is the path for a self-hosted agent
  #                    or for running inside the usebruno/cli container.
  #
  # Reports publish as `vault-reports-*` rather than `bruno-reports-*` so they
  # stay out of the Report stage's aggregate - this stage is independent of the
  # rest of the pipeline, and Report runs alongside it rather than after it.
  # ---------------------------------------------------------------------------
  - stage: Vault
    displayName: azure key vault
    dependsOn: Test
    # Off until you flip RUN_AZURE_VAULT_DEMO to true, so a fork or a project
    # without the service connection never goes red here. Create the service
    # connection FIRST - a run that reaches an AzureCLI@2 task naming a
    # connection that does not exist fails the stage.
    condition: and(always(), eq(variables['RUN_AZURE_VAULT_DEMO'], 'true'))
    jobs:
      - job: vault
        displayName: azure key vault
        strategy:
          matrix:
            azure_cli:
              BRU_AUTH: azure-cli
              BRU_NAME: vault-azure-cli
            secrets_env_file:
              BRU_AUTH: secrets-env-file
              BRU_NAME: vault-secrets-env-file
        steps:
          - checkout: self
            fetchDepth: 1

          # Native install rather than the container the other stages use:
          # Azure CLI auth needs the `az` binary and its login session, both of
          # which are on the agent and neither of which is in usebruno/cli. The
          # service-principal leg has no such constraint and would run fine in
          # the image - mount the rendered file in with -v and pass the
          # container path.
          - bash: |
              set -euo pipefail
              # Version tracks BRUNO_CLI_IMAGE at the top of this file so the
              # container stages and this one cannot drift apart.
              npm install -g "@usebruno/cli@${BRUNO_CLI_IMAGE##*:}"
              bru --version
            displayName: Install Bruno CLI
            env:
              BRUNO_CLI_IMAGE: $(BRUNO_CLI_IMAGE)

          # -- Leg 1 ------------------------------------------------------------
          # AzureCLI@2 runs its script inside an authenticated az context, so
          # `bru run` goes here rather than in a later step - that way the login
          # session is guaranteed live rather than relying on it leaking
          # forward. No --secrets-env-file: the session is the credential.
          - task: AzureCLI@2
            condition: eq(variables['BRU_AUTH'], 'azure-cli')
            displayName: bru run (Azure CLI credential)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)/collections/03 - Secrets and Vaults
              inlineScript: |
                set -uo pipefail
                mkdir -p "$(Build.SourcesDirectory)/$(REPORT_DIR)"

                # Proof the session is real, and a nice thing to point at on a
                # call. --query keeps it to the app id, no tokens in the log.
                az account show --query "user.name" -o tsv

                # --exclude-tags app-only drops 03-Digest Auth Password. The CLI
                # does not interpolate digest auth credentials - it puts the
                # literal "{{secretStore.basic-auth-password}}" on the wire - so
                # that request 401s whatever the vault holds. Bug filed; see the
                # request's docs. The other four all resolve real vault values,
                # so this stays an honest test of the store.
                #
                # --verbose is not optional. A vault fetch that fails (bad
                # credentials, no data-plane role, wrong vault name) is caught
                # and swallowed, so without it the run just reports ordinary
                # 401s from the API under test and never says the vault was the
                # problem. It logs the vault name and whether each fetch
                # succeeded, never a secret value, and "1. Fetched secret for:
                # bruno-demo-kv" is worth showing anyway.
                bru run "02-External-Secrets" -r \
                  --env Demo-Azure \
                  --exclude-tags app-only \
                  --verbose \
                  --global-env "$(BRU_GLOBAL_ENV)" \
                  --workspace-path "$(BRU_WORKSPACE_PATH)" \
                  --reporter-html  "$(Build.SourcesDirectory)/$(REPORT_DIR)/$(BRU_NAME).html" \
                  --reporter-json  "$(Build.SourcesDirectory)/$(REPORT_DIR)/$(BRU_NAME).json" \
                  --reporter-junit "$(Build.SourcesDirectory)/$(REPORT_DIR)/$(BRU_NAME).xml" \
                  --reporter-skip-headers authorization \
                  --reporter-skip-headers x-api-key \
                  --reporter-skip-headers x-secret-probe

          # -- Leg 2 ------------------------------------------------------------
          # ci/azure-keyvault-service-principal.env.tpl is committed with
          # placeholders; the real values arrive as secret pipeline variables and
          # are substituted in here. The rendered file goes to
          # $(Agent.TempDirectory) - never inside the checkout, so it cannot be
          # committed by accident or swept into the artifact published below.
          - bash: |
              set -euo pipefail

              # These three are undeclared in YAML so the UI owns them, which
              # means an unset one arrives as the literal "$(AZURE_TENANT_ID)".
              # Normalise that to empty so the check below catches it.
              for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
                case "${!v}" in '$('*')') declare "$v=" ;; esac
              done

              # envsubst turns an unset variable into an empty value and the CLI
              # would then fail somewhere less obvious. Say it here instead.
              for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
                if [[ -z "${!v}" ]]; then
                  echo "##vso[task.logissue type=error]pipeline variable $v is unset or empty"
                  exit 1
                fi
              done

              # 600 before anything is written, and the explicit variable list
              # keeps envsubst from expanding anything else in scope.
              install -m 600 /dev/null "$(Agent.TempDirectory)/azure-keyvault-service-principal.env"
              envsubst '${AZURE_TENANT_ID} ${AZURE_CLIENT_ID} ${AZURE_CLIENT_SECRET}' \
                < ci/azure-keyvault-service-principal.env.tpl \
                > "$(Agent.TempDirectory)/azure-keyvault-service-principal.env"
            displayName: Render secrets env file
            condition: eq(variables['BRU_AUTH'], 'secrets-env-file')
            workingDirectory: $(Build.SourcesDirectory)
            env:
              # Secret variables are never on the agent env by themselves.
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)

          - bash: |
              set -uo pipefail
              mkdir -p "$(Build.SourcesDirectory)/$(REPORT_DIR)"

              # Identical to leg 1 apart from --secrets-env-file. Same command,
              # same environment, same collection, same vault.
              bru run "02-External-Secrets" -r \
                --env Demo-Azure \
                --exclude-tags app-only \
                --secrets-env-file "$(Agent.TempDirectory)/azure-keyvault-service-principal.env" \
                --verbose \
                --global-env "$(BRU_GLOBAL_ENV)" \
                --workspace-path "$(BRU_WORKSPACE_PATH)" \
                --reporter-html  "$(Build.SourcesDirectory)/$(REPORT_DIR)/$(BRU_NAME).html" \
                --reporter-json  "$(Build.SourcesDirectory)/$(REPORT_DIR)/$(BRU_NAME).json" \
                --reporter-junit "$(Build.SourcesDirectory)/$(REPORT_DIR)/$(BRU_NAME).xml" \
                --reporter-skip-headers authorization \
                --reporter-skip-headers x-api-key \
                --reporter-skip-headers x-secret-probe
            displayName: bru run (service principal)
            condition: eq(variables['BRU_AUTH'], 'secrets-env-file')
            workingDirectory: $(Build.SourcesDirectory)/collections/03 - Secrets and Vaults

          # Agent.TempDirectory is wiped with a hosted agent anyway, but on a
          # self-hosted one it may not be. Drop the file the moment it stops
          # being needed.
          - bash: rm -f "$(Agent.TempDirectory)/azure-keyvault-service-principal.env"
            displayName: Remove rendered credentials
            condition: and(always(), eq(variables['BRU_AUTH'], 'secrets-env-file'))

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            displayName: Publish JUnit results
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(REPORT_DIR)/$(BRU_NAME).xml
              searchFolder: $(Build.SourcesDirectory)
              testRunTitle: $(BRU_NAME)
              mergeTestResults: true
              failTaskOnFailedTests: false

          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            displayName: Publish reports
            inputs:
              targetPath: $(Build.SourcesDirectory)/$(REPORT_DIR)
              artifact: vault-reports-$(BRU_AUTH)

  # ---------------------------------------------------------------------------
  # The other Key Vault integration - Azure fetching secrets FOR the pipeline
  #
  # Everything above is Bruno reading the vault. The reverse is Azure reading it
  # and handing values to the pipeline as variables:
  #
  #   - task: AzureKeyVault@2
  #     inputs:
  #       azureSubscription: $(AZURE_SERVICE_CONNECTION)
  #       KeyVaultName: bruno-demo-kv
  #       SecretsFilter: bruno-global-api-key
  #       RunAsPreJob: true
  #
  # ...after which $(bruno-global-api-key) is a secret variable like any other.
  # A variable group linked to a vault (Library > Variable group > "Link secrets
  # from an Azure key vault as variables") does the same thing without YAML.
  #
  # Where that is genuinely useful here: BRUNO_GLOBAL_API_KEY for the Smoke and
  # Test stages, so even that value stops living in pipeline variables. It would
  # need adding to the vault first - bruno-demo-kv currently holds only the four
  # secrets collection 03 consumes.
  #
  # Where it does NOT work: sourcing leg 2's AZURE_CLIENT_SECRET from the vault.
  # That secret is what authenticates to the vault, so reading it from there is
  # circular. Leg 2's three values have to come from pipeline variables (or a
  # non-vault-linked group) - which is exactly why leg 1 is the better story:
  # federation means there is no client secret to store in the first place.
  # ---------------------------------------------------------------------------
