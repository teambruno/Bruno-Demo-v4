# Bruno CLI x GitHub Actions - Conference 2026 kit
#
#   Overview  https://docs.usebruno.com/bru-cli/overview
#   Docker    https://docs.usebruno.com/bru-cli/docker
#   Options   https://docs.usebruno.com/bru-cli/commandOptions
#   Reporters https://docs.usebruno.com/bru-cli/builtInReporters
#   Secrets   https://docs.usebruno.com/bru-cli/secret-managers
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   BRUNO_GLOBAL_API_KEY  - read by environments/Globals-CI.yml as
#                           {{process.env.BRUNO_GLOBAL_API_KEY}}
#
#   AZURE_CLIENT_ID       - the `vault` job at the bottom. An app registration
#   AZURE_TENANT_ID         holding the "Key Vault Secrets User" role on
#   AZURE_SUBSCRIPTION_ID   bruno-demo-kv. Both legs of that job use all four;
#   AZURE_CLIENT_SECRET     see the az login step for the OIDC alternative,
#                           which drops the need for AZURE_CLIENT_SECRET.
#
# Optional repository variables, same screen:
#   PUBLISH_PAGES = true        - also publish the HTML reports to GitHub Pages
#   RUN_AZURE_VAULT_DEMO = true - enable the `vault` job. Off by default so a
#                                 fork without an Azure tenant stays green.

name: Bruno CLI

on:
  push:
    branches: [main, conference-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bruno-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  # Official image, pinned. Also published as ghcr.io/usebruno/cli, and as
  # :4, :latest and :4.0.0-debian if you'd rather track a moving tag.
  BRUNO_CLI_IMAGE: usebruno/cli:4.0.0
  # Workspace-level environment: environments/Globals-CI.yml
  BRU_GLOBAL_ENV: Globals-CI
  # Path back to the workspace root from a collection root, so --global-env resolves
  BRU_WORKSPACE_PATH: "../.."
  REPORT_DIR: reports

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 - `bru run` on its own, no matrix, no arg building, no reporters
  #
  # This is the whole CLI: point it at a request or a folder, pick an
  # environment, and it runs your tests. Everything after this job is the same
  # command with more flags on it.
  # ---------------------------------------------------------------------------
  basics:
    name: bru basics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bru run
        run: |
          # `bru` below is the pinned CLI image with a given folder mounted at /c
          bru() { docker run --rm -v "$1:/c" -w /c "$BRUNO_CLI_IMAGE" "${@:2}"; }
          core="$GITHUB_WORKSPACE/collections/01 - Core"
          adv="$GITHUB_WORKSPACE/collections/02 - Advanced"

          bru "$core" --version

          # One request, one environment
          bru "$core" run "01-Requests/01-Get Pokemon.yml" --env Demo

          # Same request, one variable overridden at run time
          bru "$core" run "01-Requests/01-Get Pokemon.yml" --env Demo --env-var pokemonName=snorlax

          # A whole folder, in sequence
          bru "$core" run "01-Requests" --env Demo

          # Four requests where each uses a variable the previous one set
          bru "$adv" run "01-Chaining" --env CI

  # ---------------------------------------------------------------------------
  # Stage 2 - fast gate: only requests tagged `smoke`, stop at the first failure
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (${{ matrix.slug }})
    needs: basics
    runs-on: ubuntu-latest
    strategy:
      # false so one red collection still shows you the other, which reads
      # better on a call than GitHub cancelling the sibling mid-demo.
      fail-fast: false
      matrix:
        include:
          - slug: core
            collection: "01 - Core"
            env: Demo
          - slug: advanced
            collection: "02 - Advanced"
            env: CI
    steps:
      - uses: actions/checkout@v7
      - name: bru run
        env:
          BRUNO_GLOBAL_API_KEY: ${{ secrets.BRUNO_GLOBAL_API_KEY }}
          BRU_COLLECTION: ${{ matrix.collection }}
          BRU_ENV: ${{ matrix.env }}
          BRU_NAME: smoke-${{ matrix.slug }}
          BRU_TARGET: ""
          BRU_ARGS: "-r --tags smoke --bail"
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$REPORT_DIR"

          # --user root: the image's default user is uid 1000 (node) but the
          # runner workspace is owned by uid 1001, so the container cannot
          # write its reports into the mount otherwise.
          cmd=(docker run --rm --user root
               -v "$GITHUB_WORKSPACE:/ws"
               -w "/ws/collections/$BRU_COLLECTION"
               -e "BRUNO_GLOBAL_API_KEY=${BRUNO_GLOBAL_API_KEY:-}"
               "$BRUNO_CLI_IMAGE" run)

          # Quoted: folder names in this workspace contain spaces.
          if [[ -n "$BRU_TARGET" ]]; then cmd+=("$BRU_TARGET"); fi
          # Deliberately unquoted - a multi-flag string that must split into
          # separate argv entries.
          if [[ -n "$BRU_ARGS" ]];   then cmd+=($BRU_ARGS);   fi

          cmd+=(--env "$BRU_ENV"
                --global-env "$BRU_GLOBAL_ENV"
                --workspace-path "$BRU_WORKSPACE_PATH"
                --reporter-html  "/ws/$REPORT_DIR/$BRU_NAME.html"
                --reporter-json  "/ws/$REPORT_DIR/$BRU_NAME.json"
                --reporter-junit "/ws/$REPORT_DIR/$BRU_NAME.xml"
                --reporter-skip-headers authorization
                --reporter-skip-headers x-api-key)

          "${cmd[@]}"; rc=$?
          # Reports come back root-owned; hand them to the runner user so
          # upload-artifact can read them.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/$REPORT_DIR" || true
          exit $rc

      - uses: actions/upload-artifact@v7
        if: always() # keep the reports even when the run goes red
        with:
          name: bruno-reports-smoke-${{ matrix.slug }}
          path: ${{ env.REPORT_DIR }}/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 3 - the suite, one job per slice, all running in parallel
  #
  # "03 - Secrets and OpenAPI / 01-Secret-Manager" is deliberately NOT in this
  # matrix: its environments bind to live secret managers and every request
  # needs data-plane credentials the pipeline does not hold. The `vault` job at
  # the bottom runs it against Azure Key Vault once the runner has an identity.
  #
  # "02-Local-Secrets" is also absent - it reads the workspace `.env`, which is
  # gitignored and never reaches a runner.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.slug }}
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # -- regression: --tags matches requests with ALL listed tags,
          #    --exclude-tags drops ANY.
          #    NOTE: --exclude-tags takes ONE comma-separated value. Repeating
          #    the flag fails with "excludeTags.split is not a function".
          - slug: regression-core
            collection: "01 - Core"
            env: Demo
            args: "-r --tags regression --exclude-tags slow"
          - slug: regression-advanced
            collection: "02 - Advanced"
            env: CI
            args: "-r --tags regression --exclude-tags slow"

          # -- shared-scripts: require()-ing /shared-scripts through
          #    additionalContextRoots needs the developer sandbox (the default
          #    has been `safe` since CLI 3.0.0)
          - slug: shared-scripts
            collection: "01 - Core"
            env: Demo
            args: "-r --tags shared-scripts --sandbox developer"

          # -- data-driven: 4 CSV rows -> 4 iterations, each its own section in
          #    the report. Swap the flag for
          #    --json-file-path 02-Data-Driven/pokemon.json to drive the same
          #    four rows from JSON instead.
          - slug: data-driven
            collection: "02 - Advanced"
            env: CI
            target: "02-Data-Driven"
            args: "-r --csv-file-path 02-Data-Driven/pokemon.csv"

          # -- openapi: fetches the live Petstore spec and fails if an operation
          #    this collection depends on has been removed. Tests a contract
          #    rather than an implementation, and needs no credentials.
          - slug: openapi-contract
            collection: "03 - Secrets and OpenAPI"
            env: Demo-Local
            target: "03-OpenAPI"
            args: "-r"
    steps:
      - uses: actions/checkout@v7
      - name: bru run
        env:
          BRUNO_GLOBAL_API_KEY: ${{ secrets.BRUNO_GLOBAL_API_KEY }}
          BRU_COLLECTION: ${{ matrix.collection }}
          BRU_ENV: ${{ matrix.env }}
          BRU_NAME: ${{ matrix.slug }}
          BRU_TARGET: ${{ matrix.target }}
          BRU_ARGS: ${{ matrix.args }}
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$REPORT_DIR"

          cmd=(docker run --rm --user root
               -v "$GITHUB_WORKSPACE:/ws"
               -w "/ws/collections/$BRU_COLLECTION"
               -e "BRUNO_GLOBAL_API_KEY=${BRUNO_GLOBAL_API_KEY:-}"
               "$BRUNO_CLI_IMAGE" run)

          if [[ -n "$BRU_TARGET" ]]; then cmd+=("$BRU_TARGET"); fi
          if [[ -n "$BRU_ARGS" ]];   then cmd+=($BRU_ARGS);   fi

          cmd+=(--env "$BRU_ENV"
                --global-env "$BRU_GLOBAL_ENV"
                --workspace-path "$BRU_WORKSPACE_PATH"
                --reporter-html  "/ws/$REPORT_DIR/$BRU_NAME.html"
                --reporter-json  "/ws/$REPORT_DIR/$BRU_NAME.json"
                --reporter-junit "/ws/$REPORT_DIR/$BRU_NAME.xml"
                --reporter-skip-headers authorization
                --reporter-skip-headers x-api-key)

          "${cmd[@]}"; rc=$?
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/$REPORT_DIR" || true
          exit $rc

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bruno-reports-${{ matrix.slug }}
          path: ${{ env.REPORT_DIR }}/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 4 - collect every report into one artifact and a run summary
  #
  # GitHub has no native JUnit viewer, so where GitLab feeds the MR "Tests" tab
  # with `reports: junit:`, this builds the same numbers into the run summary
  # from the JSON reporter. No third-party action required.
  # ---------------------------------------------------------------------------
  report:
    needs: [smoke, test]
    if: always() # the report matters most when the suite failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bruno-reports-*
          merge-multiple: true
          path: reports

      - name: Build summary and index
        run: |
          set -uo pipefail
          mkdir -p public
          cp reports/* public/ 2>/dev/null || true

          {
            echo "## Bruno CLI reports"
            echo
            echo "\`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA:0:7}\`"
            echo
            echo "| Job | Status | Requests | Tests | Assertions |"
            echo "|---|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          # The JSON reporter emits an array of iterations, each with its own
          # .summary - so a data-driven run with 4 CSV rows has 4 entries.
          # Totals are summed across them.
          for f in reports/*.json; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .json)
            jq -r --arg n "$name" '
              [.[].summary] |
              (map(.failedRequests + .errorRequests) | add) as $fail |
              (map(.failedTests + .failedAssertions) | add) as $tfail |
              "| \($n) | \(if ($fail + $tfail) > 0 then "❌ fail" else "✅ pass" end) " +
              "| \(map(.passedRequests)|add)/\(map(.totalRequests)|add) " +
              "| \(map(.passedTests)|add)/\(map(.totalTests)|add) " +
              "| \(map(.passedAssertions)|add)/\(map(.totalAssertions)|add) |"
            ' "$f" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo "<!doctype html><meta charset=\"utf-8\">"
            echo "<title>Bruno CLI reports - ${GITHUB_SHA:0:7}</title>"
            echo "<h1>Bruno CLI reports</h1>"
            echo "<p><a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">Run #${GITHUB_RUN_NUMBER}</a>"
            echo " &middot; ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}</p><ul>"
            for f in public/*.html; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              [ "$name" = "index.html" ] && continue
              echo "<li><a href=\"$name\">$name</a></li>"
            done
            echo "</ul>"
          } > public/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: bruno-reports-all
          path: public/
          retention-days: 30

      # Off unless you set the PUBLISH_PAGES repository variable to "true" AND
      # enable Pages (Settings > Pages > Source: Actions) - so a repo without
      # Pages configured never goes red over it.
      - uses: actions/configure-pages@v6
        if: vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main'
        with:
          path: public/
      - uses: actions/deploy-pages@v5
        if: vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main'

  # ---------------------------------------------------------------------------
  # Stage 5 - Azure Key Vault, two ways to authenticate
  #
  #   https://docs.usebruno.com/bru-cli/secret-managers
  #
  # "03 - Secrets and OpenAPI / 01-Secret-Manager" reads its credentials out of
  # a real vault instead of out of the repo. Its Demo-Azure.yml binds the alias
  # `secretStore` to the Key Vault, and nothing else:
  #
  #   externalSecrets:
  #     type: azure-key-vault
  #     variables:
  #       - name: secretStore
  #         vaultName: bruno-demo-kv
  #
  # Requests then use {{secretStore.oauth-client-secret}} the same way they use
  # any other variable. Note what is NOT in the collection: how to log in. That
  # lives in the file behind --secrets-env-file, which is why the identical
  # collection runs on a laptop and on a runner with no edits - only the file
  # changes. Values are resolved at run time and never written to disk.
  #
  # The matrix is the demo: same requests, same vault, two ways in.
  #
  #   azure-cli        `az login`, then no --secrets-env-file at all. For an
  #                    azure-key-vault environment with no provider config the
  #                    CLI falls back to the Azure CLI credential, so the login
  #                    session IS the configuration.
  #   secrets-env-file service principal credentials rendered from Actions
  #                    secrets at run time. Needs no az binary and no session,
  #                    so this is the path for runners or containers that have
  #                    no Azure CLI on them.
  # ---------------------------------------------------------------------------
  vault:
    name: azure key vault (${{ matrix.auth }})
    needs: test
    # Off unless you set the RUN_AZURE_VAULT_DEMO repository variable to "true",
    # so a checkout without an Azure tenant behind it never goes red here.
    if: always() && vars.RUN_AZURE_VAULT_DEMO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # federated login below mints an OIDC token for Entra ID
    strategy:
      fail-fast: false
      matrix:
        auth: [azure-cli, secrets-env-file]
    steps:
      - uses: actions/checkout@v7

      # Leg 1 only. Signs in with the app registration's client secret, which is
      # what the four AZURE_* repository secrets already describe.
      #
      # Prefer federated credentials (OIDC) if you can: the runner then trades
      # its own token for a short-lived Entra ID one and the repo holds no Azure
      # password at all. Register the subject once -
      #
      #   az ad app federated-credential create --id <AZURE_CLIENT_ID> --parameters '{
      #     "name": "github-bruno-demo-main",
      #     "issuer": "https://token.actions.githubusercontent.com",
      #     "subject": "repo:teambruno/Bruno-Demo-v4:ref:refs/heads/main",
      #     "audiences": ["api://AzureADTokenExchange"]
      #   }'
      #
      # - then replace the `creds:` line below with these three:
      #
      #   client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #   tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #   subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #
      # Without that registration azure/login fails with AADSTS70025 ("has no
      # configured federated identity credentials").
      - name: az login
        if: matrix.auth == 'azure-cli'
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Leg 2 only. ci/azure-keyvault-service-principal.env.tpl is committed with
      # placeholders; the real values arrive as Actions secrets and are
      # substituted in here. The rendered file is written to RUNNER_TEMP - it
      # never exists inside the checkout, so it cannot be committed by accident
      # or swept into an artifact by the upload step below.
      - name: Render secrets env file from repository secrets
        if: matrix.auth == 'secrets-env-file'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          # envsubst turns an unset secret into an empty value, and the CLI
          # would then fail somewhere less obvious. Say it here instead.
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [[ -n "${!v}" ]] || { echo "::error::repository secret $v is unset"; exit 1; }
          done

          # 600 before anything is written, and the explicit variable list keeps
          # envsubst from expanding anything else that happens to be in scope.
          install -m 600 /dev/null "$RUNNER_TEMP/azure-keyvault-service-principal.env"
          envsubst '${AZURE_TENANT_ID} ${AZURE_CLIENT_ID} ${AZURE_CLIENT_SECRET}' \
            < ci/azure-keyvault-service-principal.env.tpl \
            > "$RUNNER_TEMP/azure-keyvault-service-principal.env"

      # Native install rather than the container the other jobs use: Azure CLI
      # auth needs the `az` binary and its login session, both of which are on
      # the runner and neither of which is in usebruno/cli. The service-principal
      # leg has no such constraint and would run fine in the image - mount the
      # rendered file in with -v and pass the container path.
      - name: Install Bruno CLI
        run: |
          # Version tracks BRUNO_CLI_IMAGE above so the two cannot drift apart.
          npm install -g "@usebruno/cli@${BRUNO_CLI_IMAGE##*:}"
          bru --version

      - name: bru run
        env:
          BRU_AUTH: ${{ matrix.auth }}
          BRU_NAME: vault-${{ matrix.auth }}
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$REPORT_DIR"

          cd "$GITHUB_WORKSPACE/collections/03 - Secrets and OpenAPI"

          cmd=(bru run "01-Secret-Manager" -r --env Demo-Azure)

          # The only difference between the two legs. Leg 1 adds nothing and
          # rides the az login session; leg 2 points at the rendered file.
          # Same command, same environment, same collection.
          if [[ "$BRU_AUTH" != "azure-cli" ]]; then
            cmd+=(--secrets-env-file "$RUNNER_TEMP/azure-keyvault-service-principal.env")
          fi

          # --verbose is not optional here. A vault fetch that fails - bad
          # credentials, no data-plane role, wrong vault name - is caught and
          # swallowed, so without this the run just reports ordinary 401s from
          # the API under test and never says the vault was the problem. It logs
          # the vault name and whether each fetch succeeded, never a secret
          # value, and "1. Fetched secret for: bruno-demo-kv" is worth pointing
          # at on a call anyway.
          cmd+=(--verbose
                --global-env "$BRU_GLOBAL_ENV"
                --workspace-path "$BRU_WORKSPACE_PATH"
                --reporter-html  "$GITHUB_WORKSPACE/$REPORT_DIR/$BRU_NAME.html"
                --reporter-json  "$GITHUB_WORKSPACE/$REPORT_DIR/$BRU_NAME.json"
                --reporter-junit "$GITHUB_WORKSPACE/$REPORT_DIR/$BRU_NAME.xml"
                --reporter-skip-headers authorization
                --reporter-skip-headers x-api-key
                --reporter-skip-headers x-secret-probe)

          "${cmd[@]}"

      # RUNNER_TEMP is wiped with the runner anyway, but on a self-hosted runner
      # it may not be. Drop the file the moment it stops being needed.
      - name: Remove rendered credentials
        if: always() && matrix.auth == 'secrets-env-file'
        run: rm -f "$RUNNER_TEMP/azure-keyvault-service-principal.env"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bruno-reports-vault-${{ matrix.auth }}
          path: ${{ env.REPORT_DIR }}/
          retention-days: 30
