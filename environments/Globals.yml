name: Globals
color: "#607D8B"
variables:
  - name: baseUrl
    value: https://jsonplaceholder.typicode.com
    description: Fallback base URL - any collection environment shadows this
  - name: apiVersion
    value: v1
    description: API version pinned workspace-wide
  - name: releaseStage
    value: production
    description: Also set in every collection env - demonstrates the precedence chain
  - name: debugMode
    value: "false"
    description: Verbose console logging in pre/post-request scripts
  - name: tenantId
    value: bruno-demo
    description: Multi-tenant identifier, sent as the X-Tenant-Id header
  - name: requestTimeout
    value: "10000"
    description: Default per-request timeout in milliseconds
  - name: retryCount
    value: "0"
    description: Script-level retry attempts for flaky endpoints
  - name: correlationIdPrefix
    value: prod
    description: Prefix for the generated X-Correlation-Id header
  - secret: true
    name: globalApiKey
    description: Workspace-wide API key - value is never written to the repo
