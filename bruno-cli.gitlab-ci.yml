# Bruno CLI x GitLab CI - Conference 2026 kit
#
# Runs the CI-safe parts of the three collections with the official Bruno CLI
# Docker image and publishes HTML + JSON + JUnit reports on every pipeline.
#
#   Overview  https://docs.usebruno.com/bru-cli/overview
#   Docker    https://docs.usebruno.com/bru-cli/docker
#   Options   https://docs.usebruno.com/bru-cli/commandOptions
#   Reporters https://docs.usebruno.com/bru-cli/builtInReporters
#
# Optional CI/CD variable (Settings > CI/CD > Variables, masked):
#   BRUNO_GLOBAL_API_KEY - read by environments/Globals-CI.yml as
#                          {{process.env.BRUNO_GLOBAL_API_KEY}}
#
# What is deliberately NOT here:
#   "03 - Secrets and OpenAPI / 01-Secret-Manager" needs live vault credentials
#     - see the `vault` job in .github/workflows/bruno-cli.yml for that shape.
#   "03 - Secrets and OpenAPI / 02-Local-Secrets" needs the workspace .env,
#     which is gitignored and never reaches a runner.
#   "02 - Advanced / 05-Beyond-REST" WebSocket, SSE and gRPC requests are
#     app-only - the CLI cannot execute them. They carry the `app-only` tag.

stages:
  - basics
  - smoke
  - test
  - report

variables:
  # Official image, pinned. Also published as ghcr.io/usebruno/cli, and as
  # :4, :latest and :4.0.0-debian if you'd rather track a moving tag.
  BRUNO_CLI_IMAGE: "usebruno/cli:4.0.0"
  # Workspace-level environment: environments/Globals-CI.yml
  BRU_GLOBAL_ENV: "Globals-CI"
  # Path back to the workspace root from a collection root, so --global-env resolves
  BRU_WORKSPACE_PATH: "../.."
  REPORT_DIR: "reports"
  GIT_DEPTH: "1"

default:
  image:
    name: "$BRUNO_CLI_IMAGE"
    # The image's ENTRYPOINT is `bru`; GitLab needs a shell to run `script:`
    entrypoint: [""]
  interruptible: true

# ---------------------------------------------------------------------------
# Shared job template
#
# Every job sets $COLLECTION + $BRU_ENV, optionally $BRU_TARGET (a folder inside
# the collection) and $BRU_ARGS, then gets all three reporters for free.
# Reports are named after the job, so parallel jobs never overwrite each other.
# ---------------------------------------------------------------------------
.bru:
  before_script:
    - bru --version
    - mkdir -p "$CI_PROJECT_DIR/$REPORT_DIR"
    - cd "$CI_PROJECT_DIR/collections/$COLLECTION"
  script:
    # ${BRU_TARGET:+"..."} keeps folder names with spaces quoted, and disappears
    # entirely when a job runs the whole collection.
    - |
      bru run ${BRU_TARGET:+"$BRU_TARGET"} $BRU_ARGS \
        --env "$BRU_ENV" \
        --global-env "$BRU_GLOBAL_ENV" \
        --workspace-path "$BRU_WORKSPACE_PATH" \
        --reporter-html  "$CI_PROJECT_DIR/$REPORT_DIR/$CI_JOB_NAME_SLUG.html" \
        --reporter-json  "$CI_PROJECT_DIR/$REPORT_DIR/$CI_JOB_NAME_SLUG.json" \
        --reporter-junit "$CI_PROJECT_DIR/$REPORT_DIR/$CI_JOB_NAME_SLUG.xml" \
        --reporter-skip-headers authorization \
        --reporter-skip-headers x-api-key
  artifacts:
    when: always # the reports matter most when the suite failed
    expire_in: 30 days
    paths:
      - "$REPORT_DIR/"
    reports:
      junit: "$REPORT_DIR/$CI_JOB_NAME_SLUG.xml"

# Fan-out template: the two collections that run with no credentials at all.
#
# NOTE on --exclude-tags: it takes ONE comma-separated value. Repeating the
# flag fails with "excludeTags.split is not a function" on bru 4.0.0.
.ci-safe-collections:
  extends: .bru
  parallel:
    matrix:
      - COLLECTION: "01 - Core"
        BRU_ENV: "Demo"
      - COLLECTION: "02 - Advanced"
        BRU_ENV: "CI"

# ---------------------------------------------------------------------------
# Stage 1 - `bru run` on its own. No matrix, no arg building, no reporters.
#
# Four commands, each its own line in the log. This is the whole CLI: point it
# at a request or a folder, pick an environment, and it runs your tests.
# Everything after this job is the same command with more flags on it.
# ---------------------------------------------------------------------------
bru-basics:
  stage: basics
  script:
    - cd "$CI_PROJECT_DIR/collections/01 - Core"
    - bru --version

    # One request, one environment
    - bru run "01-Requests/01-Get Pokemon.yml" --env Demo

    # Same request, one variable overridden at run time
    - bru run "01-Requests/01-Get Pokemon.yml" --env Demo --env-var pokemonName=snorlax

    # A whole folder, in sequence
    - bru run "01-Requests" --env Demo

    # Four requests where each one uses a variable the previous one set
    - cd "$CI_PROJECT_DIR/collections/02 - Advanced"
    - bru run "01-Chaining" --env CI

# ---------------------------------------------------------------------------
# Stage 2 - fast gate: only requests tagged `smoke`, stop at the first failure
# ---------------------------------------------------------------------------
smoke:
  stage: smoke
  extends: .ci-safe-collections
  variables:
    BRU_ARGS: "-r --tags smoke --bail"

# ---------------------------------------------------------------------------
# Stage 3 - the fuller suite and the feature-specific runs
# ---------------------------------------------------------------------------
regression:
  stage: test
  extends: .ci-safe-collections
  variables:
    # --tags matches requests carrying ALL listed tags; --exclude-tags drops
    # any request carrying ANY of them.
    BRU_ARGS: "-r --tags regression --exclude-tags slow"

shared-scripts:
  stage: test
  extends: .bru
  variables:
    COLLECTION: "01 - Core"
    BRU_ENV: "Demo"
    # require()-ing /shared-scripts through additionalContextRoots needs the
    # developer sandbox - the default has been `safe` since CLI 3.0.0.
    BRU_ARGS: "-r --tags shared-scripts --sandbox developer"

data-driven:
  stage: test
  extends: .bru
  variables:
    COLLECTION: "02 - Advanced"
    BRU_ENV: "CI"
    BRU_TARGET: "02-Data-Driven"
    # 4 CSV rows -> 4 iterations, each its own section in the report. Swap for
    # --json-file-path 02-Data-Driven/pokemon.json to drive the same four rows
    # from JSON instead.
    BRU_ARGS: "-r --csv-file-path 02-Data-Driven/pokemon.csv"

openapi-contract:
  stage: test
  extends: .bru
  variables:
    COLLECTION: "03 - Secrets and OpenAPI"
    BRU_ENV: "Demo-Local"
    BRU_TARGET: "03-OpenAPI"
    BRU_ARGS: "-r"
  # Fetches the live Petstore spec and fails if an operation this collection
  # depends on has been removed. The one job here that tests a contract rather
  # than an implementation - and it needs no credentials.

# ---------------------------------------------------------------------------
# Stage 4 - publish the HTML reports as a GitLab Pages site
# ---------------------------------------------------------------------------
pages:
  stage: report
  needs:
    - job: smoke
      artifacts: true
    - job: regression
      artifacts: true
    - job: shared-scripts
      artifacts: true
    - job: data-driven
      artifacts: true
    - job: openapi-contract
      artifacts: true
  script:
    - mkdir -p public
    - cp "$REPORT_DIR"/*.html public/ 2>/dev/null || true
    - cp "$REPORT_DIR"/*.json public/ 2>/dev/null || true
    - |
      {
        echo '<!doctype html><meta charset="utf-8">'
        echo "<title>Bruno CLI reports - ${CI_COMMIT_SHORT_SHA}</title>"
        echo "<h1>Bruno CLI reports</h1>"
        echo "<p>${CI_COMMIT_REF_NAME} @ ${CI_COMMIT_SHORT_SHA}</p><ul>"
        for f in public/*.html; do
          [ -e "$f" ] || continue
          name=$(basename "$f")
          [ "$name" = "index.html" ] && continue
          echo "<li><a href=\"$name\">$name</a></li>"
        done
        echo "</ul>"
      } > public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
