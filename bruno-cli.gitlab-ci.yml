# Bruno CLI x GitLab CI - Bruno V4 Demo Kit
#
# Runs the three collections in this workspace with the official Bruno CLI
# Docker image and publishes HTML + JSON + JUnit reports on every pipeline.
#
#   Overview  https://docs.usebruno.com/bru-cli/overview
#   Docker    https://docs.usebruno.com/bru-cli/docker
#   Options   https://docs.usebruno.com/bru-cli/commandOptions
#   Reporters https://docs.usebruno.com/bru-cli/builtInReporters
#
# Optional CI/CD variable (Settings > CI/CD > Variables, masked):
#   BRUNO_GLOBAL_API_KEY - read by environments/Globals-CI.yml as
#                          {{process.env.BRUNO_GLOBAL_API_KEY}}

stages:
  - smoke
  - test
  - report

variables:
  # Official image, pinned. Also published as ghcr.io/usebruno/cli, and as
  # :4, :latest and :4.0.0-debian if you'd rather track a moving tag.
  BRUNO_CLI_IMAGE: "usebruno/cli:4.0.0"
  # Workspace-level environment: environments/Globals-CI.yml
  BRU_GLOBAL_ENV: "Globals-CI"
  # Path back to the workspace root from a collection root, so --global-env resolves
  BRU_WORKSPACE_PATH: "../.."
  REPORT_DIR: "reports"
  GIT_DEPTH: "1"

default:
  image:
    name: "$BRUNO_CLI_IMAGE"
    # The image's ENTRYPOINT is `bru`; GitLab needs a shell to run `script:`
    entrypoint: [""]
  interruptible: true

# ---------------------------------------------------------------------------
# Shared job template
#
# Every job sets $COLLECTION + $BRU_ENV, optionally $BRU_TARGET (a folder inside
# the collection) and $BRU_ARGS, then gets all three reporters for free.
# Reports are named after the job, so parallel jobs never overwrite each other.
# ---------------------------------------------------------------------------
.bru:
  before_script:
    - bru --version
    - mkdir -p "$CI_PROJECT_DIR/$REPORT_DIR"
    - cd "$CI_PROJECT_DIR/collections/$COLLECTION"
  script:
    # ${BRU_TARGET:+"..."} keeps folder names with spaces quoted, and disappears
    # entirely when a job runs the whole collection.
    - |
      bru run ${BRU_TARGET:+"$BRU_TARGET"} $BRU_ARGS $BRU_ENV_VARS \
        --env "$BRU_ENV" \
        --global-env "$BRU_GLOBAL_ENV" \
        --workspace-path "$BRU_WORKSPACE_PATH" \
        --reporter-html  "$CI_PROJECT_DIR/$REPORT_DIR/$CI_JOB_NAME_SLUG.html" \
        --reporter-json  "$CI_PROJECT_DIR/$REPORT_DIR/$CI_JOB_NAME_SLUG.json" \
        --reporter-junit "$CI_PROJECT_DIR/$REPORT_DIR/$CI_JOB_NAME_SLUG.xml" \
        --reporter-skip-headers authorization \
        --reporter-skip-headers x-api-key
  artifacts:
    name: "bruno-reports-$CI_JOB_NAME_SLUG"
    when: always          # keep the reports even when the run goes red
    expire_in: 30 days
    paths:
      - $REPORT_DIR/      # browse the HTML + JSON reports from the job page
    reports:
      junit: $REPORT_DIR/*.xml   # feeds the pipeline / MR "Tests" tab
                                 # V4: JUnit classname is now the collection
                                 # path, so staging and prod runs of the same
                                 # request no longer show up as duplicates.

# The three collections from workspace.yml.
# "02 - Auth and Scripting"'s Prod-Env.yml is deliberately bare in this demo
# workspace, so CI injects the endpoints it needs with --env-var (repeatable).
.all-collections:
  parallel:
    matrix:
      - COLLECTION: "01 - Fundamentals"
        BRU_ENV: "Production"
      - COLLECTION: "02 - Auth and Scripting"
        BRU_ENV: "Prod-Env"
        BRU_ENV_VARS: >-
          --env-var weatherUrl=https://api.open-meteo.com/v1
          --env-var breweryUrl=https://api.openbrewerydb.org/v1
          --env-var userId=1
      - COLLECTION: "03 - CLI CI and V4 Features"
        BRU_ENV: "Production"

# ---------------------------------------------------------------------------
# Stage 1 - fast gate: only requests tagged `smoke`, stop at the first failure
# ---------------------------------------------------------------------------
smoke:
  stage: smoke
  extends: [.bru, .all-collections]
  variables:
    BRU_ARGS: "-r --tags smoke --bail"

# ---------------------------------------------------------------------------
# Stage 2 - the suite, one job per collection, all running in parallel
# ---------------------------------------------------------------------------
regression:
  stage: test
  extends: [.bru, .all-collections]
  variables:
    # --tags matches requests with ALL listed tags, --exclude-tags drops ANY
    BRU_ARGS: "-r --tags regression --exclude-tags slow"

shared-scripts:
  stage: test
  extends: [.bru, .all-collections]
  variables:
    # require()-ing /shared-scripts via additionalContextRoots needs the
    # developer sandbox (default is `safe` since CLI 3.0.0)
    BRU_ARGS: "-r --tags shared-scripts --sandbox developer"

data-driven:
  stage: test
  extends: .bru
  variables:
    COLLECTION: "01 - Fundamentals"
    BRU_ENV: "Production"
    BRU_TARGET: "04-Data-Driven"
    BRU_ARGS: "-r --csv-file-path 04-Data-Driven/users.csv"
  # 5 CSV rows -> 5 iterations, each one a row in the report. The request's
  # tests read their row with bru.getVar(), which returns undefined on CLI
  # 4.0.0, so 3 of 4 tests fail per iteration - allowed to fail until the
  # collection is updated. Drop this line once it's green.
  allow_failure: true

v4-features:
  stage: test
  extends: .bru
  variables:
    COLLECTION: "03 - CLI CI and V4 Features"
    BRU_ENV: "Production"
    # Scoped to this folder on purpose: 02-Additional-Request-Types holds
    # WebSocket/gRPC/SSE requests, which the CLI can't execute ("Unsupported
    # protocol wss:") - those stay app-only demos.
    BRU_TARGET: "03-v4 Updates"
    BRU_ARGS: "-r --sandbox developer"

# ---------------------------------------------------------------------------
# Stage 3 - publish the HTML reports to GitLab Pages with a small index
# ---------------------------------------------------------------------------
pages:
  stage: report
  script:
    - mkdir -p public
    - cp "$REPORT_DIR"/* public/ 2>/dev/null || true
    - |
      {
        echo "<!doctype html><meta charset=\"utf-8\">"
        echo "<title>Bruno CLI reports - $CI_COMMIT_SHORT_SHA</title>"
        echo "<h1>Bruno CLI reports</h1>"
        echo "<p><a href=\"$CI_PIPELINE_URL\">Pipeline #$CI_PIPELINE_IID</a>"
        echo " &middot; $CI_COMMIT_REF_NAME @ $CI_COMMIT_SHORT_SHA</p><ul>"
        for f in public/*.html; do
          name=$(basename "$f")
          [ "$name" = "index.html" ] && continue
          echo "<li><a href=\"$name\">$name</a></li>"
        done
        echo "</ul>"
      } > public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always        # the report matters most when the suite failed
